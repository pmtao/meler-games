// 物理建模引擎声部：一个 AudioWorklet 节点 → 低通 → 音量；另附涡轮啸叫、泄压阀、回火
class EngineVoice {
  constructor(fx, carId) {
    const ctx = fx.ctx;
    this.fx = fx;
    this.node = new AudioWorkletNode(ctx, 'pelican-engine', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1], processorOptions: ENGINE_MODELS[carId] });
    this.rpmParam = this.node.parameters.get('rpm');
    this.thrParam = this.node.parameters.get('throttle');
    this.filter = ctx.createBiquadFilter();
    this.filter.type = 'lowpass';
    this.out = ctx.createGain();
    this.out.gain.value = 0;
    this.node.connect(this.filter).connect(this.out).connect(fx.master);
    // 排气音浪：并联一路低通 → 软削波 → 低频加厚，跟着油门涌起来
    this.exLp = ctx.createBiquadFilter();
    this.exLp.type = 'lowpass';
    this.exLp.Q.value = 0.7;
    this.exShaper = ctx.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = (i / 1023) * 2 - 1; curve[i] = Math.tanh(x * 3) / Math.tanh(3); }
    this.exShaper.curve = curve;
    this.exShelf = ctx.createBiquadFilter();
    this.exShelf.type = 'lowshelf';
    this.exShelf.frequency.value = 180;
    this.exShelf.gain.value = 6;
    this.exGain = ctx.createGain();
    this.exGain.gain.value = 0;
    this.node.connect(this.exLp).connect(this.exShaper).connect(this.exShelf).connect(this.exGain).connect(fx.master);
    this.carId = null;
    this.setCar(carId);
  }

  // 换车：先淡出，再把新车的参数发给 worklet 重建气缸和管路
  setCar(carId) {
    if (carId === this.carId) return;
    const first = this.carId === null;
    this.carId = carId;
    this.p = ENGINE_MODELS[carId];
    this.rpm = this.p.idle;
    this.thr = 0; this.lastThrottle = 0; this.popT = 0; this.muteT = 0;
    this.filter.Q.value = this.p.q;
    if (!first) {
      this.muteT = 0.08;
      this.out.gain.setTargetAtTime(0, this.fx.ctx.currentTime, 0.02);
      setTimeout(() => this.node.port.postMessage(this.p), 60);
    }
  }

  update(dt, { rpmN, throttle, volume, pitch = 1, active }) {
    const now = this.fx.ctx.currentTime, p = this.p;
    const target = p.idle + (p.red - p.idle) * clamp(rpmN, 0, 1.05);
    this.rpm += (target - this.rpm) * Math.min(1, dt * 4);         // 转速平滑变化，音调连续
    this.thr += (throttle - this.thr) * Math.min(1, dt * (throttle > this.thr ? 9 : 5));
    const n = clamp((this.rpm - p.idle) / (p.red - p.idle), 0, 1);
    this.rpmParam.setTargetAtTime(this.rpm * pitch, now, 0.02);
    this.thrParam.setTargetAtTime(this.thr, now, 0.03);
    this.filter.frequency.setTargetAtTime(p.lp[0] + (p.lp[1] - p.lp[0]) * n * (0.4 + 0.6 * this.thr), now, 0.04);
    this.exLp.frequency.setTargetAtTime(220 + 380 * n, now, 0.05);
    if (this.muteT > 0) { this.muteT -= dt; active = false; }
    // 响度曲线：怠速约为满油门红线的 15%，收油滑行时居中
    const level = active ? p.outGain * volume * (0.15 + 0.5 * this.thr + 0.35 * n) : 0;
    this.out.gain.setTargetAtTime(level, now, active ? 0.06 : 0.15);
    const roar = active ? p.outGain * p.exhaust * volume * this.thr * (0.35 + 0.65 * n) * 0.22 : 0;
    this.exGain.gain.setTargetAtTime(roar, now, active ? 0.08 : 0.15);
    if (active && this.lastThrottle && !throttle) {
      if (p.bov && n > 0.35) this.fx.burst({ duration: 0.3, type: 'bandpass', frequency: 1400, gain: 0.08 * volume * n });
      if (n > 0.45) this.popT = 0.7;
    }
    if (active && this.popT > 0) {
      this.popT -= dt;
      if (Math.random() < dt * 12 * p.pops) {
        this.fx.burst({ duration: 0.04 + Math.random() * 0.05, type: 'lowpass', frequency: 600 + Math.random() * 800, gain: (0.2 + Math.random() * 0.25) * volume * p.pops });
      }
    }
    this.lastThrottle = throttle;
  }
}

const SONG_BARS = 32;

class MusicBox {
  constructor(fx) {
    this.fx = fx;
    const ctx = fx.ctx;
    this.bus = ctx.createGain();
    this.bus.gain.value = 0;
    this.bus.connect(fx.comp);
    this.on = false;
    this.level = 0.16;
    this.songIndex = -1;
    this.pickSong();
  }

  // 随机选一首和当前不同的曲子，并生成它的主旋律
  pickSong(index = null) {
    let next = index;
    while (next === null || (next === this.songIndex && SONGS.length > 1)) next = Math.floor(Math.random() * SONGS.length);
    this.songIndex = next;
    this.song = SONGS[next];
    this.stepDur = 60 / this.song.bpm / 4;
    this.step = 0;
    this.melody = this.makeMelody(this.song);
    this.onSong?.(this.song);
  }

  // 主旋律：每两小节一句，落在和弦音或相邻音阶上，前一句和后一句呼应
  makeMelody(song) {
    const rng = seeded(song.lead.seed);
    const out = [];
    for (let bar = 0; bar < 4; bar++) {
      const tones = song.prog[bar][1];
      for (let s = 0; s < 16; s++) {
        if (!song.lead.rhythm[s]) { out.push(null); continue; }
        const t = tones[Math.floor(rng() * tones.length)];
        out.push(t + (rng() < 0.25 ? 2 : 0) + 12 + (song.lead.octave ?? 0));
      }
    }
    return out;
  }

  start() {
    if (this.on) return;
    this.on = true;
    this.nextTime = this.fx.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.schedule(), 25);
    this.bus.gain.setTargetAtTime(this.level, this.fx.ctx.currentTime, 0.6);
  }

  stop() {
    if (!this.on) return;
    this.on = false;
    clearInterval(this.timer);
    this.bus.gain.setTargetAtTime(0, this.fx.ctx.currentTime, 0.2);
  }

  // 下一首：淡出后切换
  skip() {
    if (!this.on) return this.pickSong();
    const ctx = this.fx.ctx;
    this.bus.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
    clearInterval(this.timer);
    setTimeout(() => {
      this.pickSong();
      this.nextTime = ctx.currentTime + 0.1;
      this.timer = setInterval(() => this.schedule(), 25);
      this.bus.gain.setTargetAtTime(this.level, ctx.currentTime, 0.4);
    }, 450);
  }

  // 菜单里响一些，比赛时压低让引擎声为主
  setLevel(level) {
    if (Math.abs(level - this.level) < 0.001) return;
    this.level = level;
    if (this.on) this.bus.gain.setTargetAtTime(level, this.fx.ctx.currentTime, 0.8);
  }

  schedule() {
    const ctx = this.fx.ctx;
    while (this.nextTime < ctx.currentTime + 0.15) {
      if (this.step >= SONG_BARS * 16) {
        this.pickSong();
        this.nextTime += this.stepDur * 2;   // 两首之间留半拍
      }
      const swing = this.step % 2 === 1 ? (this.song.swing ?? 0) * this.stepDur : 0;
      this.playStep(this.step, this.nextTime + swing);
      this.nextTime += this.stepDur;
      this.step++;
    }
  }

  playStep(step, t) {
    const song = this.song;
    const s = step % 16, bar = Math.floor(step / 16);
    const [root, chord] = song.prog[bar % song.prog.length];
    // 编排分段
    const intro = bar < 4, breakdown = bar >= 20 && bar < 24, climax = bar >= 24;
    const drums = !intro, kickOn = drums && !breakdown, arpOn = bar >= 12, leadOn = climax || (bar >= 16 && bar < 20);
    const fill = bar % 4 === 3 && s >= 12 && drums && !breakdown;
    if (kickOn && song.kick[s]) this.kick(t, song.kick[s]);
    if (drums && (song.snare[s] || (fill && s % 2 === 0))) this.snare(t, fill && !song.snare[s] ? 0.18 : 0.3 * (song.snare[s] || 0.6));
    if (song.hat[s]) this.hat(t, (intro ? 0.5 : 1) * 0.07 * song.hat[s], s === 14 && bar % 2 === 1);
    if (!intro && song.bass[s] !== null && !breakdown) this.bass(t, root + song.bass[s], this.stepDur * (song.bassDecay ?? 0.9));
    if (s === 0) this.pad(t, chord, this.stepDur * 16);
    if (song.stabs && drums && song.stabs[s]) this.stab(t, chord);
    if (arpOn && song.arp) {
      const notes = [...chord.map((m) => m + 12), chord[0] + 24];
      this.pluck(t, notes[song.arp[s] % notes.length], song.arpWave, climax ? 0.045 : 0.032, song.arpDecay ?? 0.14, 2600);
    }
    if (leadOn) {
      const m = this.melody[(bar % 4) * 16 + s];
      if (m) this.pluck(t, m, song.lead.wave, 0.055, song.lead.decay ?? 0.22, song.lead.cut);
    }
  }

  env(t, peak, attack, decay) {
    peak *= this.song.gain ?? 1;   // 每首曲子的响度校正
    const g = this.fx.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.connect(this.bus);
    return g;
  }

  kick(t, vel) {
    const ctx = this.fx.ctx, osc = ctx.createOscillator();
    osc.frequency.setValueAtTime(this.song.chip ? 180 : 140, t);
    osc.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    if (this.song.chip) osc.type = 'square';
    osc.connect(this.env(t, (this.song.chip ? 0.35 : 0.9) * vel, 0.003, 0.3));
    osc.start(t); osc.stop(t + 0.4);
  }

  noiseHit(t, type, freq, q, peak, decay) {
    const ctx = this.fx.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter();
    src.buffer = this.fx.noise;
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    src.connect(f).connect(this.env(t, peak, 0.002, decay));
    src.start(t, Math.random() * 1.5, decay + 0.05);
  }

  snare(t, peak) {
    this.noiseHit(t, 'bandpass', this.song.chip ? 3000 : 1900, 0.8, peak, this.song.reverbish ? 0.35 : 0.17);
    const osc = this.fx.ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    osc.connect(this.env(t, peak * 0.6, 0.002, 0.09));
    osc.start(t); osc.stop(t + 0.12);
  }

  hat(t, peak, open) {
    this.noiseHit(t, 'highpass', 7500, 0.7, peak, open ? 0.22 : 0.045);
  }

  bass(t, midi, dur) {
    const ctx = this.fx.ctx, osc = ctx.createOscillator(), f = ctx.createBiquadFilter();
    const song = this.song;
    osc.type = song.bassWave;
    osc.frequency.value = mtof(midi);
    f.type = 'lowpass'; f.Q.value = 4;
    f.frequency.setValueAtTime(song.bassCut, t);
    f.frequency.exponentialRampToValueAtTime(Math.min(song.bassCut, 220), t + dur);
    osc.connect(f).connect(this.env(t, song.bassLevel ?? 0.22, 0.005, dur));
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  pad(t, notes, dur) {
    const ctx = this.fx.ctx, song = this.song, f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = song.padCut; f.Q.value = 0.5;
    const level = (song.padLevel ?? 0.045) * (song.gain ?? 1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(level, t + 0.4);
    g.gain.setValueAtTime(level, t + dur - 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    f.connect(g).connect(this.bus);
    for (const m of notes) {
      for (const det of [-7, 7]) {
        const osc = ctx.createOscillator();
        osc.type = song.padWave;
        osc.frequency.value = mtof(m);
        osc.detune.value = det;
        osc.connect(f);
        osc.start(t); osc.stop(t + dur + 0.05);
      }
    }
  }

  // 放克的切音和弦
  stab(t, notes) {
    const ctx = this.fx.ctx, f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8;
    f.connect(this.env(t, 0.09, 0.003, 0.11));
    for (const m of notes) {
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = mtof(m + 12);
      osc.connect(f);
      osc.start(t); osc.stop(t + 0.16);
    }
  }

  pluck(t, midi, wave, peak, decay, cut) {
    const ctx = this.fx.ctx, osc = ctx.createOscillator(), f = ctx.createBiquadFilter();
    osc.type = wave;
    osc.frequency.value = mtof(midi);
    f.type = 'lowpass'; f.frequency.value = cut;
    osc.connect(f).connect(this.env(t, peak, 0.004, decay));
    osc.start(t); osc.stop(t + decay + 0.06);
  }
}

// 音效总控：初始化音频、风噪/轮胎/氮气、各种提示音、看台观众声
'use strict';

// 美式警笛：远处用 wail（约 4 秒一次、快升慢降的长扫频），逼近时切到 yelp（每秒约 4 次的快速扫频）；
// 方波 + 锯齿波经过"号角喇叭"：削波失真、去掉低频、1.9kHz 附近的共振峰，距离越远高频越闷，带多普勒变调
class SirenVoice {
  constructor(fx, phase) {
    const ctx = fx.ctx;
    this.fx = fx;
    this.phase = phase;
    this.mode = 'wail';
    this.closeT = 0;
    this.oscA = ctx.createOscillator(); this.oscA.type = 'square';
    this.oscB = ctx.createOscillator(); this.oscB.type = 'sawtooth';
    const gA = ctx.createGain(); gA.gain.value = 0.5;
    const gB = ctx.createGain(); gB.gain.value = 0.5;
    const mix = ctx.createGain();
    this.oscA.connect(gA).connect(mix);
    this.oscB.connect(gB).connect(mix);
    const shaper = ctx.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = (i / 1023) * 2 - 1; curve[i] = Math.tanh(x * 4) / Math.tanh(4); }
    shaper.curve = curve;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 450;
    const peak = ctx.createBiquadFilter(); peak.type = 'peaking'; peak.frequency.value = 1900; peak.Q.value = 1.2; peak.gain.value = 7;
    this.lp = ctx.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 3000;
    this.out = ctx.createGain(); this.out.gain.value = 0;
    mix.connect(shaper).connect(hp).connect(peak).connect(this.lp).connect(this.out).connect(fx.master);
    this.oscA.start(); this.oscB.start();
  }

  // info：{ level 0..1, pitch 多普勒系数, close 是否在近处 }，null 表示静音
  update(dt, info) {
    const now = this.fx.ctx.currentTime;
    if (!info || info.level <= 0.001) { this.out.gain.setTargetAtTime(0, now, 0.15); return; }
    // 近处持续一会儿才切到 yelp，离开一会儿才切回 wail，避免来回跳
    this.closeT = clamp(this.closeT + (info.close ? dt : -dt), 0, 2);
    if (this.mode === 'wail' && this.closeT > 1) this.mode = 'yelp';
    if (this.mode === 'yelp' && this.closeT < 0.2) this.mode = 'wail';
    let f;
    if (this.mode === 'wail') {
      this.phase += dt / 4.2;
      const u = this.phase % 1;
      const shape = u < 0.35 ? Math.sin((u / 0.35) * Math.PI / 2) : 1 - ((u - 0.35) / 0.65) ** 1.5;   // 快升、慢降
      f = 650 + 800 * shape;
    } else {
      this.phase += dt * 3.8;
      const u = this.phase % 1;
      f = 700 + 750 * (u < 0.5 ? u * 2 : 2 - u * 2);
    }
    f *= info.pitch;
    this.oscA.frequency.setTargetAtTime(f, now, 0.006);
    this.oscB.frequency.setTargetAtTime(f * 1.004, now, 0.006);
    this.lp.frequency.setTargetAtTime(1800 + 5200 * info.level, now, 0.1);
    this.out.gain.setTargetAtTime(info.level * 0.085, now, 0.08);
  }
}

class SoundFx {
  constructor() { this.ctx = null; this.enabled = true; this.musicOn = true; this.voices = {}; this.worklet = 'pending'; }

  setMusic(on) {
    this.musicOn = on;
    if (this.music) { if (on) this.music.start(); else this.music.stop(); }
  }

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 0.7 : 0;
    // 总线压缩，避免叠加时爆音
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    this.comp = comp;
    this.master.connect(comp).connect(this.ctx.destination);
    // 混响：音效和引擎声分一路送进卷积混响（脉冲响应程序生成），楼群、峡谷里多送一些
    this.reverbSend = this.ctx.createGain();
    this.reverbSend.gain.value = 0;
    const conv = this.ctx.createConvolver();
    conv.buffer = makeReverbIR(this.ctx);
    this.master.connect(this.reverbSend).connect(conv).connect(comp);
    const len = this.ctx.sampleRate * 2;
    this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.wind = this.loop('bandpass', 500, 0.6);
    this.screech = this.loop('bandpass', 1800, 6);
    this.hiss = this.loop('bandpass', 900, 0.7);
    this.crowdLow = this.loop('bandpass', 650, 0.5);
    this.crowdHigh = this.loop('bandpass', 1700, 0.8);
    this.crowdMod = 1;
    this.crowdProx = 0;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.ctx.onstatechange = () => updateAudioHint();
    this.music = new MusicBox(this);
    this.music.onSong = (song) => showNowPlaying(song);
    showNowPlaying(this.music.song);
    if (this.musicOn) this.music.start();
    // 物理建模引擎在音频线程里运行；不支持 AudioWorklet 的浏览器退回振荡器合成
    const src = typeof pelicanEngineWorklet === 'function' ? `(${pelicanEngineWorklet.toString()})();` : null;
    if (this.ctx.audioWorklet && src) {
      // 用 data: 地址而不是 Blob：直接双击打开（file://）时浏览器不允许从 Blob 加载 worklet
      const url = `data:application/javascript;charset=utf-8,${encodeURIComponent(src)}`;
      this.ctx.audioWorklet.addModule(url).then(() => { this.worklet = 'ready'; }, () => { this.worklet = 'failed'; });
    } else {
      this.worklet = 'failed';
    }
  }

  loop(type, frequency, q) {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    src.loop = true;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = frequency;
    filter.Q.value = q;
    const gain = this.ctx.createGain();
    gain.gain.value = 0;
    src.connect(filter).connect(gain).connect(this.master);
    src.start();
    return { filter, gain };
  }

  setEnabled(on) {
    this.enabled = on;
    if (this.master) this.master.gain.value = on ? 0.7 : 0;
  }

  get ready() { return this.ctx && this.enabled; }

  // 浏览器要求用户先和页面交互一次才能出声：页面上任何一次点击 / 触摸 / 按键都会调用这里
  unlock() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state !== 'running') this.ctx.resume();
  }

  // 玩家（或回放焦点）用一个引擎声部；最近的一辆 NPC 用另一个声部，按距离衰减并带多普勒变调
  voice(slot, carId) {
    if (this.worklet === 'ready') {
      // 每个声部只有一个 worklet 节点，换车时重新配置，避免同时跑很多个
      if (!this.voices[slot]) this.voices[slot] = new EngineVoice(this, carId);
      this.voices[slot].setCar(carId);
      return this.voices[slot];
    }
    if (this.worklet === 'pending') return null;
    const key = `${slot}:${carId}`;
    if (!this.voices[key]) this.voices[key] = new OscEngineVoice(this, carId);
    return this.voices[key];
  }

  update(dt, { main, npc, speed, slide, boost, active }) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const used = new Set();
    for (const [slot, info, on] of [['main', main, active], ['npc', npc, active && npc && npc.volume > 0.01]]) {
      if (!info) continue;
      const vc = this.voice(slot, info.carId);
      if (!vc) continue;
      used.add(vc);
      vc.update(dt, { volume: 1, ...info, active: on });
    }
    for (const vc of Object.values(this.voices)) {
      if (!used.has(vc)) vc.update(dt, { rpmN: 0, throttle: 0, volume: 0, active: false });
    }
    const s = Math.min(speed / 80, 1);
    this.wind.gain.gain.setTargetAtTime(active ? 0.3 * s * s : 0, now, 0.2);
    this.wind.filter.frequency.setTargetAtTime(300 + 1500 * s, now, 0.2);
    this.screech.gain.gain.setTargetAtTime(active ? Math.min(0.2, Math.max(0, slide - 2.5) * 0.035) : 0, now, 0.06);
    this.hiss.gain.gain.setTargetAtTime(active && boost ? 0.1 : 0, now, 0.08);
  }

  burst({ duration, type, frequency, gain, delay = 0 }) {
    if (!this.ready || gain <= 0.001) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = frequency;
    const env = this.ctx.createGain();
    env.gain.setValueAtTime(gain, t0);
    env.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    src.connect(filter).connect(env).connect(this.master);
    src.start(t0, Math.random() * 1.5, duration + 0.05);
  }

  tone({ frequency, duration, type = 'sine', gain = 0.2, delay = 0, slideTo = null }) {
    if (!this.ready) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
    const env = this.ctx.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(env).connect(this.master);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  crash() {
    this.burst({ duration: 0.8, type: 'lowpass', frequency: 700, gain: 1.0 });
    this.tone({ frequency: 90, slideTo: 35, duration: 0.5, gain: 0.6 });
    this.burst({ duration: 0.4, type: 'highpass', frequency: 3000, gain: 0.4, delay: 0.05 });
    [0.1, 0.22, 0.35].forEach((d) => this.burst({ duration: 0.15, type: 'bandpass', frequency: 1800 + Math.random() * 1500, gain: 0.25, delay: d }));
  }
  bump(strength) {
    this.burst({ duration: 0.2, type: 'lowpass', frequency: 500, gain: Math.min(0.8, 0.15 + strength * 0.04) });
  }
  scrape() {
    this.burst({ duration: 0.12, type: 'bandpass', frequency: 2600, gain: 0.12 });
  }
  nitro() {
    this.burst({ duration: 0.6, type: 'lowpass', frequency: 1200, gain: 0.5 });
    this.tone({ frequency: 180, slideTo: 520, duration: 0.5, type: 'sawtooth', gain: 0.06 });
  }
  // 小喷：一声短促的"噗——"，完美小喷更亮
  turbo(perfect) {
    this.burst({ duration: 0.45, type: 'bandpass', frequency: perfect ? 1400 : 900, gain: perfect ? 0.45 : 0.3 });
    this.tone({ frequency: perfect ? 300 : 220, slideTo: perfect ? 900 : 560, duration: 0.3, type: 'sawtooth', gain: 0.05 });
  }
  whoosh() {
    this.burst({ duration: 0.5, type: 'bandpass', frequency: 600, gain: 0.18 });
  }
  // 被追踪红壳锁定的报警
  lockBeep() {
    this.tone({ frequency: 1760, duration: 0.09, type: 'square', gain: 0.05 });
  }
  // 混响量（0~1），按所在环境平滑过渡
  setReverb(level) {
    if (this.reverbSend) this.reverbSend.gain.setTargetAtTime(level, this.ctx.currentTime, 0.4);
  }
  beep(high = false) {
    this.tone({ frequency: high ? 1320 : 660, duration: high ? 0.7 : 0.3, type: 'square', gain: 0.08 });
  }
  lap() {
    [880, 1175].forEach((f, i) => this.tone({ frequency: f, duration: 0.25, type: 'triangle', gain: 0.12, delay: i * 0.12 }));
  }
  // ---------------- 警匪追逐 ----------------
  // 警笛（美式 wail：音调来回滑动）和直升机旋翼（低频噪声按 ~17Hz 起伏）
  // 警笛（每辆近处的警车一个声部）和直升机旋翼（低频噪声按 ~17Hz 起伏）
  updatePursuit(dt, sirens, rotorLevel) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (!this.sirens && (sirens.length || rotorLevel > 0)) {
      const ctx = this.ctx;
      this.sirens = [new SirenVoice(this, 0), new SirenVoice(this, 0.37)];   // 两个声部相位错开，多辆警车一起响时有层次
      const src = ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 320;
      const am = ctx.createGain();
      am.gain.value = 0.5;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 17;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.5;
      lfo.connect(lfoGain).connect(am.gain);
      const out = ctx.createGain();
      out.gain.value = 0;
      src.connect(lp).connect(am).connect(out).connect(this.master);
      src.start(); lfo.start();
      this.rotor = { out };
    }
    if (!this.sirens) return;
    this.sirens.forEach((voice, k) => voice.update(dt, this.enabled ? sirens[k] : null));
    this.rotor.out.gain.setTargetAtTime(this.enabled ? rotorLevel * 0.5 : 0, now, 0.2);
  }
  // ---------------- 道具 ----------------
  itemGet() {
    [660, 880, 1100, 1320].forEach((f, i) => this.tone({ frequency: f, duration: 0.09, type: 'triangle', gain: 0.08, delay: i * 0.05 }));
  }
  itemUse() {
    this.burst({ duration: 0.25, type: 'bandpass', frequency: 1400, gain: 0.25 });
    this.tone({ frequency: 520, slideTo: 1200, duration: 0.18, type: 'square', gain: 0.05 });
  }
  itemHit() {
    this.tone({ frequency: 300, slideTo: 90, duration: 0.35, type: 'square', gain: 0.12 });
    this.burst({ duration: 0.3, type: 'lowpass', frequency: 900, gain: 0.5 });
    [0.2, 0.35, 0.5].forEach((d) => this.tone({ frequency: 1500, slideTo: 900, duration: 0.12, type: 'sine', gain: 0.05, delay: d }));
  }
  thunder() {
    this.burst({ duration: 0.12, type: 'highpass', frequency: 3000, gain: 0.7 });
    this.burst({ duration: 1.4, type: 'lowpass', frequency: 260, gain: 0.9, delay: 0.05 });
  }
  alarm() {
    [0, 0.25, 0.5].forEach((d) => this.tone({ frequency: 880, slideTo: 1320, duration: 0.2, type: 'square', gain: 0.06, delay: d }));
  }
  busted() {
    [659, 523, 415, 330].forEach((f, i) => this.tone({ frequency: f, duration: i === 3 ? 0.9 : 0.25, type: 'square', gain: 0.1, delay: i * 0.18 }));
    this.burst({ duration: 0.6, type: 'lowpass', frequency: 500, gain: 0.6 });
  }
  pop() {
    this.burst({ duration: 0.25, type: 'highpass', frequency: 1800, gain: 0.5 });
    this.tone({ frequency: 180, slideTo: 60, duration: 0.3, gain: 0.3 });
  }
  fanfare() {
    [523, 659, 784, 1047, 784, 1047].forEach((frequency, i) =>
      this.tone({ frequency, duration: i === 5 ? 0.8 : 0.3, type: 'triangle', gain: 0.14, delay: i * 0.13 }));
  }

  // ---------------- 看台观众：嗡嗡的人声底噪 + 随机的欢呼、口哨、掌声 ----------------
  // prox：离看台的远近（0..1）；excite：兴奋程度（车速越快越热烈）
  updateCrowd(dt, prox, excite, active) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    this.crowdProx = active ? prox : 0;
    this.crowdMod = clamp(this.crowdMod + (Math.random() - 0.5) * dt * 3, 0.7, 1.3);   // 人声自然起伏
    const base = active ? prox * (0.04 + 0.1 * excite) * this.crowdMod : 0;
    this.crowdLow.gain.gain.setTargetAtTime(base, now, 0.3);
    this.crowdHigh.gain.gain.setTargetAtTime(base * 0.35, now, 0.3);
    if (!active || prox < 0.03 || !this.ready) return;
    const rate = prox * (0.6 + 3 * excite);
    if (Math.random() < dt * rate * 1.6) this.crowdVoice(0, 0.045 * prox * (0.5 + excite));
    if (Math.random() < dt * rate * 5) this.clap(0, 0.05 * prox);
    if (Math.random() < dt * rate * 0.15) this.whistle(0, 0.03 * prox);
  }

  // 一大波欢呼：发车、过线、冲线时
  cheer(strength = 1) {
    if (!this.ready) return;
    const level = Math.max(this.crowdProx, 0.35) * strength;
    for (let i = 0; i < Math.round(12 * strength); i++) this.crowdVoice(Math.random() * 1.2, 0.05 * level);
    for (let i = 0; i < Math.round(40 * strength); i++) this.clap(Math.random() * 2.2, 0.06 * level);
    for (let i = 0; i < Math.round(2 * strength); i++) this.whistle(0.2 + Math.random(), 0.04 * level);
  }

  // 一声"喔——"：锯齿波声带 + 两个共振峰带通（元音 a/o）+ 颤音，音高先升后落
  crowdVoice(delay, level) {
    const ctx = this.ctx, t0 = ctx.currentTime + delay;
    const f0 = 220 + Math.random() * 320, dur = 0.5 + Math.random() * 0.7;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0 * 0.85, t0);
    osc.frequency.linearRampToValueAtTime(f0 * 1.25, t0 + dur * 0.35);
    osc.frequency.linearRampToValueAtTime(f0 * 0.9, t0 + dur);
    const vib = ctx.createOscillator();
    vib.frequency.value = 5 + Math.random() * 2;
    const vibGain = ctx.createGain();
    vibGain.gain.value = f0 * 0.03;
    vib.connect(vibGain).connect(osc.frequency);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(level, t0 + 0.08);
    env.gain.setValueAtTime(level * 0.8, t0 + dur * 0.7);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    env.connect(this.master);
    for (const [f, q] of [[650 + Math.random() * 200, 5], [1100 + Math.random() * 200, 6]]) {
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      osc.connect(bp).connect(env);
    }
    osc.start(t0); vib.start(t0);
    osc.stop(t0 + dur + 0.05); vib.stop(t0 + dur + 0.05);
  }

  clap(delay, level) {
    this.burst({ duration: 0.025 + Math.random() * 0.02, type: 'bandpass', frequency: 1000 + Math.random() * 1800, gain: level, delay });
  }

  whistle(delay, level) {
    const f = 2000 + Math.random() * 600;
    this.tone({ frequency: f, slideTo: f * 1.3, duration: 0.25, gain: level, delay });
    this.tone({ frequency: f * 1.3, slideTo: f * 0.95, duration: 0.35, gain: level, delay: delay + 0.25 });
  }
}
// 混响脉冲响应：带低通的噪声指数衰减（尾音越来越暗，RT60 约 1.4 秒）+ 十几个离散的早期反射（楼墙、岩壁），左右声道错开
function makeReverbIR(ctx) {
  const sr = ctx.sampleRate, len = Math.floor(sr * 1.6);
  const buf = ctx.createBuffer(2, len, sr);
  const taps = [[0.007, 0.55], [0.013, 0.45], [0.021, 0.4], [0.03, 0.34], [0.041, 0.3], [0.055, 0.26], [0.072, 0.22], [0.094, 0.17], [0.12, 0.13], [0.155, 0.1], [0.2, 0.07], [0.26, 0.05]];
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let lp = 0, a = 0;
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      if ((i & 63) === 0) a = Math.exp((-2 * Math.PI * (900 + 8000 * Math.exp(-t / 0.25))) / sr);
      lp = (1 - a) * (Math.random() * 2 - 1) + a * lp;
      d[i] = lp * Math.exp(-t / 0.2) * (t < 0.012 ? (t / 0.012) ** 2 : 1) * 0.5;
    }
    for (const [tt, g] of taps) {
      const at = Math.floor((tt + Math.random() * 0.002 * (ch + 1)) * sr), sgn = Math.random() < 0.5 ? -1 : 1;
      for (let k = 0; k < 20 && at + k < len; k++) d[at + k] += sgn * g * Math.exp(-k / 4) * (k % 2 ? -0.35 : 1);
    }
  }
  return buf;
}

// 粒子对象池：烟、火花
'use strict';

// =====================================================================
// 粒子：烟、火花（对象池）
// =====================================================================
const puffTex = canvasTexture(64, (g, w) => {
  const grad = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, w);
});
const particles = [];
function makePool(count, additive) {
  const pool = [];
  for (let i = 0; i < count; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: puffTex, transparent: true, depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    }));
    sp.visible = false;
    scene.add(sp);
    pool.push({ sp, life: 0, max: 1, vel: v(0, 0, 0), size0: 1, size1: 2, gravity: 0, alpha: 1 });
  }
  return { pool, next: 0 };
}
const smokePool = makePool(MOBILE_GPU ? 60 : 120, false);
const sparkPool = makePool(50, true);

function emit(poolObj, pos, { vel = v(0, 0, 0), life = 1, size0 = 0.5, size1 = 2, color = 0xffffff, gravity = 0, alpha = 0.7 }) {
  const p = poolObj.pool[poolObj.next];
  poolObj.next = (poolObj.next + 1) % poolObj.pool.length;
  p.sp.position.copy(pos);
  p.sp.visible = true;
  p.sp.material.color.set(color);
  Object.assign(p, { life: 0, max: life, size0, size1, gravity, alpha });
  p.vel.copy(vel);
  if (!particles.includes(p)) particles.push(p);
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.max) {
      p.sp.visible = false;
      particles.splice(i, 1);
      continue;
    }
    const u = p.life / p.max;
    p.vel.y -= p.gravity * dt;
    p.sp.position.addScaledVector(p.vel, dt);
    p.sp.scale.setScalar(lerp(p.size0, p.size1, u));
    p.sp.material.opacity = p.alpha * (1 - u);
  }
}

const carEvents = [];
function carEvent(c, type, data = {}) { carEvents.push({ c, type, ...data }); }

const GRAVITY = 22;   // 街机手感：比真实重力大，腾空时间短、落地干脆

// ---------------- 车辆物理（街机风格） ----------------
function stepCar(c, dt) {
  if (c.air) return stepAir(c, dt);
  const sp = c.spec, ctl = c.ctl;
  const [fx, fz] = forwardOf(c.heading);
  let vF = c.vx * fx + c.vz * fz;
  const vL = c.vx * fz - c.vz * fx;
  const off = c.off;
  const boost = c.nitroTime > 0;
  const vmax = (sp.vmax / 3.6) * c.perf * (boost ? 1.22 : 1) * (off ? (isFree() ? Math.max(sp.offroad, 0.72) : sp.offroad) : 1) * (c.flatT > 0 ? 0.6 : 1) * (c.starT > 0 ? 1.15 : 1) * (c.zapT > 0 ? 0.65 : 1) * (c.turboT > 0 ? c.turboK : 1);   // 扎胎 / 被闪电劈中跑不快，无敌星更快   // 自由驾驶时野地里也能开得比较快

  // 漂移：玩家高速大角度转弯时踩着油门（或点一下刹车），车尾滑出去；松开方向或减速后慢慢收回
  const wantDrift = c.isPlayer && !c.finished && !off && Math.abs(c.steer) > 0.55 && vF > 15 && (ctl.throttle || ctl.brake);
  c.drift = clamp(c.drift + (wantDrift ? dt * 2.5 : -dt * 2), 0, 1);

  let a = 0;
  // 油门和刹车同时踩：发动机和刹车都只发挥一半，净效果是温和减速（单独踩刹车时力度不变）
  const both = ctl.throttle && ctl.brake;
  if (ctl.throttle) {
    if (vF < -0.5) a += sp.brake;
    else a += sp.accel * c.perf * (boost ? 1.8 : 1) * Math.max(0.04, 1 - (vF / vmax) ** 2) * (both ? 0.5 : 1);
  }
  if (ctl.reverse) a += vF > 0.5 ? -sp.brake : -7;
  if (ctl.brake && Math.abs(vF) > 0.3) a -= Math.sign(vF) * sp.brake * (both ? 0.6 : 1.2);
  if (boost && !ctl.brake) a += sp.accel * 0.6;
  if (c.turboT > 0 && !ctl.brake) a += sp.accel * 0.5;   // 小喷 / 起步加速 / 落地喷
  if (c.drift > 0.3 && ctl.throttle) a += sp.accel * 0.25 * c.drift * Math.max(0, 1 - (vF / vmax) ** 2);   // 漂移中踩油门能保住速度
  a -= Math.sign(vF) * (0.15 + 0.00008 * vF * vF + (off ? (isFree() ? 1.2 : 2.5) : 0));   // 松开油门时靠惯性滑行，掉速很慢
  if (vF > vmax) a -= (vF - vmax) * 1.3;
  const prev = vF;
  vF += a * dt;
  if (prev * vF < 0 && !(ctl.reverse && prev <= 0.5) && !(ctl.throttle && prev < 0)) vF = 0;
  vF = Math.max(vF, -13);

  // 转向：低速时方向盘灵敏，高速时受抓地力限制（横向加速度 ≤ grip）
  const rate = c.isPlayer ? 3.2 : 3;
  c.steer += clamp(ctl.steer - c.steer, -rate * dt, rate * dt);
  const grip = sp.grip * c.perf * (off ? 0.7 : 1) * (c.flatT > 0 ? 0.8 : 1);
  const cap = Math.min(1.9, grip / Math.max(Math.abs(vF), 1));
  let yaw = c.steer * cap * clamp(Math.abs(vF) / 4, 0, 1) * (vF < 0 ? -1 : 1);
  if (ctl.brake && vF > 12) yaw *= both ? 1.1 : 1.3;   // 刹车时车尾更容易甩出去（同时踩油门时轻一些）
  yaw *= 1 + 0.7 * c.drift;   // 漂移时车身转得比行进方向更多，出现漂移角
  c.yawRate = yaw;
  c.heading += yaw * dt;

  // 速度向量在新朝向下分解，侧向分量按抓地力衰减（衰减慢 = 漂移）
  const wx = fx * vF + fz * vL, wz = fz * vF - fx * vL;
  const [gx, gz] = forwardOf(c.heading);
  let nF = wx * gx + wz * gz;
  let nL = wx * gz - wz * gx;
  let slipK = sp.slip * (ctl.brake ? (both ? 0.7 : 0.35) : 1) * (off ? 0.7 : 1) * (1 - 0.75 * c.drift);
  if (c.drift > 0 && Math.abs(nL) > Math.max(nF, 1) * 0.8) slipK *= 3;   // 漂移角过大时自动回正，避免原地打转
  const speedBefore = Math.hypot(nF, nL);
  nL *= Math.exp(-slipK * dt);
  if (c.drift > 0 && nF > 0) {
    // 漂移时侧滑损失的速度有一部分保留下来（只补回损失的一部分，总速度不会超过漂移前）
    const keep = lerp(Math.hypot(nF, nL), speedBefore, 0.5 * c.drift);
    nF = Math.sqrt(Math.max(0, keep * keep - nL * nL));
  }
  if (c.isPlayer) {
    if (c.drift > 0.6) c.driftTime += dt;
    else if (c.drift < 0.2 && c.driftTime > 0) {
      carEvent(c, 'driftEnd', { time: c.driftTime });
      c.driftTime = 0;
    }
  }
  c.vx = gx * nF + gz * nL;
  c.vz = gz * nF - gx * nL;
  c.accel = lerp(c.accel, (nF - prev) / dt, Math.min(1, dt * 8));
  c.vF = nF;
  c.vL = nL;
  c.x += c.vx * dt;
  c.z += c.vz * dt;

  carTimers(c, dt);
  updateVertical(c, dt);
}

// 氮气、扎胎、小喷等计时
function carTimers(c, dt) {
  if (c.nitroTime > 0) c.nitroTime = Math.max(0, c.nitroTime - dt);
  if (c.flatT > 0) c.flatT = Math.max(0, c.flatT - dt);
  if (c.turboT > 0) c.turboT = Math.max(0, c.turboT - dt);
  if (c.mtT > 0) c.mtT = Math.max(0, c.mtT - dt);
  c.nitroCharge = Math.min(1, c.nitroCharge + dt / NITRO_CHARGE);
}

// 腾空：轮胎不着地，没有抓地力和油门刹车，只受重力和一点空气阻力；方向键能在空中微调车头
function stepAir(c, dt) {
  const rate = c.isPlayer ? 3.2 : 3;
  c.steer += clamp(c.ctl.steer - c.steer, -rate * dt, rate * dt);
  c.yawRate = c.steer * 0.7;
  c.heading += c.yawRate * dt;
  const drag = Math.exp(-0.05 * dt);
  c.vx *= drag;
  c.vz *= drag;
  const [fx, fz] = forwardOf(c.heading);
  c.vF = c.vx * fx + c.vz * fz;
  c.vL = c.vx * fz - c.vz * fx;
  c.accel = lerp(c.accel, 0, Math.min(1, dt * 8));
  c.drift = Math.max(0, c.drift - dt * 2);
  c.x += c.vx * dt;
  c.z += c.vz * dt;
  carTimers(c, dt);
  updateVertical(c, dt);
}

// 车下方的路面高度（弯道倾角 + 跳台），顺便算出车身该有的侧倾；开放世界按最近的一条路算
function surfaceY(c) {
  let R = T, i = c.idx;
  if (worldMode === 'open') {
    const q = nearestRoad(c.x, c.z, 30);
    if (!q || !q.road.bk) { c.bankSlope = 0; return 0; }
    R = q.road; i = q.i;
  }
  const tc = trackCoords(R, c.x, c.z, i);
  if (Math.abs(tc.lat) > R.B + 0.5) { c.bankSlope = 0; return 0; }
  const b = R.bk[i];
  c.bankSlope = tc.lat * b > 0 && Math.abs(tc.lat) < R.W + 2 ? b * Math.cos(c.heading - R.heading[i]) : 0;
  return bankHeight(R, i, tc.lat) + rampHeight(R, tc.s, tc.lat);
}

// 竖直方向：贴着路面走；路面往下掉得比重力还快（跳台台口、缓冲区边缘）就飞起来，落地时发出事件
function updateVertical(c, dt) {
  const gy = surfaceY(c);
  if (c.air) {
    c.vy -= GRAVITY * dt;
    c.y += c.vy * dt;
    c.airT += dt;
    if (c.y <= gy) {
      carEvent(c, 'land', { airT: c.airT, impact: -c.vy });
      c.y = gy;
      c.vy = 0;
      c.air = false;
      c.airT = 0;
    }
    return;
  }
  const yB = c.y + c.vy * dt - GRAVITY * dt * dt;   // 按抛物线本该到达的高度
  if (gy < yB - 0.02 && Math.abs(c.vF) > 4) {
    c.air = true;
    c.airT = 0;
    c.y = yB;
    c.vy -= GRAVITY * dt;
    carEvent(c, 'takeoff');
    return;
  }
  // 贴地时的竖直速度（上坡时会带着车往上走，冲出台口就是起飞速度）；从侧面蹭上跳台时限制一下，免得被弹上天
  c.vy = clamp((gy - c.y) / dt, -20, Math.abs(c.vF) * 0.3 + 1);
  c.y = gy;
}

// 数值出错（NaN / 无穷大）时把车放回路上，免得整局卡死
function sanitizeCar(c) {
  if (Number.isFinite(c.x + c.z + c.vx + c.vz + c.heading + c.y + c.vy)) return;
  console.warn('车辆状态出现非法数值，已重置', c.name);
  Object.assign(c, { vx: 0, vz: 0, vF: 0, vL: 0, vy: 0, y: 0, air: false, heading: Number.isFinite(c.heading) ? c.heading : 0 });
  if (!Number.isFinite(c.x + c.z)) { c.x = T.px[c.idx] || 0; c.z = T.pz[c.idx] || 0; }
  if (worldMode === 'open') resetToRoad(c); else resetToTrack(c);
}

function useNitro(c) {
  if (c.nitroCharge < 1 || c.state !== 'drive') return false;
  c.nitroCharge = 0;
  c.nitroTime = NITRO_BURN;
  if (c.isPlayer) sound.nitro();
  return true;
}

// ---------------- 赛道进度与圈数 ----------------
function updateProgress(c) {
  const prevS = c.s;
  c.idx = projectNear(T, c.x, c.z, c.idx);
  const tc = trackCoords(T, c.x, c.z, c.idx);
  if (Math.abs(tc.lat) > T.B + 20) c.idx = projectGlobal(T, c.x, c.z);
  if (prevS > T.L * 0.75 && tc.s < T.L * 0.25) {
    c.lapCount++;
    if (c.lapCount > c.maxLap) {
      c.maxLap = c.lapCount;
      if (c.lapCount >= 2) onLap(c);
    }
  } else if (prevS < T.L * 0.25 && tc.s > T.L * 0.75) {
    c.lapCount--;
  }
  c.s = tc.s;
  c.lat = tc.lat;
  c.progress = (c.lapCount - 1) * T.L + c.s;
  if (worldMode === 'open' && c.isPlayer) {
    // 开放世界：只要在任何一条路（赛道或连接公路）上就不算出界
    const q = nearestRoad(c.x, c.z, 24);
    c.off = !q || q.d > q.road.W + 0.6;
    c.road = q?.road ?? null;
  } else {
    c.off = Math.abs(c.lat) > T.W + 0.6;
  }
}

// ---------------- 碰撞：护栏 ----------------
function collideWalls(c) {
  if (worldMode === 'open') return;   // 开放世界没有护栏
  const lim = T.B - c.built.half[0] * 0.95;
  if (Math.abs(c.lat) <= lim) return;
  const side = Math.sign(c.lat);
  const nx = T.nx[c.idx] * side, nz = T.nz[c.idx] * side;   // 指向墙外
  const pen = Math.abs(c.lat) - lim;
  c.x -= nx * pen;
  c.z -= nz * pen;
  c.lat = side * lim;
  const vn = c.vx * nx + c.vz * nz;
  if (vn <= 0) return;
  if (c.isPlayer) driftHit(vn);
  if (c.state === 'drive' && !c.isPlayer && vn > 10 && vn <= CRASH_SPEED * 0.9 && c.ghost <= 0) spinOut(c, vn * 1.5);
  if (c.state === 'drive' && vn > (c.isPlayer ? CRASH_SPEED : CRASH_SPEED * 0.9) && c.ghost <= 0) {
    crash(c, vn);
    c.vx -= 1.2 * vn * nx;
    c.vz -= 1.2 * vn * nz;
    return;
  }
  // 掉速看撞击角度：擦着墙几乎不掉速，正面撞上去才掉得多
  const impact = vn / Math.max(1, Math.hypot(c.vx, c.vz));
  c.vx -= 1.35 * vn * nx;
  c.vz -= 1.35 * vn * nz;
  const scrub = 1 - Math.min(0.45, 0.35 * impact + vn * 0.006);
  c.vx *= scrub;
  c.vz *= scrub;
  // 车头顺着墙摆正（撞得越正摆得越多），避免擦墙后乱转、卡在墙上
  const along = T.heading[c.idx] + (c.vF < 0 ? Math.PI : 0);
  c.heading += wrapAngle(along - c.heading) * Math.min(0.6, 0.5 * impact + 0.05);
  const hit = v(c.x + nx * c.built.half[0], 0.5, c.z + nz * c.built.half[0]);
  for (let k = 0; k < Math.min(6, 1 + vn); k++) {
    emit(sparkPool, hit, { vel: v(rand(-3, 3) + c.vx * 0.5, rand(1, 4), rand(-3, 3) + c.vz * 0.5), life: 0.35, size0: 0.25, size1: 0.05, color: 0xffc040, gravity: 12, alpha: 1 });
  }
  if (c.isPlayer) {
    if (vn > 4) sound.bump(vn); else sound.scrape();
    shake = Math.max(shake, Math.min(0.5, vn * 0.03));
  }
}

// ---------------- 碰撞：车与车（每辆车用前后两个圆近似） ----------------
function carCircles(c) {
  const [fx, fz] = forwardOf(c.heading);
  const d = c.built.half[1] * 0.5;
  return [[c.x + fx * d, c.z + fz * d], [c.x - fx * d, c.z - fz * d]];
}

function collideCars(racers) {
  for (let i = 0; i < racers.length; i++) {
    for (let j = i + 1; j < racers.length; j++) {
      const a = racers[i], b = racers[j];
      if (a.ghost > 0 || b.ghost > 0) continue;
      if ((a.x - b.x) ** 2 + (a.z - b.z) ** 2 > 49) continue;
      if (Math.abs(a.y - b.y) > 1.3) continue;   // 一辆从另一辆头顶飞过去
      const ra = a.built.half[0] * 1.05, rb = b.built.half[0] * 1.05;
      for (const [ax, az] of carCircles(a)) {
        for (const [bx, bz] of carCircles(b)) {
          let dx = ax - bx, dz = az - bz;
          const dist = Math.hypot(dx, dz);
          const min = ra + rb;
          if (dist >= min || dist < 1e-4) continue;
          dx /= dist; dz /= dist;
          const ma = a.spec.mass, mb = b.spec.mass;
          const pen = min - dist;
          a.x += dx * pen * (mb / (ma + mb)); a.z += dz * pen * (mb / (ma + mb));
          b.x -= dx * pen * (ma / (ma + mb)); b.z -= dz * pen * (ma / (ma + mb));
          const rel = (a.vx - b.vx) * dx + (a.vz - b.vz) * dz;
          if (rel >= 0) continue;
          const jImp = (-(1 + 0.3) * rel) / (1 / ma + 1 / mb);
          a.vx += (jImp / ma) * dx; a.vz += (jImp / ma) * dz;
          b.vx -= (jImp / mb) * dx; b.vz -= (jImp / mb) * dz;
          const hit = -rel;
          // 警车撞玩家：一般只会把玩家撞得打滑，撞得非常狠（> ~115 km/h 相对速度）才会翻车
          if (isItems()) {
            if (a.starT > 0 && !(b.starT > 0)) hitByItem(b, 'star', a);
            if (b.starT > 0 && !(a.starT > 0)) hitByItem(a, 'star', b);
          }
          if (a.isPlayer || b.isPlayer) driftHit(hit);
          const copRam = (a.isPolice && b.isPlayer) || (b.isPolice && a.isPlayer);
          for (const c of [a, b]) {
            const crashAt = copRam && c.isPlayer ? 32 : 22;
            if (hit > crashAt && c.state === 'drive') crash(c, hit * 0.8);
            else if (hit > 11 && c.state === 'drive' && (!c.isPlayer || copRam)) spinOut(c, hit);
          }
          if (a.isPlayer || b.isPlayer) {
            sound.bump(hit);
            shake = Math.max(shake, Math.min(0.6, hit * 0.04));
          }
          const mid = v((ax + bx) / 2, 0.6, (az + bz) / 2);
          for (let k = 0; k < Math.min(5, hit / 2); k++) {
            emit(sparkPool, mid, { vel: v(rand(-4, 4), rand(1, 4), rand(-4, 4)), life: 0.3, size0: 0.25, size1: 0.05, color: 0xffd060, gravity: 12, alpha: 1 });
          }
        }
      }
    }
  }
}

// ---------------- 撞车 / 打滑 / 重新启动 ----------------
function crash(c, impact) {
  if (c.isPolice) onCopCrash(c);
  c.state = 'crash';
  c.crashT = 0;
  c.nitroTime = 0;
  c.turboT = 0;
  c.mtT = 0;
  c.driftTime = 0;
  const turns = impact > 32 ? 2 : 1;
  c.rollTotal = turns * Math.PI * 2 * (Math.random() < 0.5 ? -1 : 1);
  c.spinRate = rand(-4, 4);
  c.jumpV = Math.min(7, 2.5 + impact * 0.15);
  c.jumpY = 0;
  if (c.isPlayer) {
    sound.crash();
    shake = 1;
    crashes++;
  }
  for (let k = 0; k < 10; k++) {
    emit(sparkPool, v(c.x, 0.6, c.z), { vel: v(rand(-6, 6), rand(2, 7), rand(-6, 6)), life: 0.5, size0: 0.35, size1: 0.05, color: 0xffb030, gravity: 14, alpha: 1 });
  }
}

function spinOut(c, strength) {
  c.state = 'spin';
  c.crashT = 0;
  c.spinRate = (Math.random() < 0.5 ? -1 : 1) * clamp(strength * 0.4, 4, 9);
}

function updateCrash(c, dt) {
  c.crashT += dt;
  const damp = Math.exp(-1.6 * dt);
  c.vx *= damp;
  c.vz *= damp;
  c.x += c.vx * dt;
  c.z += c.vz * dt;
  c.heading += c.spinRate * dt;
  c.spinRate *= Math.exp(-1.5 * dt);
  c.vF *= damp;
  updateVertical(c, dt);
  if (c.state === 'crash') {
    const D = 1.4;
    const u = Math.min(1, c.crashT / D);
    c.jumpY = Math.max(0, c.jumpV * c.crashT - 5 * c.crashT * c.crashT) * (u < 1 ? 1 : 0);
    c.tumble.position.y = c.jumpY;
    c.tumble.rotation.z = c.rollTotal * (1 - (1 - u) ** 3);
    if (u >= 1) c.tumble.rotation.z = 0;
    if (Math.random() < dt * 25) {
      emit(smokePool, v(c.x + rand(-1, 1), 0.8, c.z + rand(-1, 1)), { vel: v(rand(-0.5, 0.5), rand(1.5, 3), rand(-0.5, 0.5)), life: 2.2, size0: 1, size1: 4.5, color: 0x3a3a3a, alpha: 0.55 });
    }
    if (c.isPolice && c.crashT > 3) return respawnCop(c);   // 撞毁的警车从后方重新追上来
    if ((!c.isPlayer || c.finished) && c.crashT > 2.5) resetToTrack(c);
  } else if (c.crashT > 1.2) {
    c.state = 'drive';
  } else if (Math.random() < dt * 30) {
    emit(smokePool, v(c.x, 0.3, c.z), { vel: v(0, 1, 0), life: 1, size0: 0.8, size1: 3, color: 0xdddddd, alpha: 0.4 });
  }
}

// 放回赛道中心附近：朝向沿赛道，速度清零，短暂无碰撞（半透明闪烁）
function resetToTrack(c) {
  c.idx = projectGlobal(T, c.x, c.z);
  const s = trackCoords(T, c.x, c.z, c.idx).s;
  let lat = 0;
  for (const cand of [0, T.W * 0.5, -T.W * 0.5]) {
    const p = trackPoint(T, s, cand);
    if (racers.every((o) => o === c || (o.x - p.x) ** 2 + (o.z - p.z) ** 2 > 36)) { lat = cand; break; }
  }
  const lapCount = c.lapCount;
  const prevS = c.s;
  placeRacer(c, s, lat);
  c.lapCount = lapCount;
  c.s = prevS;          // 保留原来的进度，避免把起终点线判成倒退
  updateProgress(c);
  c.state = 'drive';
  c.crashT = 0;
  c.tumble.position.set(0, 0, 0);
  c.tumble.rotation.set(0, 0, 0);
  snapInterp(c);
  c.ghost = 2;
  c.stuckT = 0;
  c.wrongT = 0;
}

/* ===== js/game/boost.js ===== */
// 小喷（参考 QQ 飞车）：漂移结束 / 飞跃落地后的短窗口里点一下 ↑，获得一小段加速；越早按越好（完美小喷）
// 起步加速：发车灯熄灭前后一瞬间按下 ↑；以及物理事件（漂移结束、起飞、落地）的统一处理
'use strict';

const MT_WINDOW = { drift: 0.5, land: 0.45 };   // 小喷窗口长度（秒）
const MT_PERFECT = 0.2;                          // 窗口打开后多少秒内按下算"完美"
let startPress = null;                           // 起步时第一次按 ↑ 的时刻（相对发车灯熄灭，负数 = 提前）

function openTurboWindow(c, kind) {
  if (!c.isPlayer || c.finished || c.state !== 'drive' || raceState !== 'racing') return;
  c.mtT = c.mtLen = MT_WINDOW[kind];
  c.mtKind = kind;
}

// 按下 ↑ 的瞬间调用：小喷窗口里就触发小喷
function tryMiniTurbo(c) {
  if (c.mtT <= 0 || c.state !== 'drive' || c.air) return false;
  const perfect = c.mtLen - c.mtT < MT_PERFECT;
  const dbl = c.nitroTime > 0;   // 氮气喷射中再接小喷 = 双喷
  giveTurbo(c, perfect ? 1.1 : 0.8, (perfect ? 1.1 : 1.06) + (dbl ? 0.04 : 0), (perfect ? 4 : 2.5) + (dbl ? 1.5 : 0));
  if (dbl) c.nitroTime += 0.3;
  c.mtT = 0;
  carEvent(c, 'turbo', { kind: c.mtKind, perfect, dbl });
  return true;
}

// 一段短加速：持续时间、极速倍率、立刻增加的速度（m/s）
function giveTurbo(c, time, k, kick) {
  c.turboT = Math.max(c.turboT, time);
  c.turboK = Math.max(c.turboT > time ? c.turboK : 1, k);
  const [fx, fz] = forwardOf(c.heading);
  c.vx += fx * kick;
  c.vz += fz * kick;
}

// 起步加速：倒计时里提前按 ↑ 不算（要在灯灭前 0.3 秒内，或灯灭后 0.25 秒内按下）
function onThrottlePress() {
  if (!player || player.finished) return;
  if (raceState === 'countdown' && startPress === null) startPress = countdownT - goAt;
  else if (raceState === 'racing') {
    if (startPress === null && raceTime < 0.25 && !isFree()) { startPress = raceTime; startBoost(player); }
    else tryMiniTurbo(player);
  }
}
function onRaceGo() {
  if (startPress !== null && startPress >= -0.3) startBoost(player);
}
function startBoost(c) {
  giveTurbo(c, 1.4, 1.08, 6);
  carEvent(c, 'startBoost');
}

// ---------------- 事件：提示、音效、特效 ----------------
function handleCarEvents() {
  for (const e of carEvents) {
    const c = e.c;
    if (e.type === 'land') {
      // 落地扬尘（所有车），重落地镜头一震
      const puff = Math.min(10, 2 + e.impact * 0.6);
      for (let k = 0; k < puff; k++) {
        emit(smokePool, v(c.x + rand(-1.2, 1.2), c.y + 0.3, c.z + rand(-1.2, 1.2)), { vel: v(rand(-2, 2), rand(0.5, 1.5), rand(-2, 2)), life: 1, size0: 1, size1: 3.5, color: 0xd8d0c0, alpha: 0.45 });
      }
      if (!c.isPlayer) continue;
      if (e.impact > 6) { sound.bump(e.impact * 0.8); shake = Math.max(shake, Math.min(0.7, e.impact * 0.05)); }
      if (e.airT > 0.35) {
        openTurboWindow(c, 'land');
        if (raceState === 'racing') showMessage(`🛫 飞跃 ${e.airT.toFixed(1)} 秒<small>落地瞬间按 ↑ 来一记落地喷！</small>`, 1);
      }
    } else if (e.type === 'takeoff') {
      if (c.isPlayer) sound.whoosh?.();
    } else if (e.type === 'driftEnd') {
      if (!c.isPlayer || raceState !== 'racing') continue;
      // 漂得越久，氮气充能奖励越多；漂够 0.5 秒就打开小喷窗口
      if (e.time > 0.5 && c.state === 'drive') openTurboWindow(c, 'drift');
      if (e.time > 0.8) {
        const bonus = Math.min(0.35, e.time * 0.12);
        c.nitroCharge = Math.min(1, c.nitroCharge + bonus);
        showMessage(`🌀 漂移 ${e.time.toFixed(1)} 秒<small>氮气 +${Math.round(bonus * 100)}% · 马上按 ↑ 小喷！</small>`, 1.2);
      }
    } else if (e.type === 'turbo') {
      if (!c.isPlayer) continue;
      sound.turbo(e.perfect);
      shake = Math.max(shake, e.perfect ? 0.3 : 0.2);
      const name = e.kind === 'land' ? '落地喷' : '小喷';
      const bonus = isDrift() ? (e.perfect ? 500 : 250) * (e.dbl ? 2 : 1) : 0;
      if (bonus) drift.total += bonus;
      showMessage(`${e.perfect ? '✨ 完美' : '💨 '}${name}${e.dbl ? ' · 双喷！' : '！'}${bonus ? `<small>+${bonus} 分</small>` : ''}`, 0.9);
      turboStats[e.perfect ? 'perfect' : 'normal']++;
    } else if (e.type === 'startBoost') {
      if (!c.isPlayer) continue;
      sound.turbo(true);
      shake = Math.max(shake, 0.35);
      showMessage('<div class="huge">GO!</div>🚀 完美起步！', 1.2);
    }
  }
  carEvents.length = 0;
}
const turboStats = { normal: 0, perfect: 0 };

/* ===== js/game/ai.js ===== */
// AI 对手驾驶：走线、按弯道减速、让道超车、人为失误
'use strict';

// ---------------- AI 驾驶：沿走线跑，提前按弯道曲率减速，超车时换线 ----------------
function aiControl(c, dt) {
  const sp = c.spec;
  const spd = Math.max(c.vF, 0);
  // 人为失误：隔几秒掷一次骰子，可能晚刹车冲进弯、走大线出界、或者手抖画龙
  c.mistakeT -= dt;
  if (c.mistakeT <= 0) {
    c.mistake = Math.random() < c.errRate ? pick(['late', 'late', 'wide', 'wobble']) : null;
    c.mistakeT = c.mistake ? rand(2.5, 4) : rand(2, 5);
  }
  const late = c.mistake === 'late';
  const g = sp.grip * c.perf * c.skill * 0.9 * (late ? 1.35 : 1);
  const decel = sp.brake * 0.7 * (late ? 1.4 : 1);
  let vT = (sp.vmax / 3.6) * c.perf * (c.nitroTime > 0 ? 1.22 : 1);
  const steps = Math.min(120, Math.round((25 + (spd * spd) / (2 * decel)) / T.ds));
  for (let j = 2; j < steps; j += 2) {
    const kk = Math.abs(T.k[T.wrap(c.idx + j)]) + 1e-4;
    const vc = Math.sqrt(g / kk);
    const va = Math.sqrt(vc * vc + 2 * decel * j * T.ds);
    if (va < vT) vT = va;
  }
  vT = Math.max(vT, 8);

  // 让道 / 超车：前方近处有车挡在同一条线上就往旁边让
  c.avoid *= Math.exp(-0.7 * dt);
  for (const o of racers) {
    if (o === c || o.ghost > 0) continue;
    let gap = o.progress - c.progress;
    if (gap < -T.L / 2) gap += T.L;
    if (gap <= 0 || gap > 14 + spd * 0.35) continue;
    const dl = o.lat - c.lat;
    if (Math.abs(dl) < 3 && o.vF < c.vF + 3) {
      c.avoid += (dl > 0 ? -1 : 1) * 14 * dt;
      if (gap < 8 && Math.abs(dl) < 2) vT = Math.min(vT, o.vF + 1);
    }
  }
  c.avoid = clamp(c.avoid, -T.W * 0.8, T.W * 0.8);

  const look = 7 + spd * 0.45;
  const kAhead = T.k[T.wrap(c.idx + Math.round((look + 12) / T.ds))];
  let desired = clamp(kAhead * 320, -1, 1) * T.W * 0.5 + c.laneBias * T.W * 0.3 + c.avoid;
  desired = clamp(desired, -T.W * 0.8, T.W * 0.8);
  if (c.mistake === 'wide') desired = -Math.sign(kAhead || 1) * (T.W + 3);   // 走线太大，冲出路面
  // 躲避前方的钉刺带（空中追捕里的逃犯）：换线更快，可以开进缓冲区
  const dodging = c.dodgeT > 0;
  if (dodging) { c.dodgeT -= dt; desired = c.dodgeLat; }
  c.aiLat += (desired - c.aiLat) * Math.min(1, dt * (dodging ? 4 : 1.6));
  const tp = trackPoint(T, c.s + look, c.aiLat);
  const err = wrapAngle(Math.atan2(tp.x - c.x, tp.z - c.z) - c.heading);
  const cap = Math.min(1.9, (sp.grip * c.perf) / Math.max(spd, 1));
  const ctl = c.ctl;
  // 转向不再精确：增益偏低 + 持续的小幅手抖，失误时抖得更厉害
  const shakeAmp = (1 - c.skill) * 0.9 * (c.mistake === 'wobble' ? 4 : 1);
  const noise = (Math.sin(elapsed * 1.3 + c.phase) * 0.6 + Math.sin(elapsed * 3.7 + c.phase * 2) * 0.4) * shakeAmp;
  ctl.steer = clamp((err * 2.0) / cap + noise, -1, 1);
  ctl.throttle = c.vF < vT - 0.3;
  ctl.brake = c.vF > vT + 2.5;
  ctl.reverse = false;
  if (Math.abs(err) > 1.4 && spd < 6) {    // 车头朝向完全错了（打滑后）：原地掉头
    ctl.steer = Math.sign(err);
    ctl.throttle = true;
  }
  if (c.nitroCharge >= 1 && vT > c.vF + 15 && Math.random() < dt * 0.6) useNitro(c);

  if (raceState === 'racing' && spd < 1.5) {
    c.stuckT += dt;
    if (c.stuckT > 3) resetToTrack(c);
  } else {
    c.stuckT = 0;
  }
}

/* ===== js/game/car-visuals.js ===== */
// 把运动状态同步到模型：悬挂、车轮、方向盘、鹈鹕、刹车灯；胎痕、轮胎烟、扬尘
'use strict';

// ---------------- 把运动状态同步到模型 ----------------
const tmpGrip = new THREE.Vector3();
const gripA = new THREE.Vector3(), gripB = new THREE.Vector3();
function syncModel(c, dt, t = 0) {
  // 比赛中在最后两个物理步之间插值（瞬移时不插值）
  const a = (raceState === 'racing' || raceState === 'done') && (c.x - c.px0) ** 2 + (c.z - c.pz0) ** 2 < 64 ? physAlpha : 1;
  c.root.position.set(lerp(c.px0, c.x, a), lerp(c.py0, c.y, a), lerp(c.pz0, c.z, a));
  c.root.rotation.y = c.ph0 + wrapAngle(c.heading - c.ph0) * a;
  // 车身悬挂：加速抬头、刹车点头、过弯侧倾；上跳台 / 飞在空中时车头跟着竖直速度抬起或压低；弯道倾角让车身跟着路面斜
  const climb = -Math.atan2(c.vy, Math.max(Math.abs(c.vF), 6)) * (c.air ? 0.8 : 1);
  const pitchT = clamp(-c.accel * 0.004, -0.06, 0.05) + clamp(climb, -0.3, 0.3);
  const rollT = clamp(c.vF * c.yawRate * 0.004, -0.07, 0.07);
  const k = Math.min(1, dt * (c.air ? 3 : 6));
  c.pitch += (pitchT - c.pitch) * k;
  c.roll += (rollT - c.roll) * k;
  c.bankRoll += (Math.atan(c.bankSlope) - c.bankRoll) * Math.min(1, dt * 8);
  c.body.rotation.set(c.pitch, 0, c.roll + c.bankRoll);
  c.body.position.y = Math.sin(t * 40 + c.x) * 0.004 * Math.min(Math.abs(c.vF) / 20, 1);

  c.wheelRot += (c.state === 'drive' || c.state === 'spin' ? c.vF : c.vF * 0.5) * dt;
  for (const w of c.built.wheels) {
    w.spin.rotation.x = c.wheelRot / w.radius;
    if (w.front) w.steer.rotation.y = c.steer * 0.45;
  }
  c.sw.rotation.z = -c.steer * 1.5;
  const R = c.built.wheelR, seat = c.built.seat, sc = c.built.pelScale;
  const toPel = (sign, out) => out.set(sign * R, 0, 0)
    .applyAxisAngle(Z_AXIS, c.sw.rotation.z).applyAxisAngle(X_AXIS_TMP, c.built.wheelTilt)
    .add(c.built.wheelPos).sub(seat).divideScalar(sc);
  poseWings(c.pel, [toPel(1, gripA), toPel(-1, gripB)]);
  animatePelican(c.pel, dt, t, c.steer, c.accel, Math.abs(c.vF));

  // 尾焰：氮气是长火焰，小喷 / 起步加速是短一点的
  const burning = c.nitroTime > 0, turbo = c.turboT > 0;
  for (const f of c.flames) {
    f.visible = burning || turbo;
    if (burning) f.scale.set(1, 1, 0.8 + Math.random() * 0.6 + (c.nitroTime > NITRO_BURN - 0.3 ? 0.8 : 0));
    else if (turbo) f.scale.set(0.8, 0.8, 0.45 + Math.random() * 0.35);
  }
  c.root.visible = c.active && (c.ghost > 0 ? Math.floor(c.ghost * 10) % 2 === 0 : true);
  if (c.lightbar) flashLightbar(c);

  // 刹车灯：踩刹车、或者前进中按倒车（减速）时亮起
  const braking = c.state === 'drive' && ((c.ctl.brake && Math.abs(c.vF) > 0.3) || (c.ctl.reverse && c.vF > 0.5));
  c.brakeGlow += ((braking ? 1 : 0) - c.brakeGlow) * Math.min(1, dt * 18);
  const night = THEMES[T.def.theme].night ? 1 : 0;
  c.tailMat.emissiveIntensity = 0.9 + night * 0.6 + c.brakeGlow * 4;
  for (const g of c.tailGlows) {
    g.material.opacity = 0.12 + night * 0.25 + c.brakeGlow * 0.6;
    g.scale.setScalar(0.22 + night * 0.12 + c.brakeGlow * 0.36);
  }
}
const X_AXIS_TMP = new THREE.Vector3(1, 0, 0);

// 胎痕：轮胎打滑时在路面留下黑色痕迹（环形缓冲，最旧的会被新的覆盖）
const SKID_MAX = 1500;
const skidMesh = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x141414, transparent: true, opacity: 0.5, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -12 }),
  SKID_MAX);
skidMesh.count = 0;
skidMesh.frustumCulled = false;
scene.add(skidMesh);
let skidNext = 0;
const skidM = new THREE.Matrix4(), skidQ = new THREE.Quaternion(), skidP = new THREE.Vector3(), skidS = new THREE.Vector3();
function addSkid(x0, z0, x1, z1, width, y = 0) {
  const dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz);
  if (len < 0.05 || len > 4) return;
  skidQ.setFromAxisAngle(UP, Math.atan2(dx, dz));
  skidM.compose(skidP.set((x0 + x1) / 2, y + 0.05, (z0 + z1) / 2), skidQ, skidS.set(width, 1, len + 0.04));
  skidMesh.setMatrixAt(skidNext, skidM);
  skidNext = (skidNext + 1) % SKID_MAX;
  skidMesh.count = Math.min(SKID_MAX, Math.max(skidMesh.count, skidNext === 0 ? SKID_MAX : skidNext));
  skidMesh.instanceMatrix.needsUpdate = true;
}
function clearSkids() {
  skidMesh.count = 0;
  skidNext = 0;
}

// 轮胎烟、胎痕、出界扬尘、氮气火星
function carEffects(c, dt) {
  if (c.state !== 'drive' || c.air) { c.skidLast = null; return; }
  const y = c.y;
  const [fx, fz] = forwardOf(c.heading);
  // 扎胎：轮毂擦地冒火花
  if (c.flatT > 0 && Math.abs(c.vF) > 5 && Math.random() < dt * 25) {
    emit(sparkPool, v(c.x - fx * c.built.half[1] * 0.6 + rand(-0.8, 0.8), y + 0.15, c.z - fz * c.built.half[1] * 0.6 + rand(-0.8, 0.8)), { vel: v(-fx * 4 + rand(-1, 1), rand(0.5, 2), -fz * 4 + rand(-1, 1)), life: 0.3, size0: 0.25, size1: 0.05, color: 0xffc040, gravity: 10, alpha: 1 });
  }
  const rearX = c.x - fx * c.built.half[1] * 0.7, rearZ = c.z - fz * c.built.half[1] * 0.7;
  const off = c.off;
  const slide = Math.abs(c.vL);
  const hardBrake = c.ctl.brake && !c.ctl.throttle && c.vF > 18;
  const skidding = !off && dt > 0 && (c.drift > 0.35 || slide > 4 || hardBrake);
  if (skidding) {
    // 后轮的世界坐标：前向 (fx, fz)，左向 (fz, -fx)
    const rear = c.built.wheels.filter((w) => !w.front);
    const pts = rear.map((w) => {
      const lx = w.steer.position.x, lz = w.steer.position.z;
      return [c.x + fx * lz + fz * lx, c.z + fz * lz - fx * lx];
    });
    if (c.skidLast) pts.forEach((p, i) => addSkid(c.skidLast[i][0], c.skidLast[i][1], p[0], p[1], rear[i].radius * 0.75, y));
    c.skidLast = pts;
    // 漂移时两个后轮都冒烟
    if (Math.random() < dt * (c.drift > 0.35 ? 45 : 30)) {
      const [px, pz] = pick(pts);
      emit(smokePool, v(px + rand(-0.3, 0.3), y + 0.3, pz + rand(-0.3, 0.3)), { vel: v(rand(-0.4, 0.4), 0.9, rand(-0.4, 0.4)), life: 1.6, size0: 0.8, size1: c.drift > 0.35 ? 4.5 : 3.5, color: 0xeeeeee, alpha: 0.38 });
    }
  } else {
    c.skidLast = null;
  }
  if (off && Math.abs(c.vF) > 5 && Math.random() < dt * 25) {
    const color = THEMES[T.def.theme].shoulder[0];
    emit(smokePool, v(rearX + rand(-0.8, 0.8), y + 0.3, rearZ + rand(-0.8, 0.8)), { vel: v(-fx * 2, 1.2, -fz * 2), life: 1.2, size0: 1, size1: 4, color, alpha: 0.5 });
  }
  if (c.nitroTime > 0 && Math.random() < dt * 20) {
    const e = c.built.exhausts[0];
    emit(sparkPool, v(c.x - fx * (c.built.half[1] + 0.8), y + e.y, c.z - fz * (c.built.half[1] + 0.8)), { vel: v(-fx * 6 + rand(-1, 1), rand(0, 1.5), -fz * 6 + rand(-1, 1)), life: 0.3, size0: 0.6, size1: 0.1, color: 0x66bbff, alpha: 0.9 });
  }
}

// 比赛状态、设置存档、开局、倒计时、圈数与名次、最佳成绩
'use strict';

// =====================================================================
// 比赛状态
// menu 菜单（镜头绕车旋转）→ countdown 发车灯倒计时 → racing 比赛中 → 玩家冲线后 AI 代驾 → 成绩单
// =====================================================================
let racers = [];
let player = null;
let raceState = 'menu';
let raceTime = 0;
let countdownT = 0, goAt = 3.6, lightsOn = 0;
let paused = false;
let shake = 0;
let crashes = 0;
let finishWait = 0;
let resultsShown = false;
let elapsed = 0;

const DIFFICULTY = {
  // rubber：追赶机制的范围 [领先玩家时最多放慢, 落后玩家时最多加快]
  easy: { name: '简单', skill: 0.76, perf: 0.84, err: 0.4, rubber: [-0.09, 0.02] },
  normal: { name: '普通', skill: 0.84, perf: 0.91, err: 0.25, rubber: [-0.06, 0.04] },
  hard: { name: '困难', skill: 0.92, perf: 0.98, err: 0.1, rubber: [-0.03, 0.06] },
};
const COLORS = [null, 0xd11f1f, 0xff6a13, 0xf2b705, 0x2fa84f, 0x1f5fbf, 0x7b2cbf, 0xf06292, 0xf4f4f4, 0x1a1a1a];
const hexCss = (h) => `#${h.toString(16).padStart(6, '0')}`;

const store = {
  get(key, fallback) { try { const x = localStorage.getItem(key); return x ? JSON.parse(x) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 隐私模式等情况下忽略 */ } },
};
const settings = Object.assign({ track: 'seaside', car: 'gt', color: null, difficulty: 'normal', laps: 3, mode: 'race', livery: 'stock', accent: null, mirror: true }, store.get('pelican-racing-settings', {}));
if (!TRACK_BY_ID[settings.track]) settings.track = 'seaside';
if (!CAR_BY_ID[settings.car]) settings.car = 'gt';
if (!['race', 'items', 'timetrial', 'drift', 'pursuit', 'heli', 'free'].includes(settings.mode)) settings.mode = 'race';
let freeRoam = false;   // 名次赛结束后选择"继续自由开车"
const isFree = () => settings.mode === 'free' || freeRoam;
const saveSettings = () => store.set('pelican-racing-settings', settings);
if (settings.music === false) { sound.musicOn = false; $('music').textContent = '音乐：关'; }
const bestKey = (trackId) => `pelican-racing-best-${trackId}`;

const shuffle = (list) => {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

let npcLineup = null;   // 同一局菜单里换车时保持对手不变
function setupRace({ newRivals = false } = {}) {

  if (settings.mode === 'free') {
    if (worldMode !== 'open' || !world) buildOpenWorld();
    T = regionTracks[def.id];   // 从选中的地图出发
  } else if (worldMode !== 'single' || !T || T.def !== def) {
    buildWorld(def);
  }
  racers.forEach(removeRacer);
  racers = [];
  const diff = DIFFICULTY[settings.difficulty];

  player = createRacer({
    carId: settings.car, color: settings.color ?? CAR_BY_ID[settings.car].color, isPlayer: true, helmet: 0xffffff,
    look: { pattern: settings.livery ?? 'stock', accent: settings.accent ?? null },
  });
  player.headlight.intensity = worldMode === 'single' && THEMES[def.theme].night ? 220 : 0;
  if (!npcLineup || newRivals) {
    const cars = shuffle(CARS.map((c) => c.id));
    npcLineup = shuffle(NPC_PROFILES).slice(0, 4).map((p, i) => ({
      profile: p, car: cars[i], bias: rand(-0.7, 0.7), jitter: rand(-0.025, 0.025),
      look: { pattern: Math.random() < 0.4 ? 'stock' : pick(LIVERIES.slice(1))[0], accent: null },   // 对手的涂装也随机
    }));
  }
  // 计时赛、漂移赛是单人模式，没有对手
  const npcs = isSolo() ? [] : npcLineup.map(({ profile: [name, hex, css], car, bias, jitter, look }) => {
    const c = createRacer({ carId: car, color: hex, name, css, look });
    c.skill = diff.skill + jitter;
    c.basePerf = diff.perf + jitter;
    c.errRate = diff.err;
    if (isFree()) {   // 自由驾驶：各开各的，有人慢悠悠兜风，有人跑得快一些
      c.basePerf = rand(0.72, 0.92);
      c.skill = rand(0.72, 0.86);
    }
    c.perf = c.basePerf;
    c.laneBias = bias;
    return c;
  });
  racers = [...npcs, player];
  racers.forEach((c, i) => {
    if (isFree() && !c.isPlayer) {   // 自由驾驶：对手分散在整条赛道上
      c.lapCount = 1;
      placeRacer(c, T.L * (i + 1) / (racers.length + 0.5), rand(-0.4, 0.4) * T.W);
      return;
    }
    const slot = gridSlot(isFree() || isSolo() ? 0 : i);
    c.lapCount = 0;
    placeRacer(c, slot.s, isSolo() ? 0 : slot.lat);
  });
  raceTime = 0;
  crashes = 0;
  resultsShown = false;
  rec = { frames: [], acc: 0 };
  startLights.forEach((m) => { m.emissiveIntensity = 0; });
  clearSkids();
  turboStats.normal = turboStats.perfect = 0;
  carEvents.length = 0;
  if (settings.mode === 'pursuit') setupPursuit(); else clearPursuit();
  if (isItems()) setupItems(); else clearItems();
  if (isTimeTrial()) setupTimeTrial(); else clearGhost();
  if (isDrift()) setupDrift();
  if (isHeliMode()) setupHeliMode(); else clearHeliMode();
  modeHud.style.display = 'none';
  drawMinimapBase();
  setView(viewMode);
  if (worldMode === 'open') applyBlendedTheme(player.x, player.z, true);
}

function startCountdown() {
  raceState = 'countdown';
  countdownT = 0;
  lightsOn = 0;
  goAt = 3.2 + Math.random() * 0.8;
  startPress = null;
  physAcc = 0;
  document.body.classList.add('racing');
  for (const id of ['raceHud', 'board', 'minimap', 'speedo']) $(id).style.display = 'block';
  hudTimer = 0;
  if (isFree()) {
    $('board').style.display = 'none';
    raceState = 'racing';
    raceTime = 0;
    showMessage('🚗 自由驾驶<small>随便开，其他鹈鹕也在兜风 · 按 Esc 打开菜单</small>', 3);
    return;
  }
  if (isSolo()) $('board').style.display = 'none';
  if (isItems() || isSolo()) modeHud.style.display = 'block';
  if (isHeliMode()) {
    modeHud.style.display = 'block';
    $('board').style.display = 'none';
    showMessage('<div class="huge">🚁</div>空中追捕：逃犯就在前面！<small>↑↓ 前进/减速 · ←→ 转向 · Q/E 升降 · 空格投放钉刺带 · T 切换视角（俯瞰）</small>');
    return;
  }
  const intro = { items: '🍄 道具赛：撞碎道具箱拿道具，按 X 使用', timetrial: '⏱ 计时赛：挑战最快单圈，半透明的是你的纪录幽灵车', drift: '🌀 漂移赛：过弯甩尾拿分，连续漂移倍率更高，撞墙清零' }[settings.mode];
  if (intro) {
    showMessage(`<div class="huge">🔴</div>等待发车灯熄灭……<small>${intro}</small>`);
    return;
  }
  if (isPursuit()) {
    $('pursuitHud').style.display = 'block';
    showMessage('<div class="huge">🚨</div>警匪追逐：甩掉警察，第一个冲线！<small>被警车围住停下来就会被捕 · 撞毁警车能减轻压力</small>');
    return;
  }
  showMessage('<div class="huge">🔴</div>等待发车灯熄灭……<small>灯灭的一瞬间按下 ↑ 能完美起步（按早了不算）</small>');
}

function onLap(c) {
  if (c.finished) return;
  const lapTime = raceTime - c.lapStart;
  c.lapStart = raceTime;
  c.lapTimes.push(lapTime);
  c.bestLap = Math.min(c.bestLap, lapTime);
  if (isFree()) {
    if (c.isPlayer) {
      sound.lap();
      sound.cheer(0.5);
      showMessage(`第 ${c.lapCount - 1} 圈完成<small>用时 ${formatTime(lapTime)}${lapTime <= c.bestLap ? ' · 个人最快' : ''}</small>`, 2.2);
      const best = store.get(bestKey(T.def.id), {});
      if (lapTime < (best.lap ?? Infinity)) store.set(bestKey(T.def.id), { ...best, lap: lapTime, lapCar: c.carId });
    }
    return;
  }
  if (c.isPlayer && isTimeTrial()) timeTrialLap(lapTime);
  const laps = settings.laps;
  if (c.lapCount === laps + 1) return finishRacer(c);
  if (c.isPlayer) {
    sound.lap();
    sound.cheer(0.6);
    const last = c.lapCount === laps;
    showMessage(`${last ? '🏁 最后一圈！' : `第 ${c.lapCount} / ${laps} 圈`}<small>上一圈 ${formatTime(lapTime)}${lapTime <= c.bestLap ? ' · 个人最快' : ''}</small>`, 2.2);
  }
}

function finishRacer(c) {
  c.finished = true;
  c.finishTime = raceTime;
  if (c.isPlayer) {
    if (isDrift()) {
      bankDrift();
      if (drift.total > drift.best) { drift.best = drift.total; store.set(driftKey(T.def.id), drift.total); drift.newRecord = true; } else drift.newRecord = false;
    }
    raceState = 'done';
    finishWait = 0;
    sound.fanfare();
    sound.cheer(1.4);
    const pos = standings().indexOf(c) + 1;
    if (isDrift()) showMessage(`<div class="huge">🌀</div>完成！${drift.total.toLocaleString()} 分<small>${driftMedal(drift.total, settings.laps) || '再接再厉'}</small>`, 3.5);
    else if (isTimeTrial()) showMessage(`<div class="huge">⏱</div>完成！<small>用时 ${formatTime(c.finishTime)} · 最快单圈 ${formatTime(c.bestLap)}</small>`, 3.5);
    else showMessage(`<div class="huge">${pos === 1 ? '🏆' : '🏁'}</div>冲线！第 ${pos} 名<small>用时 ${formatTime(c.finishTime)}</small>`, 3.5);
    saveBest(c);
  }
}

function standings() {
  return [...racers].sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished !== b.finished) return a.finished ? -1 : 1;
    return b.progress - a.progress;
  });
}

function estimatedTime(c) {
  if (c.finished) return c.finishTime;
  const total = settings.laps * T.L;
  const avg = Math.max(10, (c.progress + 30) / Math.max(raceTime, 1));
  return raceTime + Math.max(0, total - c.progress) / avg;
}

function saveBest(c) {
  const best = store.get(bestKey(T.def.id), {});
  let changed = false;
  if (settings.laps >= 3 && (!best.total || c.finishTime < best.total)) { best.total = c.finishTime; best.totalCar = c.carId; changed = true; }
  if (c.bestLap < (best.lap ?? Infinity)) { best.lap = c.bestLap; best.lapCar = c.carId; changed = true; }
  if (changed) store.set(bestKey(T.def.id), best);
  c.newRecord = changed;
}

const formatTime = (s) => {
  if (!isFinite(s)) return '--:--.--';
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(2).padStart(5, '0')}`;
};

/* ===== js/game/police.js ===== */
// 警匪追逐（仿《极品飞车：热力追踪》）：警车追捕玩家、警用直升机空中追踪并投放钉刺带；
// 被警车围住、停下来（或撞车）一段时间就算被捕，比赛结束。热度随时间和圈数升级，追捕越来越猛。
'use strict';

const POLICE_MAX = 4;
let cops = [];            // 警车（预先建好，热度升级时陆续出动）
let heli = null;          // 警用直升机
let spikes = [];          // 路上的钉刺带
const pursuit = { heat: 1, maxHeat: 1, bust: 0, busted: false, bustedAt: 0, nextSpike: 0, takedowns: 0 };
const isPursuit = () => settings.mode === 'pursuit' && !freeRoam && worldMode === 'single';
const activeCops = () => cops.filter((c) => c.active);
// 参与物理、碰撞、渲染的所有车：比赛选手 + 出动中的警车
const allCars = () => (cops.length ? [...racers, ...activeCops()] : racers);
const HEAT_TEXT = ['', '★☆☆', '★★☆', '★★★'];

// ---------------- 建立 / 清除 ----------------
function setupPursuit() {
  clearPursuit();
  for (let i = 0; i < POLICE_MAX; i++) {
    const c = createRacer({ carId: 'gt', color: 0x121418, look: { pattern: 'police', accent: null }, police: true });
    Object.assign(c, { isPolice: true, active: false, name: '警车', css: '#2b6cff', skill: 0.95, basePerf: 1, perf: 1, errRate: 0, laneBias: 0 });
    addLightbar(c);
    c.root.visible = false;
    cops.push(c);
  }
  heli = buildHeli();
  Object.assign(pursuit, { heat: 1, maxHeat: 1, bust: 0, busted: false, bustedAt: 0, nextSpike: 0, takedowns: 0 });
  // 开局：一辆警车堵在发车格后面，一辆埋伏在前方路边
  deployCop(cops[0], { s: -58, lat: 0 });
  deployCop(cops[1], { s: 480, lat: (Math.random() < 0.5 ? -1 : 1) * T.W * 0.55, parked: true });
}

function clearPursuit() {
  cops.forEach(removeRacer);
  cops = [];
  if (heli) {
    disposeTree(heli.beam);
    heli.spot.target.removeFromParent();
    disposeTree(heli.group);
    heli = null;
  }
  spikes.forEach((sp) => disposeTree(sp.group));
  spikes = [];
  pursuit.busted = false;
  $('pursuitHud').style.display = 'none';
}

// 把一辆警车放到赛道上（s 为沿赛道的位置，可以是负数 = 起终点线之前）
function deployCop(c, { s, lat = 0, speed = 0, parked = false }) {
  let lapCount = player ? player.lapCount : 0;
  // 进度要和玩家算在同一圈的尺度上，才能判断谁在前面
  const base = player ? player.s : 0;
  let target = base + s;
  if (!player) target = s;
  while (target < 0) { target += T.L; lapCount--; }
  while (target >= T.L) { target -= T.L; lapCount++; }
  c.lapCount = lapCount;
  c.maxLap = lapCount;
  placeRacer(c, target, lat);
  const p = trackPoint(T, target, lat);
  c.vx = Math.sin(p.heading) * speed;
  c.vz = Math.cos(p.heading) * speed;
  c.vF = speed;
  Object.assign(c, { active: true, state: 'drive', crashT: 0, ghost: 0, stuckT: 0, parked, nitroCharge: 0.5 });
  c.tumble.position.set(0, 0, 0);
  c.tumble.rotation.set(0, 0, 0);
  c.root.visible = true;
}

// 撞毁或跟丢的警车：过一会儿从玩家后方重新追上来
function respawnCop(c) {
  deployCop(c, { s: -(170 + Math.random() * 80), lat: rand(-0.4, 0.4) * T.W, speed: Math.max(20, player.vF * 0.95) });
}

// ---------------- 警车 AI：远了沿赛道全速追，近了直接冲向玩家（撞击 / 夹击），在玩家前面就放慢堵路 ----------------
function policeControl(c, dt) {
  const p = player, sp = c.spec, ctl = c.ctl;
  const spd = Math.max(c.vF, 0);
  let gap = p.progress - c.progress;   // >0：玩家在前面
  const dist = Math.hypot(p.x - c.x, p.z - c.z);
  // 发车后前 3 秒警察原地不动，给玩家一点起步时间；埋伏的警车在玩家靠近前一直停在路边
  if (c.parked || raceTime < 3) {
    ctl.steer = 0; ctl.throttle = false; ctl.brake = true; ctl.reverse = false;
    if (gap > -60 && raceTime >= 3) c.parked = false;
    return;
  }
  // 越落后跑得越快；热度越高越猛
  c.perf = clamp(0.99 + gap / 1400, 0.96, 1.14) * (1 + (pursuit.heat - 1) * 0.03);
  const g = sp.grip * c.perf * 0.95, decel = sp.brake * 0.75;
  let vT = (sp.vmax / 3.6) * c.perf * (c.nitroTime > 0 ? 1.22 : 1);
  const steps = Math.min(120, Math.round((25 + (spd * spd) / (2 * decel)) / T.ds));
  for (let j = 2; j < steps; j += 2) {
    const kk = Math.abs(T.k[T.wrap(c.idx + j)]) + 1e-4;
    vT = Math.min(vT, Math.sqrt(g / kk + 2 * decel * j * T.ds));
  }
  vT = Math.max(vT, 8);
  let tx, tz;
  const slowPlayer = Math.abs(p.vF) < 8 || p.state !== 'drive';
  if (slowPlayer && dist < 90) {
    // 玩家停下或撞车：直接开过去，一左一右贴到旁边把车围住
    const [fx, fz] = forwardOf(p.heading);
    const side = cops.indexOf(c) % 2 ? 1 : -1;
    tx = p.x + fz * side * 3.4 - fx * 1.5;
    tz = p.z - fx * side * 3.4 - fz * 1.5;
    vT = clamp(Math.hypot(tx - c.x, tz - c.z) * 0.5, 0, 16);
  } else if (gap < -20) {
    // 在玩家前面：放慢，车道对准玩家，挡在路上
    vT = Math.min(vT, Math.max(6, p.vF * 0.75));
    c.aiLat += (clamp(p.lat, -T.W * 0.8, T.W * 0.8) - c.aiLat) * Math.min(1, dt * 2);
    const tp = trackPoint(T, c.s + 8 + spd * 0.4, c.aiLat);
    tx = tp.x; tz = tp.z;
  } else if (dist < 38) {
    // 近身：冲向玩家的预判位置，以比玩家略快的速度顶上去（热度越高撞得越狠）
    const lead = clamp(dist / 45, 0.1, 0.55);
    tx = p.x + p.vx * lead;
    tz = p.z + p.vz * lead;
    // 追尾的相对速度控制在 ~15 m/s 以内：能把玩家顶歪、撞得打滑，但不至于一下撞翻
    vT = Math.min(vT * 1.05, p.vF + clamp(dist * 0.45, 3, 11) + (pursuit.heat - 1) * 2);
  } else {
    const look = 7 + spd * 0.45;
    const latT = gap < 160 ? p.lat : 0;
    c.aiLat += (clamp(latT, -T.W * 0.8, T.W * 0.8) - c.aiLat) * Math.min(1, dt * 1.5);
    const tp = trackPoint(T, c.s + look, c.aiLat);
    tx = tp.x; tz = tp.z;
  }
  const err = wrapAngle(Math.atan2(tx - c.x, tz - c.z) - c.heading);
  const cap = Math.min(1.9, (sp.grip * c.perf) / Math.max(spd, 1));
  ctl.steer = clamp((err * 2.4) / cap, -1, 1);
  ctl.throttle = c.vF < vT - 0.3;
  ctl.brake = c.vF > vT + 3;
  ctl.reverse = false;
  if (Math.abs(err) > 1.4 && spd < 6) { ctl.steer = Math.sign(err); ctl.throttle = true; }
  if (c.nitroCharge >= 1 && gap > 50 && vT > c.vF + 10) useNitro(c);
  // 卡住或远远落后就重新部署
  c.stuckT = spd < 1.5 ? c.stuckT + dt : 0;
  if (c.stuckT > 3 || gap > 700) respawnCop(c);
}

// ---------------- 每帧：热度、增援、直升机、钉刺带、被捕判定 ----------------
function updatePursuit(dt) {
  if (!isPursuit() || !player) return;
  if (pursuit.busted) {
    finishWait += dt;
    if (finishWait > 3.5 && !resultsShown) showResults();
    return;
  }
  if (raceState !== 'racing' || player.finished) return;
  // 热度：随时间或圈数升级
  const heat = clamp(Math.max(1 + Math.floor(raceTime / 45), player.lapCount), 1, 3);
  if (heat > pursuit.heat) {
    pursuit.heat = heat;
    pursuit.maxHeat = Math.max(pursuit.maxHeat, heat);
    const idle = cops.find((c) => !c.active);
    if (idle) respawnCop(idle);
    if (heat >= 2 && !heli.active) launchHeli();
    if (heat === 3) { const extra = cops.find((c) => !c.active); if (extra) respawnCop(extra); }
    showMessage(`🚨 热度升级 ${HEAT_TEXT[heat]}<small>${heat === 2 ? '警用直升机加入追捕！' : '更多警车出动，直升机开始投放钉刺带！'}</small>`, 2.5);
    sound.alarm();
  }
  // 直升机投放钉刺带（热度 3，或者热度 2 时偶尔）
  if (heli.active) {
    pursuit.nextSpike -= dt;
    if (pursuit.nextSpike <= 0 && heat >= 2) {
      pursuit.nextSpike = heat === 3 ? rand(11, 16) : rand(20, 28);
      dropSpikes();
    }
  }
  updateSpikes(dt);
  // 被捕：警车就在旁边，而玩家停下来了（或撞车了）
  const near = activeCops().filter((c) => c.state === 'drive' && Math.hypot(c.x - player.x, c.z - player.z) < 12).length;
  const stuck = (player.state !== 'drive' || Math.abs(player.vF) < 9) && player.ghost <= 0;   // 按 R 重新启动后的保护时间内不算
  if (near && stuck) pursuit.bust = Math.min(1, pursuit.bust + dt * (near >= 2 ? 0.55 : 0.38));
  else pursuit.bust = Math.max(0, pursuit.bust - dt * 0.5);
  if (pursuit.bust >= 1) bustPlayer();
}

function bustPlayer() {
  pursuit.busted = true;
  pursuit.bustedAt = raceTime;
  player.busted = true;
  raceState = 'done';
  finishWait = 0;
  sound.busted();
  showMessage('<div class="huge">🚓</div>被捕了！<small>被警察拦下，比赛结束</small>', 3.5);
}

// 警车被撞毁时的提示
function onCopCrash(c) {
  if (Math.hypot(c.x - player.x, c.z - player.z) < 40 && !pursuit.busted) {
    pursuit.takedowns++;
    showMessage(`💥 撞毁警车！<small>已撞毁 ${pursuit.takedowns} 辆</small>`, 1.8);
  }
}

// ---------------- 钉刺带 ----------------
const spikeGeo = merge([
  [new THREE.BoxGeometry(1, 0.05, 0.34), compose(v(0, 0.025, 0))],
  ...Array.from({ length: 24 }, (_, i) => [new THREE.ConeGeometry(0.035, 0.12, 5), compose(v((i / 23 - 0.5) * 0.96, 0.1, (i % 2 ? 0.08 : -0.08)))]),
]);
spikeGeo.userData.shared = true;
const spikeMat = mat(0x2a2a2e, { metalness: 0.7, roughness: 0.4 });
spikeMat.userData.shared = true;

function dropSpikes() {
  const s = player.s + 130 + Math.random() * 40;
  const half = T.W * 0.55;
  const lat = clamp(player.lat + rand(-2, 2), -T.W + half * 0.6, T.W - half * 0.6);
  const p = trackPoint(T, s, lat);
  const group = new THREE.Group();
  const m = mesh(spikeGeo, spikeMat);
  m.scale.x = half * 2;
  group.add(m);
  group.position.set(p.x, 0.02 + bankHeight(T, p.i, lat), p.z);
  group.rotation.y = p.heading;   // 钉刺带横跨车道（局部 x 轴 = 赛道左右方向）
  scene.add(group);
  spikes.push({ group, x: p.x, z: p.z, heading: p.heading, half, life: 30, s, lat });
  emit(smokePool, v(p.x, 0.5, p.z), { vel: v(0, 2, 0), life: 1, size0: 1, size1: 4, color: 0xdddddd, alpha: 0.5 });
  showMessage('⚠️ 前方钉刺带！<small>直升机投放了路障，注意避让</small>', 1.8);
}

// 空中追捕：从直升机上扔下去，带着直升机的水平速度落下，落地后横着铺在赛道上
function dropSpikesFromAir(x, y, z, vx, vz, half) {
  const group = new THREE.Group();
  const m = mesh(spikeGeo, spikeMat);
  m.scale.x = half * 2;
  group.add(m);
  group.position.set(x, y, z);
  scene.add(group);
  spikes.push({ group, x, z, vx, vz, vy: 0, falling: true, heading: 0, half, life: 40, s: 0, lat: 0 });
}
function landSpikes(sp) {
  const i = projectGlobal(T, sp.x, sp.z);
  const tc = trackCoords(T, sp.x, sp.z, i);
  sp.falling = false;
  sp.s = tc.s;
  sp.lat = tc.lat;
  sp.heading = T.heading[i];
  sp.group.position.set(sp.x, (Math.abs(tc.lat) < T.B + 0.5 ? bankHeight(T, i, tc.lat) : 0) + 0.02, sp.z);
  sp.group.rotation.set(0, sp.heading, 0);
  emit(smokePool, v(sp.x, 0.5, sp.z), { vel: v(0, 1.5, 0), life: 0.8, size0: 1, size1: 3.5, color: 0xd8d0c0, alpha: 0.5 });
  sound.bump(3);
}

function updateSpikes(dt) {
  for (let i = spikes.length - 1; i >= 0; i--) {
    const sp = spikes[i];
    sp.life -= dt;
    if (sp.life <= 0) { disposeTree(sp.group); spikes.splice(i, 1); continue; }
    if (sp.falling) {
      sp.vy -= GRAVITY * dt;
      sp.x += sp.vx * dt;
      sp.z += sp.vz * dt;
      sp.group.position.set(sp.x, sp.group.position.y + sp.vy * dt, sp.z);
      sp.group.rotation.y += dt * 3;
      if (sp.group.position.y <= 0.3) landSpikes(sp);
      continue;
    }
    const tx = Math.sin(sp.heading), tz = Math.cos(sp.heading);
    for (const c of racers) {
      if (c.flatT > 0 || c.state !== 'drive' || c.air || !c.active) continue;
      const dx = c.x - sp.x, dz = c.z - sp.z;
      const along = dx * tx + dz * tz, across = dx * tz - dz * tx;
      if (Math.abs(along) < 0.5 + c.built.half[1] * 0.3 && Math.abs(across) < sp.half + c.built.half[0] * 0.6) {
        c.flatT = 7;
        if (heliMode.on) onHeliSpikeHit(c);
        for (let k = 0; k < 12; k++) emit(sparkPool, v(c.x, 0.3, c.z), { vel: v(rand(-4, 4), rand(1, 4), rand(-4, 4)), life: 0.4, size0: 0.3, size1: 0.05, color: 0xffc040, gravity: 12, alpha: 1 });
        if (c.isPlayer) {
          sound.pop();
          shake = Math.max(shake, 0.5);
          showMessage('🛞 扎胎了！<small>速度和抓地力下降 7 秒</small>', 2);
        }
      }
    }
  }
}
