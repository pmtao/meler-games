// =====================================================================
// 赛道数据：沿中心线每 ~2 米一个采样点，存位置、切线、左法线、曲率
// =====================================================================
function buildTrackData(def, offset = [0, 0]) {
  const curve = new THREE.CatmullRomCurve3(def.points.map(([x, z]) => v(x + offset[0], 0, z + offset[1])), true, 'centripetal');
  const L = curve.getLength();
  const N = Math.round(L / 2);
  const pts = curve.getSpacedPoints(N);
  pts.pop();
  const ds = L / N;
  const T = {
    def, N, L, ds, W: def.W, B: def.W + RUNOFF,
    px: new Float32Array(N), pz: new Float32Array(N), tx: new Float32Array(N), tz: new Float32Array(N),
    nx: new Float32Array(N), nz: new Float32Array(N), k: new Float32Array(N), heading: new Float32Array(N),
  };
  pts.forEach((p, i) => { T.px[i] = p.x; T.pz[i] = p.z; });
  const w = (i) => ((i % N) + N) % N;
  for (let i = 0; i < N; i++) {
    const dx = T.px[w(i + 1)] - T.px[w(i - 1)], dz = T.pz[w(i + 1)] - T.pz[w(i - 1)];
    const len = Math.hypot(dx, dz);
    T.tx[i] = dx / len; T.tz[i] = dz / len;
    T.nx[i] = T.tz[i]; T.nz[i] = -T.tx[i];   // 左侧法线
    T.heading[i] = Math.atan2(T.tx[i], T.tz[i]);
  }
  const raw = new Float32Array(N);
  for (let i = 0; i < N; i++) raw[i] = wrapAngle(T.heading[w(i + 2)] - T.heading[w(i - 2)]) / (4 * ds);
  for (let i = 0; i < N; i++) {
    let s = 0;
    for (let j = -4; j <= 4; j++) s += raw[w(i + j)];
    T.k[i] = s / 9;   // 正值 = 左弯
  }
  T.wrap = w;
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (let i = 0; i < N; i++) {
    x0 = Math.min(x0, T.px[i]); x1 = Math.max(x1, T.px[i]);
    z0 = Math.min(z0, T.pz[i]); z1 = Math.max(z1, T.pz[i]);
  }
  T.bounds = { x0, x1, z0, z1, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2 };
  computeBank(T);
  T.ramps = (def.ramps ?? []).map(({ at, lat }) => ({ s0: at * L, len: RAMP_LEN, lat: lat * def.W, hw: RAMP_HW, H: RAMP_H }));
  return T;
}

// =====================================================================
// 路面高度：弯道外侧抬高（倾角）+ 跳台。赛道中心线以内保持平的（不会低于地面），外侧按倾角抬起，
// 到路面边缘外 2 米封顶，缓冲区保持这个高度一直到护栏
// =====================================================================
const BANK_MAX = 0.08;     // 最大倾角（弧度，约 4.6°）
const BANK_K = 3.4;        // 倾角 = 曲率 × BANK_K
const RAMP_LEN = 11, RAMP_HW = 3, RAMP_H = 1.3;   // 跳台：长、半宽、高

function computeBank(T) {
  const N = T.N, raw = new Float32Array(N);
  for (let i = 0; i < N; i++) raw[i] = clamp(-T.k[i] * BANK_K, -BANK_MAX, BANK_MAX);
  T.bk = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let s = 0;
    for (let j = -10; j <= 10; j++) s += raw[T.wrap(i + j)];
    T.bk[i] = s / 21;
  }
  // 起终点前后（发车格、门架）保持水平
  for (let i = 0; i < N; i++) {
    const d = Math.min(i, N - i) * T.ds;
    T.bk[i] *= smoothstep(50, 90, d);
  }
}

// 开放世界：连接公路接入赛道的地方把倾角渐变到 0，免得接口处出现台阶
function flattenBankNear(T, x, z, r) {
  for (let i = 0; i < T.N; i++) {
    const d = Math.hypot(T.px[i] - x, T.pz[i] - z);
    if (d < r) T.bk[i] *= smoothstep(r * 0.4, r, d);
  }
}

// 横向偏移 lat 处的倾角抬高量
function bankHeight(T, i, lat) {
  const b = T.bk ? T.bk[i] : 0;
  const o = lat * b;
  return o > 0 ? Math.min(o, (T.W + 2) * Math.abs(b)) : 0;
}
// 跳台：前缓后陡的曲面（h = H·u^1.5），末端是竖直的台口
function rampHeight(T, s, lat) {
  for (const r of T.ramps ?? []) {
    let d = s - r.s0;
    if (d < 0) d += T.L;
    if (d < r.len && Math.abs(lat - r.lat) < r.hw) return r.H * (d / r.len) ** 1.5;
  }
  return 0;
}
// 路面（含缓冲区）在世界坐标 (x, z) 处的高度；i 是附近的采样序号
function roadHeightAt(T, i, x, z) {
  const tc = trackCoords(T, x, z, i);
  if (Math.abs(tc.lat) > T.B + 0.5) return 0;
  return bankHeight(T, i, tc.lat) + rampHeight(T, tc.s, tc.lat);
}

// 把世界坐标投影到赛道：返回采样序号、沿线距离 s、横向偏移 lat（左正右负）
function projectNear(T, x, z, hint, range = 10) {
  let best = hint, bestD = Infinity;
  for (let j = -range; j <= range; j++) {
    const i = T.wrap(hint + j);
    const d = (x - T.px[i]) ** 2 + (z - T.pz[i]) ** 2;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}
function projectGlobal(T, x, z) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < T.N; i++) {
    const d = (x - T.px[i]) ** 2 + (z - T.pz[i]) ** 2;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}
function trackCoords(T, x, z, i) {
  const dx = x - T.px[i], dz = z - T.pz[i];
  const along = dx * T.tx[i] + dz * T.tz[i];
  const lat = dx * T.nx[i] + dz * T.nz[i];
  let s = i * T.ds + along;
  if (s < 0) s += T.L; else if (s >= T.L) s -= T.L;
  return { s, lat };
}
function trackPoint(T, s, lat = 0) {
  const f = (((s % T.L) + T.L) % T.L) / T.ds;
  const i = Math.floor(f), j = T.wrap(i + 1), u = f - i;
  const x = lerp(T.px[i], T.px[j], u), z = lerp(T.pz[i], T.pz[j], u);
  return { x: x + T.nx[i] * lat, z: z + T.nz[i] * lat, heading: T.heading[i], i };
}
// 离赛道中心线的最近距离（布景用，粗略）
function distToTrack(T, x, z) {
  let best = Infinity;
  for (let i = 0; i < T.N; i += 2) best = Math.min(best, (x - T.px[i]) ** 2 + (z - T.pz[i]) ** 2);
  return Math.sqrt(best);
}

// =====================================================================
// 几何体：沿赛道的水平条带（路面、路肩、路缘石）和竖直条带（护栏）
// =====================================================================
// 横截面在中心线（倾角的折线）和封顶点处多加一列顶点，让路面贴合倾角
function ribbon(T, i0, count, off0, off1, y, vLen) {
  const pos = [], uv = [], idx = [];
  const cols = [off0];
  for (const k of [-(T.W + 2), 0, T.W + 2]) if (T.bk && k > off0 + 0.01 && k < off1 - 0.01) cols.push(k);
  cols.push(off1);
  const nc = cols.length;
  for (let j = 0; j <= count; j++) {
    const i = T.wrap(i0 + j);
    const s = (i0 + j) * T.ds;
    for (const off of cols) {
      pos.push(T.px[i] + T.nx[i] * off, y + bankHeight(T, i, off), T.pz[i] + T.nz[i] * off);
      uv.push((off - off0) / (off1 - off0), s / vLen);
    }
  }
  for (let j = 0; j < count; j++) {
    for (let k = 0; k < nc - 1; k++) {
      const a = j * nc + k, b = a + 1, c = a + nc, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// 竖直条带：y0 为 0 时底边贴地，否则上下两边都跟着路面抬高
function wallRibbon(T, off, y0, y1, vLen) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= T.N; j++) {
    const i = T.wrap(j);
    const x = T.px[i] + T.nx[i] * off, z = T.pz[i] + T.nz[i] * off;
    const h = bankHeight(T, i, off);
    pos.push(x, y0 > 0 ? y0 + h : y0, z, x, y1 + h, z);
    uv.push((j * T.ds) / vLen, 0, (j * T.ds) / vLen, 1);
  }
  for (let j = 0; j < T.N; j++) {
    const a = 2 * j;
    idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// 贴地的多层平面（路肩 < 路面 < 路缘石 < 起跑线）用多边形偏移分出前后，避免远处闪烁
const LAYER = (n) => ({ polygonOffset: true, polygonOffsetFactor: -n, polygonOffsetUnits: -n * 2 });

// 一圈长度必须是贴图周期的整数倍，首尾才能无缝衔接
const loopPeriod = (T, target) => T.L / Math.max(1, Math.round(T.L / target));

/* ===== js/world/scenery.js ===== */
// 单赛道世界（名次赛）和各区域布景：路面、护栏、起终点门架、看台、海滨/峡谷/雪山/夜城
'use strict';

// =====================================================================
// 天空与光照主题
// =====================================================================
let envTarget = null;
let nightEnvScene = null;
function applyTheme(theme) {
  if (envTarget) envTarget.dispose();
  SUN_DIR.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - theme.sky.elev), THREE.MathUtils.degToRad(theme.sky.azim));
  if (theme.night) {
    sky.removeFromParent();
    scene.background = new THREE.Color(theme.background);
    if (!nightEnvScene) {
      nightEnvScene = new THREE.Scene();
      nightEnvScene.background = new THREE.Color(0x1a2448);
    }
    envTarget = pmrem.fromScene(nightEnvScene);
    scene.environmentIntensity = 0.5;
  } else {
    const u = sky.material.uniforms;
    u.turbidity.value = theme.sky.turbidity;
    u.rayleigh.value = theme.sky.rayleigh;
    u.mieCoefficient.value = theme.sky.mie;
    u.mieDirectionalG.value = 0.85;
    u.sunPosition.value.copy(SUN_DIR);
    scene.background = null;
    const envScene = new THREE.Scene();
    envScene.add(sky);
    envTarget = pmrem.fromScene(envScene);
    scene.add(sky);
    scene.environmentIntensity = 1.0;
  }
  scene.environment = envTarget.texture;
  renderer.toneMappingExposure = theme.exposure;
  scene.fog.color.set(theme.fog[0]);
  scene.fog.density = theme.fog[1];
  sun.color.set(theme.sun[0]);
  sun.intensity = theme.sun[1];
  hemi.color.set(theme.hemi[0]);
  hemi.groundColor.set(theme.hemi[1]);
  hemi.intensity = theme.hemi[2];
  LIGHT_DIR.copy(SUN_DIR);
}

// =====================================================================
// 布景：地面、路面、护栏、起终点门架、看台、按主题摆放的树木建筑
// =====================================================================
let world = null;          // 当前赛道的所有物体
let T = null;              // 当前赛道数据
let startLights = [];      // 门架上的 5 盏发车灯
let snowfall = null;       // 雪花
let lampPools = null;

function addTo(parent, ...objs) { parent.add(...objs); return objs[0]; }

function instancedIn(parent, geometry, material, matrices, colors = null, shadow = true) {
  if (!matrices.length) return null;
  const im = new THREE.InstancedMesh(geometry, material, matrices.length);
  matrices.forEach((m, i) => im.setMatrixAt(i, m));
  if (colors) colors.forEach((c, i) => im.setColorAt(i, c));
  im.castShadow = shadow;
  im.receiveShadow = true;
  parent.add(im);
  return im;
}

let spotFilter = null;   // 额外的摆放限制（例如海滨不能放进海里）
function findSpots(rng, count, minD, maxD, margin = 250) {
  const b = T.bounds, spots = [];
  for (let tries = 0; spots.length < count && tries < count * 30; tries++) {
    const x = b.x0 - margin + rng() * (b.x1 - b.x0 + margin * 2);
    const z = b.z0 - margin + rng() * (b.z1 - b.z0 + margin * 2);
    const d = distToTrack(T, x, z);
    if (d >= minD && d <= maxD && (!spotFilter || spotFilter(x, z)) && (!regionFilter || regionFilter(x, z))) spots.push(v(x, 0, z));
  }
  return spots;
}

function buildWorld(def) {
  resetWorld();
  worldMode = 'single';
  const theme = THEMES[def.theme];
  applyTheme(theme);
  const Tr = buildTrackData(def);
  // ---- 地面 ----
  const groundTex = noiseTexture(256, theme.ground[0], theme.ground[1], [700, 700]);
  const ground = mesh(new THREE.PlaneGeometry(7000, 7000, 70, 70).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }), false);
  ground.position.set(Tr.bounds.cx, 0, Tr.bounds.cz);
  world.add(ground);
  buildRegion(Tr, theme, { barriers: true });
}

// 一个区域：路面、路肩、路缘石、护栏（只有名次赛有）、起终点、按主题布景
function buildRegion(Tr, theme, { barriers }) {
  T = Tr;
  spotFilter = null;
  const def = Tr.def;
  const rng = seeded([...def.id].reduce((a, c) => a * 31 + c.charCodeAt(0), 7));

  // ---- 路面：沥青 + 边线 + 中间虚线 ----
  const roadLen = loopPeriod(T, 24);
  world.add(mesh(ribbon(T, 0, T.N, -T.W, T.W, 0.03, roadLen), asphaltMaterial(theme.asphalt, T.W * 2, roadLen, { extra: LAYER(3) }), false));

  // ---- 路肩（缓冲区）----
  const shoulderTex = noiseTexture(128, theme.shoulder[0], theme.shoulder[1], [1, 1], 0.5);
  const shoulderMat = new THREE.MeshStandardMaterial({ map: shoulderTex, roughness: 1, ...LAYER(2) });
  const sLen = loopPeriod(T, 8);
  world.add(mesh(ribbon(T, 0, T.N, T.W, T.B + 0.5, 0.015, sLen), shoulderMat, false));
  world.add(mesh(ribbon(T, 0, T.N, -T.B - 0.5, -T.W, 0.015, sLen), shoulderMat, false));
  // 弯道外侧抬高后，缓冲区外沿和地面之间用一圈"裙边"封住
  const skirtMat = new THREE.MeshStandardMaterial({ map: shoulderTex, color: 0xb8b8b8, roughness: 1, side: THREE.DoubleSide });
  for (const side of [-1, 1]) world.add(mesh(wallRibbon(T, side * (T.B + 0.5), 0, 0.015, sLen), skirtMat, false));

  // ---- 路缘石：只铺在弯道 ----
  const curbTex = canvasTexture(64, (g, w, h) => {
    g.fillStyle = '#d42020'; g.fillRect(0, 0, w, h / 2);
    g.fillStyle = '#f4f4f4'; g.fillRect(0, h / 2, w, h / 2);
  }, { height: 128 });
  const curbMat = new THREE.MeshStandardMaterial({ map: curbTex, roughness: 0.7, ...LAYER(4) });
  let runStart = -1;
  const isCorner = (i) => Math.abs(T.k[i]) > 1 / 140;
  for (let i = 0; i <= T.N; i++) {
    const on = i < T.N && isCorner(i);
    if (on && runStart < 0) runStart = i;
    if (!on && runStart >= 0) {
      const a = runStart - 6, count = i - runStart + 12;
      world.add(mesh(ribbon(T, a, count, T.W - 0.3, T.W + 1.1, 0.04, 4), curbMat, false));
      world.add(mesh(ribbon(T, a, count, -T.W - 1.1, -T.W + 0.3, 0.04, 4), curbMat, false));
      runStart = -1;
    }
  }

  if (barriers) {
    // ---- 护栏：双侧竖直墙，红白（或主题色）色块 ----
    const [c1, c2] = theme.barrier;
    const barrierTex = canvasTexture(128, (g, w, h) => {
      g.fillStyle = c1; g.fillRect(0, 0, w / 2, h);
      g.fillStyle = c2; g.fillRect(w / 2, 0, w / 2, h);
      g.fillStyle = '#00000030'; g.fillRect(0, h * 0.82, w, h * 0.18);
      g.fillStyle = '#ffffff30'; g.fillRect(0, 0, w, h * 0.06);
    }, { height: 64 });
    const barrierMat = new THREE.MeshStandardMaterial({ map: barrierTex, roughness: 0.6, side: THREE.DoubleSide });
    const bLen = loopPeriod(T, 6);
    for (const side of [-1, 1]) {
      const wall = mesh(wallRibbon(T, side * T.B, 0, 1.0, bLen), barrierMat);
      world.add(wall);
      if (theme.night) {
        const neon = new THREE.MeshBasicMaterial({ color: side > 0 ? 0xff2bd6 : 0x22e6ff, side: THREE.DoubleSide, fog: false });
        world.add(mesh(wallRibbon(T, side * T.B, 1.0, 1.12, 10), neon, false));
      }
    }
  }

  buildStartArea(theme);
  buildRamps(theme);
  const builders = { seaside: buildSeaside, canyon: buildCanyon, snow: buildSnow, night: buildNight, sunset: buildSunset };
  builders[def.theme](rng, theme);
}

function buildStartArea(theme) {
  const h0 = T.heading[0];
  const p0 = v(T.px[0], 0, T.pz[0]);
  const fwd = v(T.tx[0], 0, T.tz[0]);
  const left = v(T.nx[0], 0, T.nz[0]);

  // 起终点格子线
  const checker = canvasTexture(128, (g, w, h) => {
    const n = 8, c = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) {
      g.fillStyle = (i + j) % 2 ? '#111' : '#f4f4f4';
      g.fillRect(i * c, j * (h / 2), c, h / 2);
    }
  }, { height: 32, repeat: [T.W / 2, 1] });
  const line = mesh(new THREE.PlaneGeometry(T.W * 2, 2.2).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: checker, roughness: 0.7, ...LAYER(5) }), false);
  line.position.copy(p0).setY(0.045);
  line.rotation.y = h0;
  world.add(line);

  // 发车格
  const slotMat = new THREE.MeshBasicMaterial({ color: 0xf2f2f2, ...LAYER(5) });
  for (let i = 0; i < 5; i++) {
    const g = gridSlot(i);
    const p = trackPoint(T, g.s, g.lat);
    const m = mesh(new THREE.PlaneGeometry(3.2, 0.3).rotateX(-Math.PI / 2), slotMat, false);
    m.position.set(p.x, 0.045, p.z);
    m.rotation.y = p.heading;
    m.translateZ(2.8);
    world.add(m);
  }

  // 门架：两根立柱 + 横梁 + 横幅 + 发车灯
  const gantry = new THREE.Group();
  gantry.position.copy(p0);
  gantry.rotation.y = h0;
  world.add(gantry);
  const steel = mat(0x30343a, { metalness: 0.6, roughness: 0.4 });
  const span = T.W + 2;
  for (const s of [-1, 1]) gantry.add(box(0.6, 8, 0.6, steel, s * span, 4, 0));
  gantry.add(box(span * 2 + 0.6, 0.5, 0.6, steel, 0, 7.8, 0));
  const banner = canvasTexture(1024, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#c9241c'); grad.addColorStop(1, '#f07a1a');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff';
    g.font = 'bold 84px "PingFang SC", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('🏁 鹈鹕大奖赛 · PELICAN GP 🏁', w / 2, h / 2 + 4);
  }, { height: 128 });
  banner.wrapS = banner.wrapT = THREE.ClampToEdgeWrapping;
  const bannerMat = new THREE.MeshStandardMaterial({ map: banner, roughness: 0.6, side: THREE.DoubleSide });
  const bannerMesh = mesh(new THREE.PlaneGeometry(span * 2, span / 4), bannerMat);
  bannerMesh.position.set(0, 9.1, -0.32);
  bannerMesh.rotation.y = Math.PI;
  const bannerBack = bannerMesh.clone();
  bannerBack.position.z = 0.32;
  bannerBack.rotation.y = 0;
  gantry.add(bannerMesh, bannerBack, box(span * 2, span / 4 + 0.2, 0.5, steel, 0, 9.1, 0));
  // 发车灯（朝向发车格）
  startLights = [];
  const lampGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.2, 20).rotateX(Math.PI / 2);
  for (let i = 0; i < 5; i++) {
    const m = new THREE.MeshStandardMaterial({ color: 0x220000, emissive: 0xff1010, emissiveIntensity: 0, roughness: 0.3 });
    const lamp = mesh(lampGeo, m, false);
    lamp.position.set((i - 2) * 1.0, 7.1, -0.4);
    gantry.add(lamp, box(0.9, 0.9, 0.3, steel, (i - 2) * 1.0, 7.1, -0.2));
    startLights.push(m);
  }

  // 看台：放在起跑直道外侧比较空旷的一边
  let side = 1;
  const test = (sd) => distToTrack(T, p0.x + left.x * sd * (T.B + 30), p0.z + left.z * sd * (T.B + 30));
  if (test(-1) > test(1)) side = -1;
  const stand = new THREE.Group();
  stand.position.copy(p0).addScaledVector(left, side * (T.B + 4)).addScaledVector(fwd, -10);
  stand.rotation.y = h0 + (side > 0 ? Math.PI / 2 : -Math.PI / 2);   // 看台的 +z 朝向赛道
  stand.rotateY(Math.PI);
  world.add(stand);
  world.userData.stands.push(stand.position.clone());
  const concrete = mat(0x9aa0a6, { roughness: 0.9 });
  const seatColors = [0x1d6f8f, 0xd8452a, 0xf2b705];
  const length = 70;
  const crowdM = [], crowdC = [];
  for (let r = 0; r < 7; r++) {
    stand.add(box(length, 0.8 + r * 0.9, 1.6, concrete, 0, (0.8 + r * 0.9) / 2, -1.6 * r - 0.8));
    stand.add(box(length, 0.12, 0.6, mat(seatColors[r % 3]), 0, 0.86 + r * 0.9, -1.6 * r - 0.5));
    for (let x = -length / 2 + 1; x < length / 2 - 1; x += 0.9) {
      if (rng01() < 0.2) continue;
      crowdM.push(compose(v(x + rng01() * 0.3, 0.92 + r * 0.9, -1.6 * r - 0.85), new THREE.Euler(0, (rng01() - 0.5) * 0.6, 0), 1 + (rng01() - 0.5) * 0.25));
      crowdC.push(new THREE.Color().setHSL(rng01(), 0.6, 0.55));
    }
  }
  stand.add(box(length, 0.3, 13, mat(0xf4f4f4, { roughness: 0.5 }), 0, 9.5, -6));
  for (const x of [-length / 2, 0, length / 2]) stand.add(box(0.4, 9.5, 0.4, steel, x, 4.75, -11.5));
  // 观众是一只只坐着的小鹈鹕：身体、翅膀、长脖子、头、粉色长喙和橙色喉囊（顶点色），外加一顶帽子和围巾（每只颜色不同）
  const { bird, gear } = spectatorGeometry();
  const crowd = instancedIn(stand, bird, SPECTATOR_MAT, crowdM, null, false);
  crowd.userData.base = crowdM.map((m) => m.clone());
  crowd.userData.partner = instancedIn(stand, gear, SPECTATOR_GEAR_MAT, crowdM, crowdC, false);
  crowds.push(crowd);
  // 门架立柱、看台都是实心障碍物
  gantry.updateMatrixWorld(true);
  for (const s of [-1, 1]) { const p = gantry.localToWorld(v(s * span, 0, 0)); addObstacle(p.x, p.z, 0.6); }
  stand.updateMatrixWorld(true);
  for (let x = -length / 2 + 3; x <= length / 2 - 3; x += 6) { const p = stand.localToWorld(v(x, 0, -6.5)); addObstacle(p.x, p.z, 6.8); }
}
const rng01 = Math.random;

// ---------------- 阳光海滨：棕榈树、遮阳伞、大海 ----------------
function palmGeometries() {
  const frondTex = canvasTexture(256, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.strokeStyle = '#3f6b23';
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
    for (let x = 6; x < w - 4; x += 5) {
      const len = (h / 2 - 4) * Math.sin((x / w) * Math.PI * 0.95 + 0.1);
      g.strokeStyle = x % 10 ? '#4f8a2c' : '#5f9a36';
      g.lineWidth = 3;
      for (const s of [-1, 1]) {
        g.beginPath(); g.moveTo(x, h / 2); g.lineTo(x + 12, h / 2 + s * len); g.stroke();
      }
    }
  }, { height: 96 });
  frondTex.wrapS = frondTex.wrapT = THREE.ClampToEdgeWrapping;
  const frondMat = new THREE.MeshStandardMaterial({ map: frondTex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.8 });
  const frond = sculpt(new THREE.PlaneGeometry(3.2, 1.2, 12, 2).translate(1.6, 0, 0).rotateX(-Math.PI / 2), (p) => { p.y -= 0.12 * p.x * p.x; });
  const TOP = v(0.6, 7.5, 0);
  const fronds = merge(Array.from({ length: 9 }, (_, i) =>
    [frond, compose(TOP, new THREE.Euler(0, (i / 9) * Math.PI * 2, 0.2 + (i % 3) * 0.12, 'YZX'))]));
  const trunk = taperedTube([v(0, 0, 0), v(0.1, 2.5, 0), v(0.35, 5, 0), v(0.6, 7.6, 0)], (t) => 0.28 - 0.12 * t, 16, 8);
  const barkTex = canvasTexture(64, (g, w, h) => {
    g.fillStyle = '#8a6a48'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 8) { g.fillStyle = '#6e5236'; g.fillRect(0, y, w, 3); }
  }, { repeat: [3, 10] });
  return { trunk, fronds, frondMat, barkMat: new THREE.MeshStandardMaterial({ map: barkTex, roughness: 0.9 }) };
}

function buildSeaside(rng, theme) {
  const shoreZ = T.bounds.z1 + 60;
  if (worldMode === 'open') oceanZ = shoreZ + 46;
  spotFilter = (x, z) => z < shoreZ + 25;
  const palm = palmGeometries();
  const palms = findSpots(rng, 260, T.B + 5, 120).map((p) => {
    const sc = 0.8 + rng() * 0.5;
    addObstacle(p.x, p.z, 0.45 * sc);
    return compose(p, new THREE.Euler(0, rng() * Math.PI * 2, 0), sc);
  });
  instancedIn(world, palm.trunk, palm.barkMat, palms);
  instancedIn(world, palm.fronds, palm.frondMat, palms);

  // 大海在北边（z 大的一侧），前面一条沙滩
  const sand = mesh(new THREE.PlaneGeometry(7000, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: noiseTexture(128, '#e8d6a8', [['#d8c290', 0.8], ['#f6ead0', 0.6]], [600, 8]), roughness: 1 }), false);
  sand.position.set(T.bounds.cx, 0.01, shoreZ + 20);
  const sea = mesh(new THREE.PlaneGeometry(7000, 3000).rotateX(-Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0x1b6f95, roughness: 0.08, metalness: 0.1, clearcoat: 1 }), false);
  sea.position.set(T.bounds.cx, 0.05, shoreZ + 50 + 1500);
  const foam = mesh(new THREE.PlaneGeometry(7000, 4).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }), false);
  foam.position.set(T.bounds.cx, 0.07, shoreZ + 50);
  world.add(sand, sea, foam);
  world.userData.foam = foam;

  // 沙滩上的遮阳伞
  const umbrellas = [], uColors = [];
  for (let i = 0; i < 70; i++) {
    const p = v(T.bounds.cx + (rng() - 0.5) * 900, 0, shoreZ + 5 + rng() * 38);
    umbrellas.push(compose(p, new THREE.Euler(rng() * 0.2, rng() * 6, 0)));
    uColors.push(new THREE.Color().setHSL(rng(), 0.75, 0.55));
  }
  instancedIn(world, new THREE.ConeGeometry(1.4, 0.5, 12, 1, true).translate(0, 2.3, 0), new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.8 }), umbrellas, uColors);
  instancedIn(world, new THREE.CylinderGeometry(0.03, 0.03, 2.4).translate(0, 1.2, 0), PM.metal, umbrellas);

  // 小房子和岩石
  spotFilter = (x, z) => z < shoreZ - 15;
  const houses = findSpots(rng, 40, 40, 220).map((p) => {
    const sx = 6 + rng() * 5, sy = 4 + rng() * 3, sz = 6 + rng() * 5;
    addObstacle(p.x, p.z, Math.min(sx, sz) * 0.55);
    return compose(p.setY(0), new THREE.Euler(0, rng() * 6, 0), v(sx, sy, sz));
  });
  const hColors = houses.map(() => new THREE.Color(pick([0xf4efe6, 0xf6d7a7, 0xcfe6ef, 0xf3c6c1])));
  instancedIn(world, new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), mat(0xffffff, { roughness: 0.9 }), houses, hColors);
  instancedIn(world, new THREE.ConeGeometry(0.8, 0.5, 4).rotateY(Math.PI / 4).translate(0, 1.25, 0), mat(0xc4553a, { roughness: 0.8 }), houses);
  rocks(rng, 60, 0x8a837b);
}

function rocks(rng, count, color, minD = T.B + 3, maxD = 90) {
  const list = findSpots(rng, count, minD, maxD).map((p) => {
    const sx = 0.6 + rng() * 1.8, sy = 0.5 + rng() * 1.2, sz = 0.6 + rng() * 1.8;
    addObstacle(p.x, p.z, Math.max(sx, sz) * 0.7);
    return compose(p, new THREE.Euler(rng() * 3, rng() * 3, rng() * 3), v(sx, sy, sz));
  });
  instancedIn(world, new THREE.DodecahedronGeometry(1, 0), mat(color, { roughness: 0.95, flatShading: true }), list);
}

// ---------------- 红岩峡谷：台地、仙人掌 ----------------
function buildCanyon(rng) {
  const mesaGeo = sculpt(new THREE.CylinderGeometry(1, 1.25, 1, 11, 6).translate(0, 0.5, 0), (p) => {
    const a = Math.atan2(p.z, p.x);
    const r = 1 + 0.12 * Math.sin(a * 3 + p.y * 4) + 0.08 * Math.sin(a * 7);
    if (p.y > 0.01 && p.y < 0.99) { p.x *= r; p.z *= r; }
  });
  const colors = [];
  const pos = mesaGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const band = Math.floor(y * 6) % 2;
    colors.push(...new THREE.Color(band ? 0xb5532e : 0xcf7440).lerp(new THREE.Color(0xe0a070), y * 0.4).toArray());
  }
  mesaGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const mesaMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 });
  const near = [], far = [];
  for (const p of findSpots(rng, 40, 45, 200)) {
    const r = 10 + rng() * 25, rz = r * (0.7 + rng() * 0.6), h = 15 + rng() * 45, rot = rng() * 6;
    if (!bigFilter(p.x, p.z, Math.max(r, rz) * 1.3)) continue;
    near.push(compose(p, new THREE.Euler(0, rot, 0), v(r, h, rz)));
    addObstacle(p.x, p.z, Math.min(r, rz) * 1.15);
  }
  for (const p of findSpots(rng, 45, 280, 900, 900)) {
    const r = 40 + rng() * 90, h = 60 + rng() * 120, rot = rng() * 6;
    if (!bigFilter(p.x, p.z, r * 1.3)) continue;
    far.push(compose(p, new THREE.Euler(0, rot, 0), v(r, h, r)));
    addObstacle(p.x, p.z, r * 1.15);
  }
  instancedIn(world, mesaGeo, mesaMat, [...near, ...far]);

  const cyl = (r, h) => new THREE.CylinderGeometry(r, r, h, 8);
  const cactus = merge([
    [cyl(0.28, 4), compose(v(0, 2, 0))], [new THREE.SphereGeometry(0.28, 8, 6), compose(v(0, 4, 0))],
    [cyl(0.18, 1), compose(v(0.55, 1.6, 0), new THREE.Euler(0, 0, Math.PI / 2))], [cyl(0.18, 1.4), compose(v(1.0, 2.3, 0))],
    [cyl(0.16, 0.8), compose(v(-0.45, 2.3, 0), new THREE.Euler(0, 0, Math.PI / 2))], [cyl(0.16, 1.1), compose(v(-0.8, 2.9, 0))],
  ]);
  const cacti = findSpots(rng, 160, T.B + 4, 120).map((p) => {
    const sc = 0.7 + rng() * 0.6;
    addObstacle(p.x, p.z, 0.45 * sc);
    return compose(p, new THREE.Euler(0, rng() * 6, 0), sc);
  });
  instancedIn(world, cactus, mat(0x4f7a3a, { roughness: 0.8, flatShading: true }), cacti);
  const bushes = findSpots(rng, 200, T.B + 3, 150).map((p) => compose(p, new THREE.Euler(0, rng() * 6, 0), 0.5 + rng() * 0.8));
  instancedIn(world, new THREE.IcosahedronGeometry(1, 0).scale(1, 0.6, 1), mat(0x8a7a42, { roughness: 1, flatShading: true }), bushes);
  rocks(rng, 90, 0xa0583a);
}

// ---------------- 雪山松林：松树、远山、飘雪 ----------------
function buildSnow(rng) {
  const cones = [], caps = [];
  for (let i = 0; i < 4; i++) {
    const y = 1.6 + i * 1.5, r = 2.4 - i * 0.5;
    cones.push([new THREE.ConeGeometry(r, 2.6, 9), compose(v(0, y, 0))]);
    caps.push([new THREE.ConeGeometry(r * 0.75, 1.3, 9), compose(v(0, y + 0.75, 0))]);
  }
  const trees = findSpots(rng, 420, T.B + 5, 160).map((p) => {
    const sc = 0.8 + rng() * 0.7;
    addObstacle(p.x, p.z, 1.1 * sc);
    return compose(p, new THREE.Euler(0, rng() * 6, 0), sc);
  });
  instancedIn(world, merge(cones), mat(0x1f4a33, { roughness: 0.9, flatShading: true }), trees);
  instancedIn(world, merge(caps), mat(0xf4f8fc, { roughness: 0.8, flatShading: true }), trees);
  instancedIn(world, new THREE.CylinderGeometry(0.25, 0.3, 1.2, 6).translate(0, 0.6, 0), mat(0x5a3b25), trees);

  // 远处的雪山
  const mountain = sculpt(new THREE.ConeGeometry(1, 1, 10, 6).translate(0, 0.5, 0), (p) => {
    const n = Math.sin(p.x * 7) * Math.cos(p.z * 6) * 0.06;
    p.x += n; p.z += n * 0.7;
  });
  const mColors = [];
  const mp = mountain.attributes.position;
  for (let i = 0; i < mp.count; i++) {
    const y = mp.getY(i);
    mColors.push(...(y > 0.55 ? new THREE.Color(0xf6f9fc) : new THREE.Color(0x6d7f93).lerp(new THREE.Color(0xa9b8c8), y)).toArray());
  }
  mountain.setAttribute('color', new THREE.Float32BufferAttribute(mColors, 3));
  const ring = [];
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2 + rng() * 0.2;
    const d = 800 + rng() * 500;
    const r = 180 + rng() * 200, h = 160 + rng() * 220, rot = rng() * 6;
    const mx = T.bounds.cx + Math.cos(a) * d, mz = T.bounds.cz + Math.sin(a) * d;
    if (!bigFilter(mx, mz, r)) continue;   // 开放世界里雪山不能挡住公路、也不能压到别的地图
    ring.push(compose(v(mx, -5, mz), new THREE.Euler(0, rot, 0), v(r, h, r)));
    addObstacle(mx, mz, r * 0.92);
  }
  instancedIn(world, mountain, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 }), ring, null, false);
  const mounds = findSpots(rng, 120, T.B + 2, 60).map((p) => compose(p, new THREE.Euler(), v(2 + rng() * 3, 0.6 + rng(), 2 + rng() * 3)));
  instancedIn(world, new THREE.SphereGeometry(1, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffffff, { roughness: 0.9 }), mounds);
  rocks(rng, 40, 0x6b6f76);

  // 飘雪：围绕相机的一团粒子，循环下落
  const count = MOBILE_GPU ? 1500 : 3500;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = rand(-60, 60);
    positions[i * 3 + 1] = rand(0, 40);
    positions[i * 3 + 2] = rand(-60, 60);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const flake = canvasTexture(32, (g, w) => {
    const grad = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, w, w);
  });
  snowfall = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.35, map: flake, transparent: true, depthWrite: false, opacity: 0.9 }));
  snowfall.frustumCulled = false;
  world.add(snowfall);
}

// ---------------- 霓虹夜城：高楼、路灯、星空 ----------------
function buildNight(rng) {
  const windows = canvasTexture(128, (g, w, h) => {
    g.fillStyle = '#141a28'; g.fillRect(0, 0, w, h);
    const cols = 8, rows = 16;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const lit = Math.random() < 0.45;
      g.fillStyle = lit ? pick(['#ffd98a', '#fff1c4', '#9fd8ff', '#ffc070']) : '#1f2638';
      g.fillRect(c * (w / cols) + 3, r * (h / rows) + 3, w / cols - 6, h / rows - 6);
    }
  }, { height: 256 });
  const bMat = new THREE.MeshStandardMaterial({ map: windows, emissiveMap: windows, emissive: 0xffffff, emissiveIntensity: 0.9, roughness: 0.7 });
  const bGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  // 楼顶不要窗户：把顶面 UV 挤到一个暗色像素上
  const uv = bGeo.attributes.uv;
  for (let i = 8; i < 12; i++) uv.setXY(i, 0.01, 0.99);
  const blocks = [], far = [];
  for (const p of findSpots(rng, 230, T.B + 10, 320)) {
    const w = 14 + rng() * 22, rot = Math.round(rng() * 4) * (Math.PI / 2) + (rng() - 0.5) * 0.1, h = 18 + rng() * 90, dd = 14 + rng() * 22;
    if (!bigFilter(p.x, p.z, Math.max(w, dd) * 0.72)) continue;
    blocks.push(compose(p, new THREE.Euler(0, rot, 0), v(w, h, dd)));
    addObstacle(p.x, p.z, (w + dd) / 4);
  }
  instancedIn(world, bGeo, bMat, blocks);
  for (const p of findSpots(rng, 120, 350, 1000, 800)) {
    const rot = rng() * 3, w = 30 + rng() * 40, h = 60 + rng() * 200, dd = 30 + rng() * 40;
    if (!bigFilter(p.x, p.z, Math.max(w, dd) * 0.72)) continue;
    far.push(compose(p, new THREE.Euler(0, rot, 0), v(w, h, dd)));
    addObstacle(p.x, p.z, (w + dd) / 4);
  }
  instancedIn(world, bGeo, bMat, far, null, false);

  // 霓虹招牌
  const neon = [], neonColors = [];
  for (let i = 0; i < 70; i++) {
    const p = findSpots(rng, 1, T.B + 3, T.B + 12)[0];
    if (!p) continue;
    neon.push(compose(p.setY(4 + rng() * 10), new THREE.Euler(0, rng() * 6, 0), v(4 + rng() * 6, 0.8 + rng() * 1.5, 0.2)));
    neonColors.push(new THREE.Color(pick([0xff2bd6, 0x22e6ff, 0xffe135, 0x7cff5a, 0xff5a3c])));
  }
  instancedIn(world, new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), neon, neonColors, false);

  // 路灯：沿赛道交替摆放，路面上画出暖色的光斑
  const poles = [], heads = [], pools = [];
  const step = Math.round(45 / T.ds);
  for (let i = 0, n = 0; i < T.N; i += step, n++) {
    const side = n % 2 ? 1 : -1;
    const x = T.px[i] + T.nx[i] * side * (T.B + 1.2), z = T.pz[i] + T.nz[i] * side * (T.B + 1.2);
    const face = T.heading[i] + (side > 0 ? -Math.PI / 2 : Math.PI / 2);
    if (worldMode === 'open' && !roadClear(x, z, 0.5)) continue;   // 别让路灯杆挡在连接公路上
    addObstacle(x, z, 0.3);
    poles.push(compose(v(x, 0, z), new THREE.Euler(0, face, 0)));
    heads.push(compose(v(x, 0, z), new THREE.Euler(0, face, 0)));
    const px = T.px[i] + T.nx[i] * side * (T.W * 0.35), pz = T.pz[i] + T.nz[i] * side * (T.W * 0.35);
    pools.push(compose(v(px, 0.05, pz)));
  }
  const pole = merge([
    [new THREE.CylinderGeometry(0.12, 0.16, 9, 8), compose(v(0, 4.5, 0))],
    [new THREE.BoxGeometry(0.12, 0.12, 5), compose(v(0, 9, 2.5))],
  ]);
  instancedIn(world, pole, mat(0x3a3e46, { metalness: 0.6, roughness: 0.4 }), poles);
  instancedIn(world, new THREE.BoxGeometry(0.6, 0.18, 1.2).translate(0, 8.9, 4.8), new THREE.MeshBasicMaterial({ color: 0xffe2a8 }), heads, null, false);
  const poolTex = canvasTexture(128, (g, w) => {
    const grad = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    grad.addColorStop(0, 'rgba(255,214,150,0.55)'); grad.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = grad; g.fillRect(0, 0, w, w);
  });
  lampPools = instancedIn(world, new THREE.PlaneGeometry(22, 22).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), pools, null, false);

  // 星空
  const starPos = [];
  for (let i = 0; i < 1500; i++) {
    const a = rng() * Math.PI * 2, e = Math.asin(0.08 + rng() * 0.92);
    starPos.push(Math.cos(a) * Math.cos(e) * 1800, Math.sin(e) * 1800, Math.sin(a) * Math.cos(e) * 1800);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, fog: false, transparent: true }));
  world.userData.stars = stars;
  world.add(stars);
  const moon = new THREE.Mesh(new THREE.SphereGeometry(40, 24, 16), new THREE.MeshBasicMaterial({ color: 0xf4f1e0, fog: false, transparent: true }));
  moon.position.copy(MOON_DIR).multiplyScalar(1600);
  world.userData.moon = moon;
  world.add(moon);
}

// ---------------- 落日公路：松林、灰色山崖、广告牌、钠灯路灯、远山剪影 ----------------
function buildSunset(rng) {
  // 松树（深绿色，没有积雪）
  const cones = [];
  for (let i = 0; i < 4; i++) cones.push([new THREE.ConeGeometry(2.4 - i * 0.5, 2.8, 8), compose(v(0, 1.8 + i * 1.6, 0))]);
  const trees = findSpots(rng, 380, T.B + 5, 170).map((p) => {
    const sc = 0.8 + rng() * 0.8;
    addObstacle(p.x, p.z, 1.1 * sc);
    return compose(p, new THREE.Euler(0, rng() * 6, 0), sc);
  });
  instancedIn(world, merge(cones), mat(0x2c4a2a, { roughness: 0.9, flatShading: true }), trees);
  instancedIn(world, new THREE.CylinderGeometry(0.25, 0.32, 1.4, 6).translate(0, 0.7, 0), mat(0x4a3322), trees);

  // 灰色山崖（台地的几何体换成灰色层理）
  const cliffGeo = sculpt(new THREE.CylinderGeometry(1, 1.3, 1, 10, 6).translate(0, 0.5, 0), (p) => {
    const a = Math.atan2(p.z, p.x);
    const r = 1 + 0.14 * Math.sin(a * 4 + p.y * 5) + 0.07 * Math.sin(a * 9);
    if (p.y > 0.01 && p.y < 0.99) { p.x *= r; p.z *= r; }
  });
  const cc = [];
  const cp = cliffGeo.attributes.position;
  for (let i = 0; i < cp.count; i++) {
    const y = cp.getY(i);
    cc.push(...new THREE.Color(Math.floor(y * 7) % 2 ? 0x8a8378 : 0x9d968a).lerp(new THREE.Color(0x6d6a64), y * 0.5).toArray());
  }
  cliffGeo.setAttribute('color', new THREE.Float32BufferAttribute(cc, 3));
  const cliffs = [];
  for (const p of findSpots(rng, 30, 60, 260)) {
    const r = 18 + rng() * 30, h = 20 + rng() * 55, rot = rng() * 6;
    if (!bigFilter(p.x, p.z, r * 1.35)) continue;
    cliffs.push(compose(p, new THREE.Euler(0, rot, 0), v(r, h, r * (0.7 + rng() * 0.5))));
    addObstacle(p.x, p.z, r * 1.1);
  }
  instancedIn(world, cliffGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }), cliffs);

  // 远山剪影（紫灰色，低矮连绵的山丘，而不是尖锥）
  const hill = sculpt(new THREE.ConeGeometry(1, 1, 14, 6).translate(0, 0.5, 0), (p) => {
    const n = Math.sin(p.x * 6 + 1.3) * Math.cos(p.z * 5) * 0.08 + Math.sin(p.x * 13) * 0.03;
    p.x += n; p.z += n * 0.8;
    p.y = Math.pow(p.y, 1.35) + n * 0.3;   // 山顶圆钝一些
  });
  const ridge = [];
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2 + rng() * 0.2, d = 950 + rng() * 450, r = 240 + rng() * 200, h = 70 + rng() * 90, rot = rng() * 6;
    const mx = T.bounds.cx + Math.cos(a) * d, mz = T.bounds.cz + Math.sin(a) * d;
    if (!bigFilter(mx, mz, r)) continue;
    ridge.push(compose(v(mx, -5, mz), new THREE.Euler(0, rot, 0), v(r, h, r)));
    addObstacle(mx, mz, r * 0.9);
  }
  instancedIn(world, hill, mat(0x5e5068, { roughness: 1, flatShading: true }), ridge, null, false);

  // 广告牌：立在直道外侧
  const ads = [['鹈鹕快递', '#d8452a'], ['极速加油站', '#1d6f8f'], ['PELICAN COLA', '#b3122e'], ['落日汽车旅馆', '#7b2cbf'], ['警察提示：限速 120', '#1f3a8a']];
  for (let k = 0; k < 10; k++) {
    const i = Math.floor((k + 0.5) * T.N / 10);
    if (Math.abs(T.k[i]) > 1 / 300) continue;
    const side = k % 2 ? 1 : -1;
    const x = T.px[i] + T.nx[i] * side * (T.B + 6), z = T.pz[i] + T.nz[i] * side * (T.B + 6);
    if (worldMode === 'open' && !roadClear(x, z, 4)) continue;
    const [text, color] = ads[k % ads.length];
    const tex = canvasTexture(512, (g, w, h) => {
      g.fillStyle = color; g.fillRect(0, 0, w, h);
      g.fillStyle = '#ffffff'; g.font = 'bold 72px "PingFang SC", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, w / 2, h / 2);
    }, { height: 200 });
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    const board = new THREE.Group();
    board.add(mesh(new THREE.BoxGeometry(9, 3.5, 0.2), [PM.darkMetal, PM.darkMetal, PM.darkMetal, PM.darkMetal, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }), PM.darkMetal]).translateY(5));
    for (const s of [-1, 1]) board.add(cyl(0.15, 0.15, 3.5, PM.steel, s * 3, 1.75, 0));
    board.position.set(x, 0, z);
    board.rotation.y = T.heading[i] - side * Math.PI / 2;   // 面朝赛道
    world.add(board);
    addObstacle(x, z, 3.5);
  }

  // 钠灯路灯（单侧，每 60 米一盏）
  const poles = [], heads = [];
  const step = Math.round(60 / T.ds);
  for (let i = 0; i < T.N; i += step) {
    const x = T.px[i] + T.nx[i] * (T.B + 1.2), z = T.pz[i] + T.nz[i] * (T.B + 1.2);
    if (worldMode === 'open' && !roadClear(x, z, 0.5)) continue;
    addObstacle(x, z, 0.3);
    const m = compose(v(x, 0, z), new THREE.Euler(0, T.heading[i] - Math.PI / 2, 0));
    poles.push(m);
    heads.push(m);
  }
  instancedIn(world, merge([
    [new THREE.CylinderGeometry(0.12, 0.16, 10, 8), compose(v(0, 5, 0))],
    [new THREE.BoxGeometry(0.12, 0.12, 4), compose(v(0, 10, 2))],
  ]), mat(0x3a3e46, { metalness: 0.6, roughness: 0.4 }), poles);
  instancedIn(world, new THREE.BoxGeometry(0.5, 0.16, 1.0).translate(0, 9.9, 3.8), new THREE.MeshBasicMaterial({ color: 0xffb35c }), heads, null, false);
  rocks(rng, 50, 0x7d766c);
}

// ---------------- 看台上的鹈鹕观众（低面数，所有看台共用一份几何体） ----------------
const SPECTATOR_MAT = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8 });
const SPECTATOR_GEAR_MAT = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
SPECTATOR_MAT.userData.shared = SPECTATOR_GEAR_MAT.userData.shared = true;
let spectatorGeo = null;
function spectatorGeometry() {
  if (spectatorGeo) return spectatorGeo;
  const tint = (geo, hex) => {
    const g = geo.index ? geo.toNonIndexed() : geo;

  const sph = (hex, x, y, z, sx, sy, sz, seg = 10) => [tint(new THREE.SphereGeometry(1, seg, Math.max(6, seg - 3)), hex), compose(v(x, y, z), new THREE.Euler(), v(sx, sy, sz))];

    [tint(new THREE.CylinderGeometry(0.045, 0.06, 0.36, 8), WHITE), compose(v(0, 0.6, 0.03), new THREE.Euler(0.12, 0, 0))],   // 脖子
    sph(WHITE, 0, 0.8, 0.07, 0.085, 0.08, 0.1),                                         // 头
    sph(0x111111, 0.055, 0.82, 0.12, 0.016, 0.016, 0.016, 6), sph(0x111111, -0.055, 0.82, 0.12, 0.016, 0.016, 0.016, 6),   // 眼睛
    [tint(new THREE.ConeGeometry(0.035, 0.32, 8), 0xe8a090), compose(v(0, 0.78, 0.3), new THREE.Euler(Math.PI / 2 + 0.25, 0, 0))],   // 长喙
    sph(0xf5b73c, 0, 0.73, 0.24, 0.04, 0.05, 0.12, 8),                                  // 喉囊
  ]);
  const cap = tint(new THREE.SphereGeometry(1, 10, 5, 0, Math.PI * 2, 0, Math.PI / 2), 0xffffff);

// 跳台：黄黑斜纹的楔形坡，顶面是 h = H·u^1.5 的曲面，末端是竖直台口；两侧立一对黄色标志柱
const rampTex = canvasTexture(128, (g, w, h) => {
  g.fillStyle = '#f2c230'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1b1b1b';
  for (let k = -2; k < 6; k++) {
    g.beginPath();
    g.moveTo(0, k * 32); g.lineTo(w / 2, k * 32 + 32); g.lineTo(w, k * 32);
    g.lineTo(w, k * 32 + 14); g.lineTo(w / 2, k * 32 + 46); g.lineTo(0, k * 32 + 14);
    g.fill();
  }
}, { height: 128 });
rampTex.userData.shared = true;
function buildRamps() {
  const n = 12;
  for (const r of T.ramps) {
    // 顶面两条边、底边（路面高度）的采样点：[x, 顶面 y, z, 底面 y]
    const edge = (lat) => {
      const out = [];
      for (let j = 0; j <= n; j++) {
        const u = j / n, p = trackPoint(T, r.s0 + u * r.len, lat);
        const floor = bankHeight(T, p.i, lat) + 0.03;
        out.push([p.x, floor + r.H * u ** 1.5 + 0.005, p.z, floor]);
      }
      return out;
    };
    const L = edge(r.lat - r.hw), R = edge(r.lat + r.hw);
    const pos = [], uv = [], idx = [];
    for (let j = 0; j <= n; j++) {
      pos.push(L[j][0], L[j][1], L[j][2], R[j][0], R[j][1], R[j][2]);
      uv.push(0, (j / n) * 2.2, 1, (j / n) * 2.2);
    }
    for (let j = 0; j < n; j++) { const a = j * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const top = new THREE.BufferGeometry();
    top.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    top.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    top.setIndex(idx);
    top.computeVertexNormals();
    world.add(mesh(top, new THREE.MeshStandardMaterial({ map: rampTex, roughness: 0.6, side: THREE.DoubleSide }), false));
    // 两个侧面 + 末端台口
    const side = [], sIdx = [];
    const wall = (pts) => {
      const o = side.length / 3;
      for (const [x, y, z, f] of pts) side.push(x, y, z, x, f, z);
      for (let j = 0; j < pts.length - 1; j++) { const a = o + j * 2; sIdx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    };
    wall(L); wall(R); wall([L[n], R[n]]);
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.Float32BufferAttribute(side, 3));
    sg.setIndex(sIdx);
    sg.computeVertexNormals();
    world.add(mesh(sg, mat(0x3a3d42, { roughness: 0.7, side: THREE.DoubleSide })));
    // 跳台前两侧的黄色标志柱
    for (const c of [-1, 1]) {
      const lat = r.lat + c * (r.hw + 0.5), p = trackPoint(T, r.s0 - 3, lat);
      world.add(cyl(0.1, 0.1, 1.2, mat(0xf2c230, { emissive: 0x332200 }), p.x, 0.6 + bankHeight(T, p.i, lat), p.z));
    }
  }
}

// =====================================================================
// 沥青路面：颜色贴图（明暗斑块、大小不一的石子、行车线磨损、清晰的标线）+ 细颗粒凹凸贴图（1.5 米一个循环）
// width 为路面总宽（米），len 为贴图沿路方向的周期（米）
// center：'dash' 白色中间虚线，'yellow' 双黄线
// =====================================================================
const asphaltDetail = canvasTexture(256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < w * h * 0.5; i++) {
    const r = Math.random();
    g.fillStyle = r < 0.45 ? `rgba(0,0,0,${0.15 + Math.random() * 0.35})` : `rgba(255,255,255,${0.1 + Math.random() * 0.35})`;
    const sz = r > 0.97 ? 2.5 : 1 + Math.random();
    g.fillRect(Math.random() * w, Math.random() * h, sz, sz);
  }
}, { srgb: false });
asphaltDetail.userData.shared = true;

function asphaltMaterial(base, width, len, { center = 'dash', extra = {} } = {}) {
  const map = canvasTexture(512, (g, w, h) => {
    const mpx = w / width;   // 每米像素数（横向）
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    // 大块的明暗斑块（修补、油渍、新旧沥青）
    for (let i = 0; i < 26; i++) {
      const x = Math.random() * w, y = Math.random() * h, r = 20 + Math.random() * 70;
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, Math.random() < 0.5 ? 'rgba(0,0,0,0.07)' : 'rgba(255,255,255,0.05)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // 石子：大多数很细，少量亮一点的大颗粒
    for (let i = 0; i < w * h * 0.22; i++) {
      const r = Math.random();
      g.fillStyle = r < 0.5 ? `rgba(0,0,0,${0.12 + Math.random() * 0.2})` : r < 0.97 ? `rgba(255,255,255,${0.05 + Math.random() * 0.12})` : 'rgba(210,205,195,0.35)';
      const sz = r < 0.97 ? 1 : 2;
      g.fillRect(Math.random() * w, Math.random() * h, sz, sz);
    }
    // 行车线：两条颜色深一点、边缘柔和的磨损带
    for (const cx of [0.28, 0.72]) {
      const grad = g.createLinearGradient((cx - 0.09) * w, 0, (cx + 0.09) * w, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(0.5, 'rgba(0,0,0,0.13)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect((cx - 0.09) * w, 0, 0.18 * w, h);
    }
    // 标线：边线 15 厘米、离路边 30 厘米；中间虚线 3 米线 + 空 3 米（贴图周期里按比例画）
    const line = (x0, x1, y0, y1, color) => {
      g.fillStyle = color; g.fillRect(x0, y0, x1 - x0, y1 - y0);
      g.fillStyle = 'rgba(0,0,0,0.12)';   // 少许磨损
      for (let i = 0; i < (x1 - x0) * (y1 - y0) * 0.04; i++) g.fillRect(x0 + Math.random() * (x1 - x0), y0 + Math.random() * (y1 - y0), 1.5, 1.5);
    };
    const e0 = 0.3 * mpx, e1 = e0 + 0.15 * mpx;
    line(e0, e1, 0, h, '#ececec');
    line(w - e1, w - e0, 0, h, '#ececec');
    if (center === 'yellow') {
      for (const dx of [-0.16, 0.06]) line(w / 2 + dx * mpx, w / 2 + (dx + 0.1) * mpx, 0, h, '#e8b923');
    } else {
      const dashes = Math.max(1, Math.round(len / 6));
      for (let k = 0; k < dashes; k++) line(w / 2 - 0.07 * mpx, w / 2 + 0.07 * mpx, (k / dashes) * h, ((k + 0.5) / dashes) * h, '#ececec');
    }
  }, { height: 1024 });
  const bump = asphaltDetail.clone();
  bump.userData.shared = false;
  bump.repeat.set(width / 1.5, len / 1.5);
  return new THREE.MeshStandardMaterial({ map, bumpMap: bump, bumpScale: 1.2, roughness: 0.88, ...extra });
}

/* ===== js/world/open-world.js ===== */
// 自由驾驶的开放世界：四张地图 + 连接公路、道路/障碍物网格、天空混合、碰撞、就近回到路面
'use strict';

// =====================================================================
// 自由驾驶的开放世界：四张地图摆在同一块大陆上，四条公路把它们首尾相连
// 没有护栏、不管逆行，除了高山、台地、楼房、树木、大海这些物理上过不去的地方，哪里都能开
// 天空和光照按离各区域的远近平滑过渡（开往霓虹夜城时天色渐渐暗下来）
// =====================================================================
const REGION_POS = { seaside: [0, 0], canyon: [1400, -720], night: [0, -1500], snow: [-1400, -720], sunset: [1500, -2250] };
const LINKS = [['seaside', 'canyon'], ['canyon', 'night'], ['night', 'snow'], ['snow', 'seaside'], ['canyon', 'sunset'], ['sunset', 'night']];
const WORLD_CENTER = [0, -720];
const WORLD_RADIUS = 3250;
let worldMode = 'single';      // single：名次赛的一条赛道；open：自由驾驶的开放世界
let regionTracks = {};         // 开放世界里各地图的赛道数据（已平移到世界坐标）
let links = [];                // 连接公路
let roadGrid = null;           // 所有道路采样点的空间网格
let obstacles = null;          // 障碍物（圆形近似）的空间网格
let regionFilter = null;       // 开放世界里布景只能摆在自己区域、且不能挡住公路
let buildingRegion = null;     // 正在布置的区域
let oceanZ = Infinity;         // 海岸线（不能开进海里）
let crowds = [];               // 各看台的观众

class SpatialGrid {
  constructor(cell) { this.cell = cell; this.map = new Map(); this.stamp = 0; }
  key(ix, iz) { return ix * 100003 + iz; }
  cells(x, z, r, fn) {
    const c = this.cell;
    for (let ix = Math.floor((x - r) / c); ix <= Math.floor((x + r) / c); ix++) {
      for (let iz = Math.floor((z - r) / c); iz <= Math.floor((z + r) / c); iz++) {
        const list = fn === null ? null : this.map.get(this.key(ix, iz));
        fn(list, ix, iz);
      }
    }
  }
  insert(x, z, r, item) {
    this.cells(x, z, r, (_, ix, iz) => {
      const k = this.key(ix, iz);
      let list = this.map.get(k);
      if (!list) this.map.set(k, (list = []));
      list.push(item);
    });
  }
  // 同一个大物体可能占好几个格子，用 stamp 去重
  query(x, z, r, fn) {
    const stamp = ++this.stamp;
    this.cells(x, z, r, (list) => {
      if (!list) return;
      for (const it of list) if (it.q !== stamp) { it.q = stamp; fn(it); }
    });
  }
}

function addObstacle(x, z, r) {
  if (obstacles && r > 0.05) obstacles.insert(x, z, r, { x, z, r, q: 0 });
}

// 最近的道路采样点（赛道或连接公路）
function nearestRoad(x, z, maxR = 40) {
  if (!roadGrid) return null;
  let best = null, bestD = maxR * maxR;
  roadGrid.cells(x, z, maxR, (list) => {
    if (!list) return;
    for (const it of list) {
      const d = (x - it.r.px[it.i]) ** 2 + (z - it.r.pz[it.i]) ** 2;
      if (d < bestD) { bestD = d; best = it; }
    }
  });
  return best ? { road: best.r, i: best.i, d: Math.sqrt(bestD) } : null;
}
// 半径 r 的物体放在 (x, z) 会不会压到任何一条路
function roadClear(x, z, r) {
  if (!roadGrid) return true;
  const q = nearestRoad(x, z, r + 16);
  return !q || q.d > q.road.W + r + 4;
}
function nearestRegion(x, z) {
  let best = null, bestD = Infinity;
  for (const [id, [rx, rz]] of Object.entries(REGION_POS)) {
    const d = (x - rx) ** 2 + (z - rz) ** 2;
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}
// 大物体（台地、楼、雪山）的摆放检查：单赛道模式不限制；开放世界要在自己区域里且不挡路
function bigFilter(x, z, r) {
  return worldMode !== 'open' || (nearestRegion(x, z) === buildingRegion && roadClear(x, z, r));
}

// 各区域的权重（离区域中心越近越大，归一化）
function regionWeights(x, z, core = 480, soft = 320) {
  const w = {};
  let sum = 0;
  for (const [id, [rx, rz]] of Object.entries(REGION_POS)) {
    const d = Math.hypot(x - rx, z - rz);
    const k = 1 / (1 + (Math.max(0, d - core) / soft) ** 4);
    w[id] = k;
    sum += k;
  }
  for (const id in w) w[id] /= sum || 1;
  return w;
}

// 不闭合的路（连接公路）的采样数据，字段和赛道一致
function buildPathData(points, W) {
  const curve = new THREE.CatmullRomCurve3(points.map(([x, z]) => v(x, 0, z)), false, 'centripetal');
  const L = curve.getLength();
  const N = Math.max(3, Math.round(L / 2) + 1);
  const pts = curve.getSpacedPoints(N - 1);
  const R = {
    def: { id: 'link', W }, open: true, N, L, ds: L / (N - 1), W, B: W + 3,
    px: new Float32Array(N), pz: new Float32Array(N), tx: new Float32Array(N), tz: new Float32Array(N),
    nx: new Float32Array(N), nz: new Float32Array(N), k: new Float32Array(N), heading: new Float32Array(N),
  };
  pts.forEach((p, i) => { R.px[i] = p.x; R.pz[i] = p.z; });
  R.wrap = (i) => clamp(i, 0, N - 1);
  for (let i = 0; i < N; i++) {
    const a = R.wrap(i - 1), b = R.wrap(i + 1);
    const dx = R.px[b] - R.px[a], dz = R.pz[b] - R.pz[a], len = Math.hypot(dx, dz) || 1;
    R.tx[i] = dx / len; R.tz[i] = dz / len;
    R.nx[i] = R.tz[i]; R.nz[i] = -R.tx[i];
    R.heading[i] = Math.atan2(R.tx[i], R.tz[i]);
  }
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (let i = 0; i < N; i++) {
    x0 = Math.min(x0, R.px[i]); x1 = Math.max(x1, R.px[i]);
    z0 = Math.min(z0, R.pz[i]); z1 = Math.max(z1, R.pz[i]);
  }
  R.bounds = { x0, x1, z0, z1, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2 };
  return R;
}

// 两个区域之间的公路：从各自赛道朝向对方最外侧的一点出发（避开起点门架和看台），中间画一条缓和的 S 弯
function buildLink(A, B) {
  const dx = B.center.x - A.center.x, dz = B.center.z - A.center.z, dl = Math.hypot(dx, dz);
  const ux = dx / dl, uz = dz / dl;
  const junction = (Tr, sx, sz) => {
    let best = 0, bv = -Infinity;
    for (let i = 0; i < Tr.N; i++) {
      const nearStart = Math.min(i, Tr.N - i) < 45;
      const val = (Tr.px[i] - Tr.center.x) * sx + (Tr.pz[i] - Tr.center.z) * sz - (nearStart ? 1e4 : 0);
      if (val > bv) { bv = val; best = i; }
    }
    return [Tr.px[best], Tr.pz[best]];
  };
  const pa = junction(A, ux, uz), pb = junction(B, -ux, -uz);
  const qa = [pa[0] + ux * 70, pa[1] + uz * 70], qb = [pb[0] - ux * 70, pb[1] - uz * 70];
  const span = Math.hypot(qb[0] - qa[0], qb[1] - qa[1]), nx = -uz, nz = ux;
  const m1 = [lerp(qa[0], qb[0], 0.33) + nx * span * 0.12, lerp(qa[1], qb[1], 0.33) + nz * span * 0.12];
  const m2 = [lerp(qa[0], qb[0], 0.67) - nx * span * 0.1, lerp(qa[1], qb[1], 0.67) - nz * span * 0.1];
  const R = buildPathData([pa, qa, m1, m2, qb, pb], 6.5);
  R.from = A.def;
  R.to = B.def;
  // 接口处赛道的倾角渐变到 0，公路和赛道平顺相接
  flattenBankNear(A, pa[0], pa[1], 80);
  flattenBankNear(B, pb[0], pb[1], 80);
  return R;
}

function resetWorld() {
  if (world) disposeTree(world);
  spotFilter = null;
  regionFilter = null;
  snowfall = null;
  lampPools = null;
  crowds = [];
  regionTracks = {};
  links = [];
  roadGrid = null;
  obstacles = new SpatialGrid(50);
  oceanZ = Infinity;
  world = new THREE.Group();
  world.userData.stands = [];
  scene.add(world);
}

// 路牌：两根柱子 + 一块写着目的地和距离的牌子
function signBoard(text, sub) {
  const g = new THREE.Group();
  const tex = canvasTexture(512, (c, w, h) => {
    c.fillStyle = '#1f6f3f'; c.fillRect(0, 0, w, h);
    c.strokeStyle = '#ffffff'; c.lineWidth = 8; c.strokeRect(10, 10, w - 20, h - 20);
    c.fillStyle = '#ffffff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = 'bold 64px "PingFang SC", sans-serif'; c.fillText(text, w / 2, h * 0.4);
    c.font = '40px "PingFang SC", sans-serif'; c.fillText(sub, w / 2, h * 0.74);
  }, { height: 200 });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  const board = mesh(new THREE.BoxGeometry(4.2, 1.64, 0.1), [PM.darkMetal, PM.darkMetal, PM.darkMetal, PM.darkMetal, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }), PM.darkMetal]);
  board.position.y = 3.2;
  g.add(board);
  for (const s of [-1, 1]) g.add(cyl(0.07, 0.07, 3.2, PM.steel, s * 1.6, 1.6, 0));
  return g;
}

function buildLinkVisuals(R, roadMat, shoulderMat, postGeo, postMat) {
  world.add(mesh(ribbon(R, 0, R.N - 1, -R.W, R.W, 0.028, 24), roadMat, false));
  world.add(mesh(ribbon(R, 0, R.N - 1, R.W, R.W + 2.5, 0.012, 8), shoulderMat, false));
  world.add(mesh(ribbon(R, 0, R.N - 1, -R.W - 2.5, -R.W, 0.012, 8), shoulderMat, false));
  // 路边反光桩
  const posts = [];
  for (let i = 30; i < R.N - 30; i += 12) {
    for (const s of [-1, 1]) posts.push(compose(v(R.px[i] + R.nx[i] * s * (R.W + 3), 0, R.pz[i] + R.nz[i] * s * (R.W + 3)), new THREE.Euler(0, R.heading[i], 0)));
  }
  instancedIn(world, postGeo, postMat, posts);
  // 两头各一块路牌（立在行车方向的右侧，面朝来车）
  const km = `${(R.L / 1000).toFixed(1)} km`;
  for (const [i, dir, dest] of [[18, 1, R.to], [R.N - 19, -1, R.from]]) {
    const side = -dir;   // 行车方向的右侧
    const sign = signBoard(`→ ${dest.name}`, km);
    const x = R.px[i] + R.nx[i] * side * (R.W + 4), z = R.pz[i] + R.nz[i] * side * (R.W + 4);
    sign.position.set(x, 0, z);
    sign.rotation.y = R.heading[i] + (dir > 0 ? Math.PI : 0);
    world.add(sign);
    addObstacle(x, z, 0.4);
  }
}

// 开放世界的地面：一整块地，颜色按区域混合（海滨草地 → 峡谷红土 → 雪地 → 城市）
function buildOpenGround() {
  const geo = new THREE.PlaneGeometry(7600, 7600, 152, 152).rotateX(-Math.PI / 2).translate(WORLD_CENTER[0], 0, WORLD_CENTER[1]);
  const pos = geo.attributes.position, colors = [];
  const cols = Object.fromEntries(TRACKS.map((d) => [d.id, new THREE.Color(THEMES[d.theme].ground[0])]));
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const w = regionWeights(pos.getX(i), pos.getZ(i), 520, 260);
    c.setRGB(0, 0, 0);
    for (const id in w) c.r += cols[id].r * w[id], c.g += cols[id].g * w[id], c.b += cols[id].b * w[id];
    colors.push(c.r * 1.15, c.g * 1.15, c.b * 1.15);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const detail = noiseTexture(256, '#dedede', [['#c4c4c4', 0.8], ['#f4f4f4', 0.6], ['#b0b0b0', 0.4]], [760, 760]);
  world.add(mesh(geo, new THREE.MeshStandardMaterial({ map: detail, vertexColors: true, roughness: 1 }), false));
}

function buildOpenWorld() {
  resetWorld();
  worldMode = 'open';
  // 1. 各地图的赛道挪到自己的区域
  for (const d of TRACKS) {
    const local = buildTrackData(d);
    const [rx, rz] = REGION_POS[d.id];
    const Tr = buildTrackData(d, [rx - local.bounds.cx, rz - local.bounds.cz]);
    Tr.center = v(rx, 0, rz);
    regionTracks[d.id] = Tr;
  }
  // 2. 连接公路 + 道路网格（布景要避开所有道路）
  links = LINKS.map(([a, b]) => buildLink(regionTracks[a], regionTracks[b]));
  roadGrid = new SpatialGrid(32);
  for (const R of [...Object.values(regionTracks), ...links]) {
    for (let i = 0; i < R.N; i++) roadGrid.insert(R.px[i], R.pz[i], 0, { r: R, i });
  }
  // 3. 地面、公路
  buildOpenGround();
  const roadMat = asphaltMaterial('#4b4e53', 13, 24, { center: 'yellow', extra: LAYER(2.5) });
  const shoulderMat = new THREE.MeshStandardMaterial({ map: noiseTexture(128, '#9a9588', [['#85806f', 0.8], ['#b3ad9e', 0.6]], [1, 1], 0.5), roughness: 1, ...LAYER(1.5) });
  const postGeo = merge([
    [new THREE.BoxGeometry(0.14, 1.0, 0.14), compose(v(0, 0.5, 0))],
    [new THREE.BoxGeometry(0.15, 0.12, 0.15), compose(v(0, 0.86, 0))],
  ]);
  const postMat = mat(0xf2f2f2, { roughness: 0.6 });
  for (const R of links) buildLinkVisuals(R, roadMat, shoulderMat, postGeo, postMat);
  // 4. 各区域：路面、起点、布景（没有护栏）
  for (const d of TRACKS) {
    buildingRegion = d.id;
    regionFilter = (x, z) => nearestRegion(x, z) === d.id && roadClear(x, z, 2);
    buildRegion(regionTracks[d.id], THEMES[d.theme], { barriers: false });
  }
  buildingRegion = null;
  regionFilter = null;
  scene.background = null;
  if (!sky.parent) scene.add(sky);
  blend.lastEnv = -99;
}

// ---------------- 按位置混合天空和光照 ----------------
const OPEN_SKY = { night: { elev: -4, azim: 60, turbidity: 2, rayleigh: 1.2, mie: 0.004 } };
const blend = { lastEnv: -99, envW: null, region: null };
const envSceneBlend = new THREE.Scene();
const blendColor = new THREE.Color();
function applyBlendedTheme(x, z, force = false) {
  const w = regionWeights(x, z);
  const acc = { exposure: 0, fogD: 0, sunI: 0, hemiI: 0, elev: 0, azim: 0, turb: 0, ray: 0, mie: 0, env: 0 };
  const fogC = new THREE.Color(0, 0, 0), sunC = new THREE.Color(0, 0, 0), hemiC = new THREE.Color(0, 0, 0), hemiG = new THREE.Color(0, 0, 0);
  for (const d of TRACKS) {
    const th = THEMES[d.theme], k = w[d.id];
    const skyP = OPEN_SKY[d.theme] ?? th.sky;
    acc.exposure += (d.theme === 'night' ? 0.85 : th.exposure) * k;
    acc.fogD += th.fog[1] * k;
    acc.sunI += th.sun[1] * k;
    acc.hemiI += th.hemi[2] * k;
    acc.elev += skyP.elev * k;
    acc.azim += skyP.azim * k;
    acc.turb += (skyP.turbidity ?? 2) * k;
    acc.ray += (skyP.rayleigh ?? 1.5) * k;
    acc.mie += (skyP.mie ?? 0.004) * k;
    acc.env += (d.theme === 'night' ? 0.35 : 1) * k;
    fogC.add(blendColor.set(th.fog[0]).multiplyScalar(k));
    sunC.add(blendColor.set(th.sun[0]).multiplyScalar(k));
    hemiC.add(blendColor.set(th.hemi[0]).multiplyScalar(k));
    hemiG.add(blendColor.set(th.hemi[1]).multiplyScalar(k));
  }
  renderer.toneMappingExposure = acc.exposure;
  scene.fog.color.copy(fogC);
  scene.fog.density = acc.fogD;
  sun.color.copy(sunC);
  sun.intensity = acc.sunI;
  hemi.color.copy(hemiC);
  hemi.groundColor.copy(hemiG);
  hemi.intensity = acc.hemiI;
  scene.environmentIntensity = acc.env;
  SUN_DIR.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - acc.elev), THREE.MathUtils.degToRad(acc.azim));
  LIGHT_DIR.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - Math.max(acc.elev, 24)), THREE.MathUtils.degToRad(acc.azim));
  const u = sky.material.uniforms;
  u.turbidity.value = acc.turb;
  u.rayleigh.value = acc.ray;
  u.mieCoefficient.value = acc.mie;
  u.mieDirectionalG.value = 0.85;
  u.sunPosition.value.copy(SUN_DIR);
  // 夜色、雪花只在对应区域附近出现
  const ud = world.userData;
  if (ud.stars) { ud.stars.material.opacity = w.night; ud.stars.visible = w.night > 0.02; }
  if (ud.moon) { ud.moon.material.opacity = w.night; ud.moon.visible = w.night > 0.02; }
  if (snowfall) { snowfall.material.opacity = 0.9 * w.snow; snowfall.visible = w.snow > 0.03; }
  if (player?.headlight) player.headlight.intensity = 220 * clamp(w.night * 1.3, 0, 1);
  // 环境光照贴图重新生成比较耗时：变化明显时最多 1.5 秒一次
  const changed = !blend.envW || Object.keys(w).reduce((s, id) => s + Math.abs(w[id] - blend.envW[id]), 0) > 0.06;
  if (force || (changed && elapsed - blend.lastEnv > 1.5)) {
    if (envTarget) envTarget.dispose();
    envSceneBlend.add(sky);
    envTarget = pmrem.fromScene(envSceneBlend);
    scene.add(sky);
    scene.environment = envTarget.texture;
    blend.lastEnv = elapsed;
    blend.envW = w;
  }
  // 进入新区域时提示一下
  const top = Object.keys(w).reduce((a, b) => (w[a] > w[b] ? a : b));
  if (w[top] > 0.6 && top !== blend.region) {
    if (blend.region && raceState === 'racing') showMessage(`📍 ${TRACK_BY_ID[top].name}`, 2);
    blend.region = top;
  }
  return w;
}

// ---------------- 开放世界的碰撞：障碍物、世界边界、海岸线 ----------------
function hitSurface(c, nx, nz, pen) {   // (nx, nz) 指向障碍物内部
  c.x -= nx * pen;
  c.z -= nz * pen;
  const vn = c.vx * nx + c.vz * nz;
  if (vn <= 0) return;
  if (c.state === 'drive' && vn > CRASH_SPEED && c.ghost <= 0) {
    crash(c, vn);
    c.vx -= 1.2 * vn * nx;
    c.vz -= 1.2 * vn * nz;
    return;
  }
  c.vx -= 1.35 * vn * nx;
  c.vz -= 1.35 * vn * nz;
  const scrub = 1 - Math.min(0.3, vn * 0.025);
  c.vx *= scrub;
  c.vz *= scrub;
  // 车头顺着障碍物表面摆正一点
  let tx = -nz, tz = nx;
  if (tx * c.vx + tz * c.vz < 0) { tx = -tx; tz = -tz; }
  c.heading += wrapAngle(Math.atan2(tx, tz) - c.heading) * Math.min(0.5, vn * 0.05);
  if (c.isPlayer) {
    if (vn > 4) sound.bump(vn); else sound.scrape();
    shake = Math.max(shake, Math.min(0.5, vn * 0.03));
  }
}

function collideObstacles(c) {
  const dx = c.x - WORLD_CENTER[0], dz = c.z - WORLD_CENTER[1], dist = Math.hypot(dx, dz);
  if (dist > WORLD_RADIUS) hitSurface(c, dx / dist, dz / dist, dist - WORLD_RADIUS);
  if (c.z > oceanZ) hitSurface(c, 0, 1, c.z - oceanZ);
  const halfW = c.built.half[0];
  obstacles.query(c.x, c.z, c.built.half[1] + 1, (o) => {
    for (const [px, pz] of carCircles(c)) {
      const ox = o.x - px, oz = o.z - pz, d = Math.hypot(ox, oz), min = o.r + halfW;
      if (d < min && d > 1e-4) hitSurface(c, ox / d, oz / d, min - d);
    }
  });
}

// 按 R：回到最近的一条路上（赛道或连接公路），车头朝向原来大致的方向
function resetToRoad(c) {
  let q = nearestRoad(c.x, c.z, 120);
  if (!q) {
    let bestD = Infinity;
    for (const R of [...Object.values(regionTracks), ...links]) {
      for (let i = 0; i < R.N; i += 2) {
        const d = (c.x - R.px[i]) ** 2 + (c.z - R.pz[i]) ** 2;
        if (d < bestD) { bestD = d; q = { road: R, i, d: Math.sqrt(d) }; }
      }
    }
  }
  if (!q || q.road === T) return resetToTrack(c);
  const R = q.road, i = q.i;
  let h = R.heading[i];
  if (Math.cos(h - c.heading) < 0) h += Math.PI;
  Object.assign(c, { x: R.px[i], z: R.pz[i], heading: h, vx: 0, vz: 0, vF: 0, vL: 0, steer: 0, yawRate: 0, accel: 0, drift: 0, state: 'drive', crashT: 0, ghost: 2, stuckT: 0, wrongT: 0, skidLast: null });
  c.tumble.position.set(0, 0, 0);
  c.tumble.rotation.set(0, 0, 0);
  c.idx = projectGlobal(T, c.x, c.z);
  const tc = trackCoords(T, c.x, c.z, c.idx);
  c.s = tc.s;
  c.lat = tc.lat;
  Object.assign(c, { vy: 0, air: false, airT: 0 });
  c.y = surfaceY(c);
  snapInterp(c);
}

/* ===== js/audio/engine-worklet.js ===== */
// 物理建模引擎声的 AudioWorklet 处理器。
// 整个函数不会在页面里执行：sound.js 初始化音频时把它的源码转成 Blob 交给 audioWorklet.addModule，
// 它在音频线程里运行（因此这里用到的 sampleRate、AudioWorkletProcessor、registerProcessor 都是音频线程的全局变量）。
function pelicanEngineWorklet() {
  // 物理建模引擎声（AudioWorklet）
  // 算法改编自 Antonio-R1/engine-sound-generator（MIT License, Copyright (c) 2021-2022 Antonio-R1），
  // 原理见 Baldan et al., "Physically informed car engine sound synthesis for virtual and augmented environments" (2015)：
  // 每个气缸按四冲程相位产生活塞运动 + 燃烧爆发 + 进排气门开合，脉冲经过进气管、排气歧管、直管、消音器、尾管
  // 这些数字波导（双向延迟线 + 两端反射）后输出，缸数、管长、反射系数和消音程度决定了音色。
  class DelayLine {
    constructor(length) { this.data = new Float32Array(Math.max(1, length | 0)); this.index = 0; }
    pushLeft(value) { this.data[this.index] = value; if (++this.index >= this.data.length) this.index = 0; }
    pushRight(value) { this.data[this.index] = value; if (--this.index < 0) this.index = this.data.length - 1; }
    get head() { return this.data[this.index]; }
  }

  class Waveguide {
    constructor(length, reflectLeft, reflectRight) {
      this.upper = new DelayLine(length);
      this.lower = new DelayLine(length);
      this.reflectLeft = reflectLeft;
      this.reflectRight = reflectRight;
      this.outLeft = 0;
      this.outRight = 0;
    }
    add(inLeft, inRight) {
      const lo = this.lower.head, up = this.upper.head;
      this.outLeft = lo * (1 - this.reflectLeft);
      this.outRight = up * (1 - this.reflectRight);
      this.upper.pushRight(inLeft + lo * this.reflectLeft);
      this.lower.pushLeft(inRight + up * this.reflectRight);
    }
  }

  class OnePole {
    constructor(freq) { this.set(freq); this.y = 0; }
    set(freq) { const w = 2 * Math.PI * freq / sampleRate; this.a = w / (w + 1); }
    run(x) { this.y += this.a * (x - this.y); return this.y; }
  }

  class Cylinder {
    constructor(p, scale) {
      this.cyl = new Waveguide(10, 0.75, 0.75);
      this.intake = new Waveguide(p.intake * scale, 0.01, p.intakeOpen);
      this.exhaust = new Waveguide(p.exhaust * scale, p.exhaustClosed, 0.01);
      this.extractor = new Waveguide(p.extractor * scale, 0.01, 0.01);
      this.p = p;
    }
    update(noise, pipeLeft, x, fire) {
      const p = this.p;
      const exV = x > 0.75 ? -Math.sin(4 * Math.PI * x) : 0;
      const inV = x < 0.25 ? Math.sin(4 * Math.PI * x) : 0;
      const piston = Math.cos(4 * Math.PI * x);
      const ign = x < 0.5 * p.ignition ? Math.sin(2 * Math.PI * (x / p.ignition)) : 0;
      const inR = p.intakeOpen * inV + p.intakeClosed * (1 - inV);
      const exR = p.exhaustOpen * exV + p.exhaustClosed * (1 - exV);
      this.intake.reflectRight = inR;
      this.cyl.reflectLeft = inR;
      this.exhaust.reflectLeft = exR;
      this.cyl.reflectRight = exR;
      const amp = piston * 1.5 + ign * 5 * fire;
      const extL = this.extractor.outLeft, cylL = this.cyl.outLeft, cylR = this.cyl.outRight;
      this.extractor.add(this.exhaust.outRight, pipeLeft);
      this.exhaust.add(cylR, extL);
      this.cyl.add(amp + this.intake.outRight * (1 - inR), extL * (1 - exR));
      this.intake.add(noise * inV, cylL * (1 - inR));
    }
  }

  class EngineProcessor extends AudioWorkletProcessor {
    static get parameterDescriptors() {
      return [
        { name: 'rpm', defaultValue: 1000, minValue: 0, automationRate: 'k-rate' },
        { name: 'throttle', defaultValue: 0, minValue: 0, maxValue: 1, automationRate: 'k-rate' },
      ];
    }
    constructor(options) {
      super();
      this.rev = 0;
      this.rpm = 1000;
      this.thr = 0;
      this.noiseLp = new OnePole(11000);
      this.crankLp = new OnePole(75);
      this.blockLp = new OnePole(125);
      this.configure(options.processorOptions);
      this.port.onmessage = (e) => this.configure(e.data);
    }
    configure(p) {
      this.p = p;
      const scale = sampleRate / 44100;
      this.cyls = Array.from({ length: p.cylinders }, () => new Cylinder(p, scale));
      this.inv = 1 / p.cylinders;
      this.pipe = new Waveguide(p.pipe * scale, p.pipeReflect, p.pipeReflect);
      this.muffler = p.muffler.map((len) => new Waveguide(len * scale, 0, p.action));
      this.mufL = 0; this.mufR = 0;
      this.outlet = new Waveguide(p.outlet * scale, 0.01, 0.01);
      this.hpX = 0; this.hpY = 0;
      this.hpA = Math.exp(-2 * Math.PI * 30 / sampleRate);
    }
    process(inputs, outputs, params) {
      const out = outputs[0][0];
      const p = this.p;
      const rpmT = params.rpm[0], thrT = params.throttle[0];
      const n = out.length;
      const dRpm = (rpmT - this.rpm) / n, dThr = (thrT - this.thr) / n;
      const mInv = 1 / this.muffler.length;
      for (let i = 0; i < n; i++) {
        this.rpm += dRpm;
        this.thr += dThr;
        // 燃烧强度：油门越大爆发越猛；收油时只剩很弱的燃烧（发动机制动）
        const fire = p.fireIdle + (1 - p.fireIdle) * this.thr;
        const noise = this.noiseLp.run(Math.random() * 2 - 1);
        const crank = this.crankLp.run(p.jitter * Math.random());
        let block = 0, intake = 0, pipeIn = 0;
        for (let c = 0; c < this.cyls.length; c++) {
          let x = this.rev + c * (this.inv + crank);
          x -= Math.floor(x);
          const cy = this.cyls[c];
          cy.update(noise, this.pipe.outLeft * this.inv, x, fire);   // 回流按缸数均分，否则多缸时反馈增益 > 1 会发散
          block += cy.cyl.outRight;
          intake += cy.intake.outLeft;
          pipeIn += cy.extractor.outRight;
        }
        this.rev += this.rpm / 120 / sampleRate;
        if (this.rev >= 1) this.rev -= 1;
        this.pipe.add(pipeIn, this.mufL);
        this.outlet.add(this.mufR, 0);
        const pipeR = this.pipe.outRight * mInv, outL = this.outlet.outLeft * mInv;
        this.mufL = 0; this.mufR = 0;
        for (const m of this.muffler) {
          this.mufL += m.outLeft;
          this.mufR += m.outRight;
          m.add(pipeR, outL);
        }
        const y = (intake * p.gIntake + this.blockLp.run(block) * p.gBlock + this.outlet.outRight * p.gOutlet) * this.inv;
        // 30Hz 一阶高通：去掉次声和直流漂移
        const hp = this.hpA * (this.hpY + y - this.hpX);
        this.hpX = y; this.hpY = hp;
        out[i] = hp;
      }
      return true;
    }
  }
  registerProcessor('pelican-engine', EngineProcessor);
}

// 引擎声部：物理建模（AudioWorklet）的各车参数与声部，以及备用的振荡器版本
'use strict';

// =====================================================================
// 音效
// 引擎：按真实点火频率合成（转速 / 60 × 缸数 / 2），每款车有自己的谐波音色、失真、滤波、
//      V8 的不等间隔点火"突突"声、涡轮啸叫、泄压阀、收油回火，所有参数都经过平滑，声音连续不断
// =====================================================================
// 备用：不支持 AudioWorklet 的浏览器用振荡器合成
const OSC_PROFILES = {
  // F1：1.6T V6 高转尖啸 + MGU-H 电机啸叫
  f1: { cyl: 6, idle: 4000, red: 11500, harm: [1, 0.6, 0.35, 0.25, 0.15, 0.1, 0.06], sub: 0.2, drive: 1.6, lp: [1000, 3500], q: 0.8, burble: 0.03, turbo: 0, pops: 0.25, gain: 0.17, detune: 6 },
  // GT：自然吸气 V10，清亮高亢
  gt: { cyl: 8, idle: 1000, red: 7600, harm: [1, 0.55, 0.6, 0.3, 0.38, 0.22, 0.18, 0.12, 0.08], sub: 0.22, drive: 1.9, lp: [650, 2800], q: 1.5, burble: 0.07, turbo: 0, pops: 0.55, gain: 0.2, detune: 9 },
  // 拉力车：2.0T 直四，粗糙低沉 + 涡轮 + 泄压阀 + 防滞后放炮
  rally: { cyl: 4, idle: 1000, red: 7800, harm: [1, 0.85, 0.45, 0.4, 0.22, 0.2, 0.12, 0.1], sub: 0.3, drive: 2.8, lp: [650, 3600], q: 2, burble: 0.12, turbo: 0, bov: true, pops: 1, gain: 0.21, detune: 12 },
  // 肌肉车：大排量 V8，低频轰鸣，怠速"突突突"
  muscle: { cyl: 8, idle: 750, red: 6600, harm: [1, 0.95, 0.55, 0.45, 0.28, 0.22, 0.12, 0.08], sub: 0.7, drive: 1.7, lp: [380, 2600], q: 2.5, burble: 0.42, turbo: 0, pops: 0.85, gain: 0.26, detune: 14 },
  // 卡丁车：单缸二冲程，嗡嗡的蜂鸣
  kart: { cyl: 2, idle: 2600, red: 14500, harm: [1, 0.95, 0.85, 0.75, 0.65, 0.55, 0.45, 0.38, 0.3, 0.25], sub: 0.08, drive: 3.2, lp: [1400, 6500], q: 1, burble: 0.18, turbo: 0, pops: 0.1, gain: 0.14, detune: 3 },
};

class OscEngineVoice {
  constructor(fx, carId) {
    const ctx = fx.ctx;
    this.fx = fx;
    this.p = OSC_PROFILES[carId];
    const p = this.p;
    const real = new Float32Array(p.harm.length + 1), imag = new Float32Array(p.harm.length + 1);
    p.harm.forEach((a, i) => { imag[i + 1] = a; });
    const wave = ctx.createPeriodicWave(real, imag);

    this.mix = ctx.createGain();
    const osc = (type, gain, detune = 0) => {
      const o = ctx.createOscillator();
      if (type === 'wave') o.setPeriodicWave(wave); else o.type = type;
      o.detune.value = detune;
      const g = ctx.createGain();
      g.gain.value = gain;
      o.connect(g).connect(this.mix);
      o.start();
      return o;
    };
    this.oscs = [
      { o: osc('wave', 0.7), mul: 1 },
      { o: osc('wave', 0.45, p.detune), mul: 1 },
      { o: osc('sine', p.sub), mul: 0.5 },
    ];
    // 进气噪声：跟着点火频率走的带通噪声，给声音加一点"气"感
    const src = ctx.createBufferSource();
    src.buffer = fx.noise;
    src.loop = true;
    this.intake = ctx.createBiquadFilter();
    this.intake.type = 'bandpass';
    this.intake.Q.value = 1.5;
    this.intakeGain = ctx.createGain();
    this.intakeGain.gain.value = 0;
    src.connect(this.intake).connect(this.intakeGain).connect(this.mix);
    src.start();
    this.noiseSrc = src;

    // 不等间隔点火：用低频振荡器调制音量（V8 的"突突"感）
    this.am = ctx.createGain();
    this.am.gain.value = 1 - p.burble / 2;
    this.lfo = ctx.createOscillator();
    this.lfo.type = 'triangle';
    this.lfoGain = ctx.createGain();
    this.lfoGain.gain.value = p.burble / 2;
    this.lfo.connect(this.lfoGain).connect(this.am.gain);
    this.lfo.start();

    // 软削波失真 → 低通 → 输出
    this.shaper = ctx.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = (i / 1023) * 2 - 1; curve[i] = Math.tanh(x * p.drive) / Math.tanh(p.drive); }
    this.shaper.curve = curve;
    this.shaper.oversample = '2x';
    this.filter = ctx.createBiquadFilter();
    this.filter.type = 'lowpass';
    this.filter.Q.value = p.q;
    this.out = ctx.createGain();
    this.out.gain.value = 0;
    this.mix.connect(this.am).connect(this.shaper).connect(this.filter).connect(this.out).connect(fx.master);

    if (p.turbo) {
      this.turbo = ctx.createOscillator();
      this.turbo.type = 'sine';
      this.turboGain = ctx.createGain();
      this.turboGain.gain.value = 0;
      this.turbo.connect(this.turboGain).connect(fx.master);
      this.turbo.start();
    }
    this.rpm = p.idle;
    this.thr = 0;
    this.lastThrottle = 0;
    this.lastGear = 1;
    this.boost = 0;
    this.popT = 0;
  }

  // rpmN：0..1（怠速到红线）；throttle 0/1；volume 0..1；pitch 多普勒系数
  update(dt, { rpmN, throttle, gear, volume, pitch = 1, active }) {
    const ctx = this.fx.ctx, now = ctx.currentTime, p = this.p;
    const target = p.idle + (p.red - p.idle) * clamp(rpmN, 0, 1.05);
    this.rpm += (target - this.rpm) * Math.min(1, dt * 10);       // 转速平滑过渡（换挡时是滑下去而不是跳）
    this.thr += (throttle - this.thr) * Math.min(1, dt * (throttle > this.thr ? 9 : 5));
    const n = (this.rpm - p.idle) / (p.red - p.idle);
    const f = (this.rpm / 60) * (p.cyl / 2) * pitch;
    for (const { o, mul } of this.oscs) o.frequency.setTargetAtTime(f * mul, now, 0.015);
    this.lfo.frequency.setTargetAtTime(f * (p.cyl >= 8 ? 0.25 : 0.5), now, 0.015);
    this.intake.frequency.setTargetAtTime(f * 3, now, 0.03);
    this.intakeGain.gain.setTargetAtTime(0.05 + this.thr * 0.25, now, 0.05);
    this.filter.frequency.setTargetAtTime(p.lp[0] + (p.lp[1] - p.lp[0]) * (0.25 * n + 0.75 * n * (0.35 + 0.65 * this.thr)), now, 0.04);

    // 换挡：升挡瞬间音量轻微下沉一下
    const shiftDip = 1;
    const level = active ? p.gain * volume * (0.15 + 0.5 * this.thr + 0.35 * n) * shiftDip : 0;
    this.out.gain.setTargetAtTime(level, now, active ? 0.04 : 0.25);

    if (this.turbo) {
      this.boost += ((throttle ? n : 0) - this.boost) * Math.min(1, dt * (throttle ? 1.5 : 6));
      this.turbo.frequency.setTargetAtTime(lerp(p.turboPitch[0], p.turboPitch[1], this.boost) * pitch, now, 0.05);
      this.turboGain.gain.setTargetAtTime(active ? p.turbo * volume * this.boost * this.boost : 0, now, 0.05);
    }
    // 松油门：泄压阀"呲"一声，高转速时排气回火噼啪
    if (active && this.lastThrottle && !throttle) {
      if (p.bov && this.boost > 0.3) this.fx.burst({ duration: 0.35, type: 'highpass', frequency: 2500, gain: 0.18 * volume * this.boost });
      if (n > 0.45) this.popT = 0.7;
    }
    if (active && this.popT > 0) {
      this.popT -= dt;
      if (Math.random() < dt * 14 * p.pops) {
        this.fx.burst({ duration: 0.05 + Math.random() * 0.05, type: 'lowpass', frequency: 700 + Math.random() * 900, gain: (0.25 + Math.random() * 0.3) * volume * p.pops });
      }
    }
    this.lastThrottle = throttle;
  }

  stop() {
    const now = this.fx.ctx.currentTime;
    this.out.gain.setTargetAtTime(0, now, 0.05);
    if (this.turboGain) this.turboGain.gain.setTargetAtTime(0, now, 0.05);
    setTimeout(() => {
      for (const { o } of this.oscs) o.stop();
      this.lfo.stop();
      this.noiseSrc.stop();
      if (this.turbo) this.turbo.stop();
      this.out.disconnect();
    }, 400);
  }
}

// 物理模型参数：气缸数、各段管长（44.1kHz 下的采样数）、气门开/关时的反射系数、点火时长、消音器各腔长度和消音程度、
// 进气 / 缸体 / 尾管三路的混音比例；idle/red 为怠速和红线转速，lp 为低通范围，outGain 让各车满油门红线时响度一致
const ENGINE_MODELS = {
  // F1：1.6T V6 混动，短排气 + 几乎不消音，高转时浑厚的"嗡——"声而不是刺耳的尖叫
  f1: { cylinders: 6, intake: 60, exhaust: 70, extractor: 60, intakeOpen: 0.25, intakeClosed: 0.95, exhaustOpen: 0.25, exhaustClosed: 0.95, ignition: 0.012, pipe: 64, pipeReflect: 0.1, muffler: [6, 9, 12], action: 0.1, outlet: 3, jitter: 0.03, fireIdle: 0.3, gIntake: 0.3, gBlock: 0.4, gOutlet: 1, cylNorm: 1, idle: 4000, red: 11500, lp: [1500, 4500], outGain: 1.6, q: 0.8, pops: 0.2, bov: false, exhaust: 0.5 },
  // GT：平面曲轴 V8，较长的排气管，音调比 V10 低，声音饱满不刺耳
  gt: { cylinders: 8, intake: 110, exhaust: 120, extractor: 100, intakeOpen: 0.25, intakeClosed: 0.95, exhaustOpen: 0.25, exhaustClosed: 0.95, ignition: 0.016, pipe: 140, pipeReflect: 0.1, muffler: [12, 18, 24, 30], action: 0.25, outlet: 5, jitter: 0.08, fireIdle: 0.3, gIntake: 0.25, gBlock: 0.6, gOutlet: 1, cylNorm: 1, idle: 1000, red: 7600, lp: [650, 2400], outGain: 1.6, q: 0.8, pops: 0.6, bov: false, exhaust: 0.9 },
  // 拉力车：2.0T 直四，长排气管，粗犷低沉，收油时泄压阀"呲"一声 + 放炮
  rally: { cylinders: 4, intake: 110, exhaust: 110, extractor: 100, intakeOpen: 0.25, intakeClosed: 0.95, exhaustOpen: 0.25, exhaustClosed: 0.95, ignition: 0.018, pipe: 140, pipeReflect: 0.1, muffler: [12, 18, 24, 30], action: 0.3, outlet: 5, jitter: 0.15, fireIdle: 0.3, gIntake: 0.4, gBlock: 0.6, gOutlet: 1, cylNorm: 1, idle: 950, red: 7800, lp: [600, 2600], outGain: 0.707, q: 0.9, pops: 1.0, bov: true, exhaust: 0.9 },
  // 肌肉车：大排量 V8，曲轴抖动大（不等间隔点火的"突突"感），长排气 + 重消音

  // 卡丁车：二冲程单缸，每转点火一次，膨胀室排气管，嗡嗡的蜂鸣
