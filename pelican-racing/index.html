function launchHeli() {
  const [fx, fz] = forwardOf(player.heading);
  Object.assign(heli, { active: true, x: player.x + fx * 260, z: player.z + fz * 260, y: 55, vx: 0, vz: 0 });   // 从前方远处飞过来、降低高度
  heli.group.visible = true;
  heli.beam.visible = true;
  heli.spot.intensity = 5000;
}

function updateHeli(dt) {
  if (!heli || !heli.active || heli.pilot) return;   // 玩家驾驶时由 heli-mode.js 控制
  if (raceState !== 'replay') {
    // 飞在玩家前方 32～64 米、离地约 15 米，左右慢慢摆动：追车镜头的画面上方能看到它，探照灯回照玩家
    const p = player;
    const [fx, fz] = forwardOf(p.heading);
    const ahead = 32 + Math.min(Math.hypot(p.vx, p.vz), 70) * 0.45;
    const sway = Math.sin(elapsed * 0.35) * 14;
    const tx = p.x + fx * ahead + fz * sway, tz = p.z + fz * ahead - fx * sway;
    // 跟上玩家自己的速度，再加上朝目标点的修正，所以不会被甩到身后
    const wantVx = p.vx + clamp((tx - heli.x) * 1.2, -45, 45);
    const wantVz = p.vz + clamp((tz - heli.z) * 1.2, -45, 45);
    const k = Math.min(1, dt * 3);
    heli.vx += (wantVx - heli.vx) * k;
    heli.vz += (wantVz - heli.vz) * k;
    heli.x += heli.vx * dt;
    heli.z += heli.vz * dt;
    heli.y += (15 + Math.sin(elapsed * 0.8) * 1.5 - heli.y) * Math.min(1, dt * 0.8);
    const sp = Math.hypot(heli.vx, heli.vz);
    if (sp > 2) heli.heading += wrapAngle(Math.atan2(heli.vx, heli.vz) - heli.heading) * Math.min(1, dt * 2);
  }
  placeHeli(dt);
}

// 把直升机的位置同步到模型，并让探照灯和光柱对准被追的车
function placeHeli(dt) {
  const sp = Math.hypot(heli.vx, heli.vz);
  heli.group.position.set(heli.x, heli.y, heli.z);
  heli.group.rotation.set(0, heli.heading, 0);
  heli.body.rotation.x = heli.pilot ? heli.pitchV : clamp(sp * 0.006, 0, 0.25);   // 前倾
  heli.body.rotation.z = heli.pilot ? heli.rollV : 0;
  heli.rotor.rotation.y += dt * 42;
  heli.tailRotor.rotation.x += dt * 60;
  const flash = Math.floor(elapsed * 4) % 2;
  heli.red.color.setHex(flash ? 0xff2020 : 0x330000);
  heli.blue.color.setHex(flash ? 0x001033 : 0x2060ff);
  heli.beacon.color.setHex(Math.sin(elapsed * 8) > 0.7 ? 0xff2020 : 0x2a0000);   // 防撞灯短促闪烁
  // 探照灯：追警匪时照玩家；空中追捕时照逃犯（离得太远就照直升机正下方）
  let tgt = focusCar();
  if (heli.pilot) {
    const sus = heliMode.suspect;
    tgt = sus && Math.hypot(sus.x - heli.x, sus.z - heli.z) < 160 ? sus : { x: heli.x + heli.vx * 0.6, z: heli.z + heli.vz * 0.6 };
  }
  heli.spot.target.position.set(tgt.x, 0, tgt.z);
  const from = new THREE.Vector3(heli.x, heli.y - 1.2, heli.z);
  const to = new THREE.Vector3(tgt.x, 0, tgt.z);
  const len = from.distanceTo(to);
  heli.beam.position.copy(from);
  heli.beam.lookAt(to);
  heli.beam.scale.set(len * 0.2, len * 0.2, len);
  heli.beam.material.opacity = THEMES[T.def.theme].night ? 0.2 : 0.08;
}

function addLightbar(c) {
  const bar = new THREE.Group();
  bar.position.set(0, 1.17, -0.55);   // GT 的防滚架上
  const red = new THREE.MeshStandardMaterial({ color: 0x330000, emissive: 0xff1010, emissiveIntensity: 0 });
  const blue = new THREE.MeshStandardMaterial({ color: 0x000833, emissive: 0x1050ff, emissiveIntensity: 0 });
  bar.add(box(1.15, 0.1, 0.24, PM.carbon, 0, 0, 0));
  bar.add(box(0.5, 0.1, 0.22, red, 0.3, 0.09, 0), box(0.5, 0.1, 0.22, blue, -0.3, 0.09, 0));
  const glow = (color, x) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    s.position.set(x, 0.12, 0);
    s.scale.setScalar(1.6);
    bar.add(s);
    return s;
  };
  const gR = glow(0xff2020, 0.35), gB = glow(0x2060ff, -0.35);
  c.body.add(bar);
  c.lightbar = { red, blue, gR, gB };
}

function flashLightbar(c) {
  if (!c.lightbar) return;
  const t = elapsed * 5 + c.phase;
  const on = Math.floor(t) % 2;
  const burst = Math.sin(t * 9) > 0 ? 1 : 0.2;
  const lb = c.lightbar;
  lb.red.emissiveIntensity = on ? 4 * burst : 0.2;
  lb.blue.emissiveIntensity = on ? 0.2 : 4 * burst;
  lb.gR.material.opacity = on ? 0.9 * burst : 0.05;
  lb.gB.material.opacity = on ? 0.05 : 0.9 * burst;
}

/* ===== js/game/modes.js ===== */
// 比赛类型：名次赛、道具赛、计时赛（幽灵车 + 分段计时）、漂移赛（漂移得分 + 连击倍率）、警匪追逐、自由驾驶
'use strict';

const MODES = [
  ['race', '🏁 名次赛', '和 4 位鹈鹕对手比名次'],
  ['items', '🍄 道具赛', '撞碎道具箱拿道具（最多存 3 个）：香蕉皮、龟壳、蘑菇、闪电、无敌星、护盾，X 使用、Z 换顺序'],
  ['timetrial', '⏱ 计时赛', '独自跑圈挑战纪录，和自己最快单圈的幽灵车比'],
  ['drift', '🌀 漂移赛', '独自跑圈拿漂移分：连续漂移倍率越来越高，撞墙清零'],
  ['pursuit', '🚨 警匪追逐', '甩掉警车和直升机，第一个冲线，被围住就被捕'],
  ['heli', '🚁 空中追捕', '你是警察：驾驶警用直升机俯瞰全场，在逃犯前方投放钉刺带，逼停它就赢'],
  ['free', '🚗 自由驾驶', '五张地图由公路连成一片，随便开'],
];
const MODE_BY_ID = Object.fromEntries(MODES.map((m) => [m[0], m]));
const isSolo = () => (settings.mode === 'timetrial' || settings.mode === 'drift') && !freeRoam;
const isItems = () => settings.mode === 'items' && !freeRoam;
const isTimeTrial = () => settings.mode === 'timetrial' && !freeRoam;
const isDrift = () => settings.mode === 'drift' && !freeRoam;
const isHeliMode = () => settings.mode === 'heli' && !freeRoam;
const modeHud = $('modeHud');

// =====================================================================
// 计时赛：记录每圈的行驶轨迹，最快的一圈存成幽灵车，下次比赛时半透明地跟着跑；每 1/4 圈显示和纪录的差距
// =====================================================================
const ghost = { data: null, model: null, cur: [], sampleT: 0, cp: [], cpNext: 0, delta: null, deltaT: 0 };
const ghostKey = (id) => `pelican-racing-ghost-${id}`;
const CHECKPOINTS = [0.25, 0.5, 0.75];

function setupTimeTrial() {
  clearGhost();
  ghost.data = store.get(ghostKey(T.def.id), null);
  ghost.cur = [];
  ghost.cp = [];
  ghost.cpNext = 0;
  ghost.delta = null;
  if (ghost.data) makeGhostModel();
}

function makeGhostModel() {
  if (ghost.model) removeRacer(ghost.model);
  const g = createRacer({ carId: ghost.data.car, color: 0x8fd4ff });
  // 半透明、不投影
  g.root.traverse((o) => {
    if (!o.isMesh && !o.isSprite) return;
    o.castShadow = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const clones = mats.map((m) => {
      const c = m.clone();
      c.userData = {};
      c.transparent = true;
      c.opacity = 0.32;
      c.depthWrite = false;
      return c;
    });
    o.material = Array.isArray(o.material) ? clones : clones[0];
  });
  g.root.visible = false;
  ghost.model = g;
}

function clearGhost() {
  if (ghost.model) removeRacer(ghost.model);
  ghost.model = null;
}

// 每帧：记录玩家轨迹、回放幽灵车、检查分段
function updateTimeTrial(dt) {
  const p = player;
  const lapT = raceTime - p.lapStart;
  if (raceState === 'racing' && !p.finished) {
    ghost.sampleT -= dt;
    if (ghost.sampleT <= 0) {
      ghost.sampleT = 0.1;
      ghost.cur.push([+lapT.toFixed(2), +p.x.toFixed(2), +p.z.toFixed(2), +p.heading.toFixed(3), +p.y.toFixed(2)]);
    }
    // 分段：本圈跑过 1/4、1/2、3/4 时和纪录比
    const lapFrac = p.lapCount >= 1 ? p.s / T.L : 0;
    if (p.lapCount >= 1 && ghost.cpNext < CHECKPOINTS.length && lapFrac >= CHECKPOINTS[ghost.cpNext] && lapFrac < CHECKPOINTS[ghost.cpNext] + 0.1) {
      ghost.cp[ghost.cpNext] = lapT;
      const ref = ghost.data?.cp?.[ghost.cpNext];
      if (ref) { ghost.delta = lapT - ref; ghost.deltaT = 3; }
      ghost.cpNext++;
    }
  }
  if (ghost.deltaT > 0) ghost.deltaT -= dt;
  // 幽灵车：按本圈已用时间在纪录轨迹里插值
  const g = ghost.model, pts = ghost.data?.pts;
  if (!g || !pts) return;
  if (raceState !== 'racing' || lapT > pts[pts.length - 1][0]) { g.root.visible = false; return; }
  let lo = 0, hi = pts.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (pts[mid][0] <= lapT) lo = mid; else hi = mid; }
  const a = pts[lo], b = pts[hi], u = clamp((lapT - a[0]) / Math.max(1e-3, b[0] - a[0]), 0, 1);
  const nx = lerp(a[1], b[1], u), nz = lerp(a[2], b[2], u);
  g.vF = Math.hypot(nx - g.x, nz - g.z) / Math.max(dt, 1e-3);
  g.x = nx; g.z = nz;
  g.heading = a[3] + wrapAngle(b[3] - a[3]) * u;
  const ny = lerp(a[4] ?? 0, b[4] ?? 0, u);   // 旧纪录没有高度
  g.vy = (ny - g.y) / Math.max(dt, 1e-3);
  g.y = ny;
  g.air = g.y > 0.2 && Math.abs(g.vy) > 0.5;
  syncModel(g, dt, elapsed);
  g.root.visible = true;
}

// 一圈跑完：比纪录快就把这一圈存成新的幽灵车
function timeTrialLap(lapTime) {
  const old = ghost.data;
  if (!old || lapTime < old.time) {
    ghost.data = { time: lapTime, car: player.carId, cp: ghost.cp.slice(), pts: ghost.cur };
    store.set(ghostKey(T.def.id), ghost.data);
    makeGhostModel();
    showMessage(`⏱ 新的最快单圈 ${formatTime(lapTime)}<small>${old ? `比纪录快 ${(old.time - lapTime).toFixed(2)} 秒 · ` : ''}幽灵车已更新</small>`, 2.5);
  }
  ghost.cur = [];
  ghost.cp = [];
  ghost.cpNext = 0;
}

// =====================================================================
// 漂移赛：侧滑角 × 车速 累积分数；连续漂移每 2 秒倍率 +1（最高 ×5），停止漂移 1.2 秒后入账，撞墙撞车清零
// =====================================================================
const drift = { total: 0, chain: 0, mult: 1, chainT: 0, gapT: 0, best: 0, bestChain: 0, lost: 0 };
const driftKey = (id) => `pelican-racing-drift-${id}`;
const DRIFT_MEDALS = [['🥇', 14000], ['🥈', 8000], ['🥉', 3500]];   // 每圈分数门槛

function setupDrift() {
  Object.assign(drift, { total: 0, chain: 0, mult: 1, chainT: 0, gapT: 0, bestChain: 0, lost: 0 });
  drift.best = store.get(driftKey(T.def.id), 0);
}

function updateDriftScore(dt) {
  const p = player;
  if (raceState !== 'racing' || p.finished) return;
  if (p.state !== 'drive') { breakDriftChain('💥 撞车了'); return; }
  const spd = Math.hypot(p.vx, p.vz);
  const angle = THREE.MathUtils.radToDeg(Math.abs(Math.atan2(p.vL, Math.max(p.vF, 1))));
  if (spd > 11 && p.vF > 5 && angle > 8) {
    drift.chain += angle * spd * 3.6 * 0.08 * dt;
    drift.chainT += dt;
    drift.gapT = 0;
    drift.mult = 1 + Math.min(4, Math.floor(drift.chainT / 2));
  } else if (drift.chain > 0) {
    drift.gapT += dt;
    if (drift.gapT > 1.2) bankDrift();
  }
}

function bankDrift() {
  const pts = Math.round(drift.chain * drift.mult);
  if (pts > 0) {
    drift.total += pts;
    drift.bestChain = Math.max(drift.bestChain, pts);
    if (pts > 300) showMessage(`🌀 +${pts.toLocaleString()}<small>漂移 ${drift.chainT.toFixed(1)} 秒 · 倍率 ×${drift.mult}</small>`, 1.4);
  }
  Object.assign(drift, { chain: 0, mult: 1, chainT: 0, gapT: 0 });
}

function breakDriftChain(reason) {
  if (drift.chain < 1) return;
  drift.lost += Math.round(drift.chain * drift.mult);
  showMessage(`${reason}<small>这一段漂移的 ${Math.round(drift.chain * drift.mult).toLocaleString()} 分没了</small>`, 1.6);
  Object.assign(drift, { chain: 0, mult: 1, chainT: 0, gapT: 0 });
}

// 撞墙 / 撞车：力度够大就清零当前连击
function driftHit(strength) {
  if (isDrift() && strength > 3) breakDriftChain('💥 撞墙了');
}

function driftMedal(score, laps) {
  return DRIFT_MEDALS.find(([, need]) => score >= need * laps)?.[0] ?? '';
}

// =====================================================================
// 模式面板（计时赛 / 漂移赛 / 道具赛）
// =====================================================================
let modeHudT = 0;
function updateModeHud(dt) {
  modeHudT -= dt;
  if (modeHudT > 0) return;
  modeHudT = 0.1;
  if (isTimeTrial()) {
    const rec = ghost.data ? formatTime(ghost.data.time) : '暂无';
    const d = ghost.deltaT > 0 && ghost.delta !== null
      ? `<span class="${ghost.delta <= 0 ? 'good' : 'bad'}">${ghost.delta <= 0 ? '−' : '+'}${Math.abs(ghost.delta).toFixed(2)}</span>` : '';
    modeHud.innerHTML = `<div class="row">⏱ 纪录 ${rec}${ghost.data ? ' · 👻 幽灵车' : ''} ${d}</div>`;
  } else if (isDrift()) {
    const live = drift.chain > 0 ? `<div class="combo">+${Math.round(drift.chain).toLocaleString()} <b>×${drift.mult}</b></div>` : '<div class="combo dim">过弯时甩尾漂移得分</div>';
    modeHud.innerHTML = `<div class="row">🌀 <b class="score">${drift.total.toLocaleString()}</b> 分 · 最高 ${drift.best.toLocaleString()}</div>${live}`;
  } else if (isItems()) {
    modeHud.innerHTML = itemHudHtml();
  }
}

/* ===== js/game/items.js ===== */
// 道具赛（参考马里奥赛车）：撞碎赛道上的道具箱随机拿到一个道具，按 X 使用；名次越靠后拿到的道具越强。
// 香蕉皮（丢在身后）、绿龟壳（直线飞出、撞墙反弹）、追踪红壳（追前面一名）、加速蘑菇、闪电（其他车全部打滑变小变慢）、无敌星（无敌 + 加速，撞谁谁打滑）、
// 护盾（参考 QQ 飞车的天使：挡掉下一次攻击）；被红壳锁定时道具框闪红并报警
'use strict';

const ITEMS = {
  banana: { icon: '🍌', name: '香蕉皮' },
  green: { icon: '🟢', name: '绿龟壳' },
  red: { icon: '🔴', name: '追踪红壳' },
  mushroom: { icon: '🍄', name: '加速蘑菇' },
  lightning: { icon: '⚡', name: '闪电' },
  star: { icon: '⭐', name: '无敌星' },
  shield: { icon: '🛡️', name: '护盾' },
};
// 按名次分三档的抽取权重：领先的多给防守道具，落后的多给强力道具
const ITEM_ODDS = [
  { banana: 40, green: 30, shield: 14, mushroom: 13, star: 3 },
  { banana: 16, green: 24, red: 24, shield: 10, mushroom: 20, star: 6 },
  { green: 12, red: 32, mushroom: 28, lightning: 16, star: 12 },
];
const ITEM_ROWS = [0.2, 0.45, 0.68, 0.9];   // 道具箱在一圈里的位置
const ITEM_SLOTS = 3;                        // 最多同时存几个道具（含正在抽取的）
const itemCount = (c) => c.items.length + c.pending.length;
let itemBoxes = [], bananas = [], shells = [];
const itemBoxEl = $('itemBox');

// ---------------- 模型 ----------------
const boxTex = canvasTexture(128, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, w, h);
  ['#ff4d4d', '#ffb13d', '#ffe94d', '#4dff88', '#4dc3ff', '#b04dff'].forEach((c, i) => grad.addColorStop(i / 5, c));
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ffffff'; g.lineWidth = 8; g.strokeRect(6, 6, w - 12, h - 12);
  g.fillStyle = '#ffffff'; g.font = 'bold 84px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('?', w / 2, h / 2 + 4);
});
boxTex.userData.shared = true;
const boxMat = new THREE.MeshStandardMaterial({ map: boxTex, emissive: 0xffffff, emissiveMap: boxTex, emissiveIntensity: 0.35, transparent: true, opacity: 0.88, roughness: 0.3 });
boxMat.userData.shared = true;
const boxGeo = new THREE.BoxGeometry(1.3, 1.3, 1.3);
boxGeo.userData.shared = true;

function makeBanana() {
  const g = new THREE.Group();
  const peel = mesh(new THREE.TorusGeometry(0.32, 0.1, 8, 16, Math.PI * 1.1).rotateX(-Math.PI / 2), mat(0xf5d33a, { roughness: 0.6 }));
  peel.position.y = 0.1;
  const tip = mesh(new THREE.SphereGeometry(0.06, 8, 6), mat(0x5a3b1a));
  tip.position.set(0.32, 0.1, 0);
  g.add(peel, tip);
  return g;
}
function makeShell(color) {
  const g = new THREE.Group();
  const dome = mesh(new THREE.SphereGeometry(0.42, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), paintMat(color));
  const rim = mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.14, 18), mat(0xf4f4f4, { roughness: 0.4 }));
  rim.position.y = 0.02;
  dome.position.y = 0.06;
  for (let i = 0; i < 6; i++) {
    const spot = mesh(new THREE.CircleGeometry(0.1, 8), mat(0xf4f4f4));
    const a = (i / 6) * Math.PI * 2;
    spot.position.set(Math.cos(a) * 0.3, 0.33, Math.sin(a) * 0.3);
    spot.lookAt(Math.cos(a) * 0.6, 0.8, Math.sin(a) * 0.6);
    g.add(spot);
  }
  g.add(dome, rim);
  return g;
}

// ---------------- 开局 / 清理 ----------------
function setupItems() {
  clearItems();
  for (const f of ITEM_ROWS) {
    for (const lat of [-0.6, -0.2, 0.2, 0.6]) {
      const p = trackPoint(T, T.L * f, lat * T.W);
      const m = new THREE.Mesh(boxGeo, boxMat);
      const y0 = 1.1 + bankHeight(T, p.i, lat * T.W);
      m.position.set(p.x, y0, p.z);
      scene.add(m);
      itemBoxes.push({ mesh: m, x: p.x, z: p.z, y0, respawn: 0, phase: Math.random() * 6 });
    }
  }
  for (const c of racers) Object.assign(c, { items: [], rolling: 0, pending: [], starT: 0, zapT: 0, shieldT: 0, itemAiT: rand(1, 3), hitsGiven: 0, hitsTaken: 0 });
  itemBoxEl.style.display = 'flex';
  updateItemBox();
}

function clearItems() {
  for (const b of itemBoxes) b.mesh.removeFromParent();
  for (const b of bananas) disposeTree(b.group);
  for (const s of shells) disposeTree(s.group);
  itemBoxes = []; bananas = []; shells = [];
  for (const c of racers) { if (c.starAura) { c.starAura.removeFromParent(); c.starAura = null; } dropShield(c); c.root.scale.setScalar(1); }
  itemBoxEl.style.display = 'none';
  itemBoxEl.classList.remove('locked');
}

// 按名次抽道具
function rollItem(c) {
  const order = standings();
  const rank = order.indexOf(c) / Math.max(1, order.length - 1);
  const odds = ITEM_ODDS[rank < 0.25 ? 0 : rank < 0.75 ? 1 : 2];
  let r = Math.random() * Object.values(odds).reduce((a, b) => a + b, 0);
  for (const [id, w] of Object.entries(odds)) { r -= w; if (r <= 0) return id; }
  return 'banana';
}

// ---------------- 使用道具 ----------------
// 使用排在最前面的道具
function useItem(c) {
  const id = c.items[0];
  if (!id || c.state !== 'drive') return;
  c.items.shift();
  const [fx, fz] = forwardOf(c.heading);
  const half = c.built.half[1];
  if (id === 'banana') {
    const g = makeBanana();
    const x = c.x - fx * (half + 1.2), z = c.z - fz * (half + 1.2);
    g.position.set(x, roadHeightAt(T, c.idx, x, z) + 0.03, z);
    g.rotation.y = Math.random() * 6;
    scene.add(g);
    bananas.push({ group: g, x, z, owner: c, safeT: 0.6 });
  } else if (id === 'green' || id === 'red') {
    const g = makeShell(id === 'green' ? 0x2fbf4a : 0xe02a2a);
    const x = c.x + fx * (half + 1.2), z = c.z + fz * (half + 1.2);
    const speed = Math.max(62, c.vF + 30);
    g.position.set(x, 0.1, z);
    scene.add(g);
    shells.push({ group: g, type: id, x, z, vx: fx * speed, vz: fz * speed, speed, owner: c, safeT: 0.35, life: id === 'green' ? 7 : 10, idx: c.idx, target: id === 'red' ? carAhead(c) : null });
  } else if (id === 'mushroom') {
    c.nitroTime = Math.max(c.nitroTime, 1.6);   // 借用氮气的加速和尾焰，不消耗氮气充能
    c.vx += fx * 8; c.vz += fz * 8;
  } else if (id === 'lightning') {
    for (const o of racers) if (o !== c && hitByItem(o, 'lightning', c)) o.zapT = 4;
    flashScreen();
    sound.thunder();
  } else if (id === 'shield') {
    c.shieldT = 8;
    if (!c.shieldBubble) {
      c.shieldBubble = new THREE.Mesh(shieldGeo, new THREE.MeshBasicMaterial({ color: 0x8fdcff, transparent: true, opacity: 0.22, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
      c.shieldBubble.scale.set(c.built.half[0] * 1.5, 1.3, c.built.half[1] * 1.25);
      c.shieldBubble.position.y = 0.7;
      c.root.add(c.shieldBubble);
    }
  } else if (id === 'star') {
    c.starT = 7;
    if (!c.starAura) {
      c.starAura = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      c.starAura.scale.setScalar(6);
      c.starAura.position.y = 0.8;
      c.root.add(c.starAura);
    }
  }
  if (c.isPlayer) { sound.itemUse(); updateItemBox(); }
}

// 前面一名（追踪红壳的目标）
function carAhead(c) {
  let best = null, bestGap = Infinity;
  for (const o of racers) {
    if (o === c) continue;
    const gap = o.progress - c.progress;
    if (gap > 0 && gap < bestGap) { bestGap = gap; best = o; }
  }
  return best ?? racers.find((o) => o !== c) ?? null;
}

// 护盾泡泡
const shieldGeo = new THREE.SphereGeometry(1, 20, 14);
shieldGeo.userData.shared = true;
function dropShield(c) {
  c.shieldT = 0;
  if (c.shieldBubble) { disposeTree(c.shieldBubble); c.shieldBubble = null; }
}

// 被道具打中：打滑减速（无敌星状态免疫；有护盾就只打掉护盾）
function hitByItem(c, what, from) {
  if (c.starT > 0 || c.state !== 'drive') return false;
  if (c.shieldT > 0) {
    dropShield(c);
    for (let k = 0; k < 10; k++) emit(sparkPool, v(c.x, c.y + 0.9, c.z), { vel: v(rand(-4, 4), rand(1, 4), rand(-4, 4)), life: 0.4, size0: 0.4, size1: 0.05, color: 0x8fdcff, gravity: 6, alpha: 1 });
    if (c.isPlayer) { sound.pop(); showMessage(`🛡️ 护盾挡住了${ITEMS[what]?.name ?? '攻击'}！`, 1.3); }
    else if (from?.isPlayer) showMessage(`🛡️ ${c.name} 的护盾挡住了`, 1.1);
    return false;
  }
  spinOut(c, 14);
  c.vx *= 0.35; c.vz *= 0.35;
  c.hitsTaken = (c.hitsTaken || 0) + 1;
  if (from && from !== c) from.hitsGiven = (from.hitsGiven || 0) + 1;
  for (let k = 0; k < 10; k++) emit(sparkPool, v(c.x, 0.8, c.z), { vel: v(rand(-4, 4), rand(2, 5), rand(-4, 4)), life: 0.45, size0: 0.35, size1: 0.05, color: what === 'lightning' ? 0x9fd8ff : 0xffe066, gravity: 10, alpha: 1 });
  if (c.isPlayer) {
    sound.itemHit();
    shake = Math.max(shake, 0.6);
    showMessage(`${ITEMS[what]?.icon ?? '💥'} 被${ITEMS[what]?.name ?? '撞'}击中！`, 1.5);
  } else if (from?.isPlayer) {
    showMessage(`🎯 ${ITEMS[what]?.icon ?? ''} 击中了 ${c.name}！`, 1.3);
  }
  return true;
}

// 闪电：全屏白光一闪
function flashScreen() {
  const el = $('flash');
  el.style.transition = 'none';
  el.style.opacity = '0.85';
  requestAnimationFrame(() => { el.style.transition = 'opacity 0.6s'; el.style.opacity = '0'; });
}

// ---------------- 每帧更新 ----------------
function updateItems(dt) {
  if (!isItems() || !racers.length) return;
  const live = raceState === 'racing' || raceState === 'done';
  // 道具箱：旋转、上下浮动；被撞碎后 4 秒重新出现
  for (const b of itemBoxes) {
    b.mesh.rotation.y += dt * 1.5;
    b.mesh.rotation.x = Math.sin(elapsed + b.phase) * 0.3;
    b.mesh.position.y = b.y0 + Math.sin(elapsed * 2 + b.phase) * 0.15;
    if (b.respawn > 0) { b.respawn -= dt; b.mesh.visible = b.respawn <= 0; continue; }
    if (!live) continue;
    for (const c of racers) {
      if (itemCount(c) >= ITEM_SLOTS || c.state !== 'drive') continue;   // 道具槽满了就撞不开
      if ((c.x - b.x) ** 2 + (c.z - b.z) ** 2 < 4.4) {
        b.respawn = 4;
        b.mesh.visible = false;
        if (c.rolling <= 0) c.rolling = 1.1;
        c.pending.push(rollItem(c));
        for (let k = 0; k < 8; k++) emit(sparkPool, v(b.x, 1.1, b.z), { vel: v(rand(-3, 3), rand(1, 4), rand(-3, 3)), life: 0.5, size0: 0.4, size1: 0.1, color: pick([0xff4d4d, 0xffe94d, 0x4dc3ff, 0x4dff88]), gravity: 6, alpha: 1 });
        if (c.isPlayer) sound.itemGet();
        break;
      }
    }
  }
  for (const c of racers) {
    if (c.rolling > 0) {
      c.rolling -= dt;
      // 抽完一个放进道具槽；后面还排着的接着抽（快一点）
      if (c.rolling <= 0) {
        c.items.push(c.pending.shift());
        if (c.items.length === 1) c.itemAiT = rand(0.8, 2.5);
        if (c.pending.length) c.rolling = 0.6;
      }
    }
    if (c.starT > 0) {
      c.starT -= dt;
      if (c.starAura) {
        c.starAura.material.color.setHSL((elapsed * 1.5) % 1, 1, 0.6);
        c.starAura.material.opacity = c.starT > 1.5 || Math.floor(elapsed * 10) % 2 ? 0.7 : 0.2;
        if (c.starT <= 0) { c.starAura.removeFromParent(); c.starAura = null; }
      }
    }
    if (c.zapT > 0) c.zapT -= dt;
    if (c.shieldT > 0) {
      c.shieldT -= dt;
      if (c.shieldBubble) c.shieldBubble.material.opacity = c.shieldT > 1.5 || Math.floor(elapsed * 10) % 2 ? 0.22 : 0.06;
      if (c.shieldT <= 0) dropShield(c);
    }
    // 被闪电劈中的车缩小
    const s = c.zapT > 0 ? 0.7 : 1;
    c.root.scale.setScalar(lerp(c.root.scale.x, s, Math.min(1, dt * 6)));
    if (!c.isPlayer && live && c.items.length && c.state === 'drive') aiUseItem(c, dt);
  }
  // 香蕉皮
  for (let i = bananas.length - 1; i >= 0; i--) {
    const b = bananas[i];
    b.safeT -= dt;
    for (const c of racers) {
      if ((c === b.owner && b.safeT > 0) || c.air) continue;
      if ((c.x - b.x) ** 2 + (c.z - b.z) ** 2 < 2.4) {
        hitByItem(c, 'banana', b.owner);
        disposeTree(b.group);
        bananas.splice(i, 1);
        break;
      }
    }
  }
  // 龟壳
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.life -= dt;
    s.safeT -= dt;
    if (s.type === 'red' && s.target) {
      // 追踪：离目标远时沿赛道飞，近了直接扑过去
      const t = s.target;
      const d = Math.hypot(t.x - s.x, t.z - s.z);
      let tx = t.x, tz = t.z;
      if (d > 35) { const tp = trackPoint(T, trackCoords(T, s.x, s.z, s.idx).s + 14, t.lat); tx = tp.x; tz = tp.z; }
      const want = Math.atan2(tx - s.x, tz - s.z), cur = Math.atan2(s.vx, s.vz);
      const nh = cur + clamp(wrapAngle(want - cur), -4 * dt, 4 * dt);
      s.vx = Math.sin(nh) * s.speed;
      s.vz = Math.cos(nh) * s.speed;
    }
    s.x += s.vx * dt;
    s.z += s.vz * dt;
    // 撞护栏：绿壳反弹，红壳碎掉
    s.idx = projectNear(T, s.x, s.z, s.idx);
    const tc = trackCoords(T, s.x, s.z, s.idx);
    if (Math.abs(tc.lat) > T.B - 0.4) {
      if (s.type === 'green') {
        const side = Math.sign(tc.lat), nx = T.nx[s.idx] * side, nz = T.nz[s.idx] * side;
        const vn = s.vx * nx + s.vz * nz;
        if (vn > 0) { s.vx -= 2 * vn * nx; s.vz -= 2 * vn * nz; }
        s.x -= nx * (Math.abs(tc.lat) - (T.B - 0.4)); s.z -= nz * (Math.abs(tc.lat) - (T.B - 0.4));
      } else s.life = 0;
    }
    s.group.position.set(s.x, roadHeightAt(T, s.idx, s.x, s.z) + 0.1, s.z);
    s.group.rotation.y += dt * 14;
    let dead = s.life <= 0;
    if (!dead) {
      for (const c of racers) {
        if ((c === s.owner && s.safeT > 0) || c.air) continue;
        if ((c.x - s.x) ** 2 + (c.z - s.z) ** 2 < 3.6) {
          hitByItem(c, s.type, s.owner);
          dead = true;
          break;
        }
      }
    }
    if (dead) {
      emit(smokePool, v(s.x, 0.5, s.z), { vel: v(0, 1.5, 0), life: 0.8, size0: 1, size1: 3, color: 0xffffff, alpha: 0.5 });
      disposeTree(s.group);
      shells.splice(i, 1);
    }
  }
  if (itemKey(player) !== itemBoxEl.dataset.key || player.rolling > 0) updateItemBox();
  // 被追踪红壳锁定：道具框闪红，嘀嘀报警
  const locked = shells.some((s) => s.type === 'red' && s.target === player);
  itemBoxEl.classList.toggle('locked', locked);
  if (locked) {
    lockBeepT -= dt;
    if (lockBeepT <= 0) { lockBeepT = 0.3; sound.lockBeep(); }
  } else lockBeepT = 0;
}
let lockBeepT = 0;

// ---------------- AI 用道具 ----------------
function aiUseItem(c, dt) {
  c.itemAiT -= dt;
  const id = c.items[0];
  let use = c.itemAiT < -8;   // 拿太久了就随便用掉
  if (c.itemAiT <= 0) {
    if (id === 'banana') use ||= racers.some((o) => o !== c && c.progress - o.progress > 0 && c.progress - o.progress < 30);
    else if (id === 'green') {
      const a = carAhead(c);
      if (a) {
        const gap = a.progress - c.progress;
        use ||= gap > 0 && gap < 60 && Math.abs(a.lat - c.lat) < 2.5;
      }
    } else if (id === 'red') use ||= racers.some((o) => o !== c && o.progress - c.progress > 0 && o.progress - c.progress < 160);
    else if (id === 'mushroom') use ||= Math.abs(T.k[T.wrap(c.idx + 20)]) < 1 / 200;
    else if (id === 'shield') use ||= shells.some((s) => s.target === c || (s.owner !== c && (s.x - c.x) ** 2 + (s.z - c.z) ** 2 < 900)) || racers.some((o) => o !== c && c.progress - o.progress > 0 && c.progress - o.progress < 15);
    else use = true;   // 闪电、无敌星：拿到就用
    // 最前面的道具暂时用不上、后面还有别的：换一下顺序
    if (!use && c.items.length > 1 && Math.random() < 0.3) { swapItems(c); c.itemAiT = rand(0.5, 1.5); return; }
  }
  if (use) useItem(c);
}

// 把最前面的道具换到最后
function swapItems(c) {
  if (c.items.length < 2) return;
  c.items.push(c.items.shift());
  if (c.isPlayer) { sound.tone({ frequency: 880, duration: 0.06, type: 'triangle', gain: 0.06 }); updateItemBox(); }
}

// ---------------- 界面 ----------------
// 道具框：大图标是马上能用的道具，下面一排小格是后面排着的（抽取中的格子在转）
const itemKey = (c) => `${c.items.join(',')}|${c.pending.length}`;
function updateItemBox() {
  const p = player;
  if (!p || !p.items) return;
  const ids = Object.keys(ITEMS);
  const roulette = ITEMS[ids[Math.floor(elapsed * 14) % ids.length]].icon;
  const first = p.items[0];
  itemBoxEl.dataset.key = itemKey(p);
  itemBoxEl.querySelector('.icon').textContent = first ? ITEMS[first].icon : p.pending.length ? roulette : '';
  itemBoxEl.querySelector('.label').textContent = first ? `${ITEMS[first].name} · X 使用${p.items.length > 1 ? ' · Z 换' : ''}` : p.pending.length ? '抽取中…' : '撞道具箱拿道具';
  const slots = [];
  for (let i = 1; i < ITEM_SLOTS; i++) {
    const id = p.items[i];
    const rolling = !id && i - p.items.length < p.pending.length && i >= p.items.length;
    slots.push(`<span class="slot${id || rolling ? ' on' : ''}">${id ? ITEMS[id].icon : rolling ? roulette : ''}</span>`);
  }
  itemBoxEl.querySelector('.queue').innerHTML = slots.join('');
  itemBoxEl.classList.toggle('has', !!first);
}
// 触屏：点道具框换道具
itemBoxEl.addEventListener('pointerdown', (e) => { if (player && isItems()) { e.preventDefault(); swapItems(player); } });

function itemHudHtml() {
  const p = player;
  const effects = [p.starT > 0 ? `⭐ 无敌 ${p.starT.toFixed(1)}s` : '', p.shieldT > 0 ? `🛡️ 护盾 ${p.shieldT.toFixed(1)}s` : '', p.zapT > 0 ? `⚡ 被闪电劈中 ${p.zapT.toFixed(1)}s` : '',
    shells.some((s) => s.type === 'red' && s.target === p) ? '<span class="bad">⚠️ 红壳锁定！</span>' : ''].filter(Boolean).join(' · ');
  return `<div class="row">🎯 击中 ${p.hitsGiven || 0} 次 · 💥 被击中 ${p.hitsTaken || 0} 次</div>${effects ? `<div class="combo">${effects}</div>` : ''}`;
}

/* ===== js/game/heli-mode.js ===== */
// 空中追捕：玩家扮演警察，驾驶警用直升机追捕一辆逃犯车。
// 方向键飞行（↑ 前进 ↓ 减速 ← → 转向），Q / E 升降，空格（或 X）投放钉刺带；地面上的红圈是钉刺带的预计落点。
// 逃犯压上钉刺带就会爆胎失控，被逼停 = 拦截成功；逃犯跑完全部圈数、或者钉刺带用光都没拦住 = 失败。
// 路上还有几辆普通车，钉刺带也会扎到它们。逃犯看到前方的钉刺带会试着绕开（难度越高越会躲）。
'use strict';

const HELI_SPIKES = 8;          // 钉刺带数量
const HELI_COOLDOWN = 1.8;      // 两次投放的间隔（秒）
const HELI_SPIKE_HALF = 0.72;   // 钉刺带半长 × 路面半宽（比警匪追逐里的长，好拦一些）
const DODGE_CHANCE = { easy: 0.3, normal: 0.55, hard: 0.8 };
const heliMode = { on: false, over: null, overT: 0, spikes: 0, cd: 0, drops: 0, dodged: 0, hitT: 0, alt: 30, suspect: null, marker: null, reticle: null };
const HELI_VIEWS = { chase: '追尾', first: '驾驶舱', free: '俯瞰' };
const hintEl = $('hint'), CAR_HINT = hintEl.innerHTML;
const HELI_HINT = '<kbd>↑</kbd> 前进 <kbd>↓</kbd> 减速 <kbd>←</kbd><kbd>→</kbd> 转向 <kbd>Q</kbd><kbd>E</kbd> 升 / 降 <kbd>空格</kbd> 投放钉刺带 <kbd>T</kbd> 切换视角（追尾 / 驾驶舱 / 俯瞰） <kbd>P</kbd> 暂停 <kbd>Tab</kbd> 地图 <kbd>Esc</kbd> 菜单';

// ---------------- 开局 / 清理 ----------------
function setupHeliMode() {
  clearHeliMode();
  heliMode.on = true;
  hintEl.innerHTML = HELI_HINT;
  if (!heli) heli = buildHeli();
  const npcs = racers.filter((c) => !c.isPlayer);
  const diff = DIFFICULTY[settings.difficulty];
  // 逃犯：跑在最前面，车技好、车速快；其余是路上的普通车
  const sus = npcs[0];
  Object.assign(sus, { name: '逃犯', css: '#ff2a2a', skill: diff.skill + 0.08, basePerf: diff.perf + 0.06, errRate: diff.err * 0.5, laneBias: 0 });
  sus.perf = sus.basePerf;
  sus.lapCount = 1; sus.maxLap = 1;
  placeRacer(sus, 70, 0);
  if (sus.tag) {   // 名字牌换成"逃犯"
    const y = sus.tag.position.y;
    disposeTree(sus.tag);
    sus.tag = nameTag('🚨 逃犯', '#ff2a2a');
    sus.tag.position.y = y;
    sus.root.add(sus.tag);
  }
  npcs.slice(1).forEach((c, i) => {
    Object.assign(c, { basePerf: rand(0.7, 0.8), skill: rand(0.75, 0.85), errRate: 0.2 });
    c.perf = c.basePerf;
    c.lapCount = 1; c.maxLap = 1;
    placeRacer(c, 230 + i * 190, rand(-0.5, 0.5) * T.W);
  });
  // 玩家的车不上场（藏起来，只用来记录直升机在地面上的位置：小地图、阴影、声音都跟着它）
  player.active = false;
  player.root.visible = false;
  player.lapCount = 1;
  heliMode.suspect = sus;
  Object.assign(heliMode, { over: null, overT: 0, spikes: HELI_SPIKES, cd: 0, drops: 0, dodged: 0, hitT: 0, alt: 30 });
  // 直升机从逃犯后方起飞
  const p = trackPoint(T, -30, 0);
  Object.assign(heli, { active: true, pilot: true, x: p.x, y: 30, z: p.z, vx: 0, vz: 0, heading: p.heading, yawRate: 0, pitchV: 0, rollV: 0 });
  heli.group.visible = true;
  heli.beam.visible = true;
  heli.spot.intensity = 5000;
  // 逃犯头上的红色倒三角，从天上一眼就能看到
  heliMode.marker = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.4, 3).rotateX(Math.PI), new THREE.MeshBasicMaterial({ color: 0xff2a2a, fog: false, depthTest: false, transparent: true }));
  heliMode.marker.renderOrder = 10;
  scene.add(heliMode.marker);
  // 地面上的落点准星
  const ring = new THREE.RingGeometry(1.6, 2.1, 32).rotateX(-Math.PI / 2);
  const cross = merge([[new THREE.PlaneGeometry(0.3, 5).rotateX(-Math.PI / 2), compose(v(0, 0, 0))], [new THREE.PlaneGeometry(5, 0.3).rotateX(-Math.PI / 2), compose(v(0, 0, 0))]]);
  const rmat = new THREE.MeshBasicMaterial({ color: 0xff3030, transparent: true, opacity: 0.9, depthWrite: false, depthTest: false, fog: false });
  heliMode.reticle = new THREE.Group();
  heliMode.reticle.add(new THREE.Mesh(ring, rmat), new THREE.Mesh(cross, rmat));
  heliMode.reticle.children.forEach((m) => { m.renderOrder = 11; });   // 画在最上层，不会被路面、车、机身挡住
  scene.add(heliMode.reticle);
  syncHeliPlayer();
}

function clearHeliMode() {
  if (!heliMode.on) return;
  heliMode.on = false;
  hintEl.innerHTML = CAR_HINT;
  if (heliMode.marker) { disposeTree(heliMode.marker); heliMode.marker = null; }
  if (heliMode.reticle) { disposeTree(heliMode.reticle); heliMode.reticle = null; }
  if (heli) heli.pilot = false;
  if (player) { player.active = true; player.root.visible = true; }
}

// 隐藏的玩家车跟着直升机在地面上的投影走
function syncHeliPlayer() {
  const p = player;
  p.x = heli.x; p.z = heli.z; p.heading = heli.heading;
  p.vx = heli.vx; p.vz = heli.vz;
  p.vF = Math.hypot(heli.vx, heli.vz);
  p.idx = projectNear(T, p.x, p.z, p.idx, 30);
  snapInterp(p);
}

// ---------------- 飞行 ----------------
function flyHeli(dt) {
  const live = raceState === 'racing';
  const up = live && (keys.has('ArrowUp') || keys.has('KeyW'));
  const down = live && (keys.has('ArrowDown') || keys.has('KeyS'));
  const turn = live ? (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0) - (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) : 0;
  const climb = live ? (keys.has('KeyQ') ? 1 : 0) - (keys.has('KeyE') ? 1 : 0) : 0;
  heli.yawRate += (turn * 1.3 - heli.yawRate) * Math.min(1, dt * 4);
  heli.heading += heli.yawRate * dt;
  const [fx, fz] = forwardOf(heli.heading);
  let vF = heli.vx * fx + heli.vz * fz, vS = heli.vx * fz - heli.vz * fx;
  const thr = up ? 1 : down ? -0.8 : 0;
  vF += thr * 30 * dt;
  vF *= Math.exp(-0.36 * dt);   // 极速约 300 km/h，比逃犯快一点
  vS *= Math.exp(-2.2 * dt);    // 侧滑很快消失，转弯跟手
  heli.vx = fx * vF + fz * vS;
  heli.vz = fz * vF - fx * vS;
  heli.x += heli.vx * dt;
  heli.z += heli.vz * dt;
  // 不能飞出地图太远
  const b = T.bounds, m = 420;
  heli.x = clamp(heli.x, b.x0 - m, b.x1 + m);
  heli.z = clamp(heli.z, b.z0 - m, b.z1 + m);
  heliMode.alt = clamp(heliMode.alt + climb * 14 * dt, 10, 90);
  heli.y += (heliMode.alt + Math.sin(elapsed * 0.9) * 0.4 - heli.y) * Math.min(1, dt * 2);
  heli.pitchV += (thr * 0.2 + clamp(vF / 400, 0, 0.12) - heli.pitchV) * Math.min(1, dt * 3);   // 前进时低头
  heli.rollV += (-turn * clamp(vF / 50, 0.2, 1) * 0.35 - heli.rollV) * Math.min(1, dt * 3);   // 转弯时侧倾
}

// 钉刺带的预计落点：从直升机当前位置带着直升机的水平速度自由落体
function heliDropPoint() {
  const g = 22, h = Math.max(1, heli.y - 1.5);
  const t = Math.sqrt((2 * h) / g);
  return { x: heli.x + heli.vx * t, z: heli.z + heli.vz * t, t };
}

function heliDrop() {
  if (!heliMode.on || raceState !== 'racing' || heliMode.over) return;
  if (heliMode.cd > 0) return;
  if (heliMode.spikes <= 0) { showMessage('钉刺带用完了', 1); return; }
  heliMode.spikes--;
  heliMode.drops++;
  heliMode.cd = HELI_COOLDOWN;
  dropSpikesFromAir(heli.x, heli.y - 1.5, heli.z, heli.vx, heli.vz, T.W * HELI_SPIKE_HALF);
  sound.whoosh();
}

// ---------------- 每帧 ----------------
function updateHeliMode(dt) {
  if (!heliMode.on) return;
  const sus = heliMode.suspect;
  if (raceState !== 'replay') {
    flyHeli(dt);
    syncHeliPlayer();
  }
  placeHeli(dt);
  // 逃犯头上的标记：离得远就画大一点
  const mk = heliMode.marker;
  mk.position.set(sus.root.position.x, sus.root.position.y + 5.5 + Math.sin(elapsed * 4) * 0.4, sus.root.position.z);
  mk.rotation.y = elapsed * 2;
  mk.scale.setScalar(1 + clamp(Math.hypot(heli.x - sus.x, heli.z - sus.z) / 150, 0, 2));
  if (raceState === 'replay') { heliMode.reticle.visible = false; return; }
  heliMode.cd = Math.max(0, heliMode.cd - dt);
  updateSpikes(dt);
  // 落点准星
  const dp = heliDropPoint(), ret = heliMode.reticle;
  const i = projectNear(T, dp.x, dp.z, player.idx, 40);
  const tc = trackCoords(T, dp.x, dp.z, i);
  ret.visible = raceState === 'racing' && !heliMode.over && heliMode.spikes > 0;
  ret.position.set(dp.x, (Math.abs(tc.lat) < T.B ? bankHeight(T, i, tc.lat) : 0) + 0.12, dp.z);
  ret.rotation.y = T.heading[i];
  // 横向拉长 = 钉刺带的覆盖宽度；离镜头远时整体放大，远处也看得清
  const k = clamp(camera.position.distanceTo(ret.position) / 40, 1, 4);
  ret.scale.set(Math.max(k, T.W * HELI_SPIKE_HALF / 2.1), 1, k);
  // 落点在逃犯前方的路上：准星变绿
  let ahead = tc.s - sus.s;
  if (ahead < -T.L / 2) ahead += T.L;
  const good = Math.abs(tc.lat) < T.B && ahead > 5 && ahead < 60 + sus.vF * 2.5;
  ret.children.forEach((m) => m.material.color.setHex(heliMode.cd > 0 ? 0xffb020 : good ? 0x30e060 : 0xff3030));

  if (raceState !== 'racing' && raceState !== 'done') return;
  if (!heliMode.over) {
    suspectDodge(sus, dt);
    // 逃犯被扎破轮胎后：失控、慢慢停下 → 拦截成功
    if (heliMode.hitT > 0) {
      heliMode.hitT += dt;
      if (heliMode.hitT > 2.5 || Math.hypot(sus.vx, sus.vz) < 3) endHeliMode('win');
    } else if (sus.finished) endHeliMode('lose', '逃犯跑完全程，逃脱了');
    else if (heliMode.spikes <= 0 && !spikes.length) endHeliMode('lose', '钉刺带用光了，没能拦住逃犯');
  } else {
    heliMode.overT += dt;
    if (heliMode.overT > 3.5 && !resultsShown) showResults();
  }
}

// 钉刺带扎到车了（police.js 的 updateSpikes 调用）
function onHeliSpikeHit(c) {
  if (!heliMode.on || heliMode.over) return;
  if (c === heliMode.suspect) {
    if (heliMode.hitT > 0) return;
    heliMode.hitT = 0.001;
    c.flatT = 999;
    c.basePerf = c.perf = 0.3;
    spinOut(c, 16);
    c.vx *= 0.55; c.vz *= 0.55;
    shake = Math.max(shake, 0.4);
    sound.pop();
    showMessage('💥 逃犯压上钉刺带，爆胎了！', 2);
  } else {
    showMessage(`😬 误伤：${c.name} 的轮胎被扎破了`, 1.5);
  }
}

function endHeliMode(result, why = '') {
  heliMode.over = result;
  heliMode.overT = 0;
  raceState = 'done';
  finishWait = 0;
  if (result === 'win') {
    sound.fanfare();
    sound.cheer(1.2);
    showMessage(`<div class="huge">🚨</div>拦截成功！<small>用时 ${formatTime(raceTime)} · 投放钉刺带 ${heliMode.drops} 条</small>`, 3.5);
  } else {
    sound.busted();
    showMessage(`<div class="huge">💨</div>追捕失败<small>${why}</small>`, 3.5);
  }
}

// 逃犯躲钉刺带：看到前方路上的钉刺带时，按难度决定会不会发现、往哪边绕
function suspectDodge(c, dt) {
  if (c.state !== 'drive') return;
  for (const sp of spikes) {
    if (sp.falling || sp.seen?.has(c)) continue;
    let d = sp.s - c.s;
    if (d < -T.L / 2) d += T.L;
    if (d < 0 || d > 18 + c.vF * 1.1) continue;
    (sp.seen ??= new Set()).add(c);
    const overlap = Math.abs(c.lat - sp.lat) < sp.half + 1.4;
    if (!overlap || Math.random() > DODGE_CHANCE[settings.difficulty]) continue;
    // 往空间大的一边绕，可以开到缓冲区里去
    const lim = T.W + 4;
    const left = sp.lat + sp.half + 2.2, right = sp.lat - sp.half - 2.2;
    const opts = [left, right].filter((x) => Math.abs(x) < lim);
    if (!opts.length) continue;
    c.dodgeLat = opts.reduce((a, b) => (Math.abs(a - c.lat) < Math.abs(b - c.lat) ? a : b));
    c.dodgeT = d / Math.max(c.vF, 5) + 0.7;
    heliMode.dodged++;
  }
}

// ---------------- 镜头 ----------------
function updateHeliCamera(dt, mode) {
  const [fx, fz] = forwardOf(heli.heading);
  let fov;
  if (mode === 'first') {
    // 驾驶舱：机头往前下方看
    camera.position.set(heli.x + fx * 2.6, heli.y - 0.2, heli.z + fz * 2.6);
    camera.rotation.set(-0.42, heli.heading + Math.PI, -heli.rollV * 0.6, 'YXZ');
    fov = 70;
  } else if (mode === 'free') {
    // 俯瞰：高空往下看，画面上方 = 直升机前方，能看到周围一大片
    const h = 150 + heliMode.alt;
    camera.position.set(heli.x + fx * 25, heli.y + h, heli.z + fz * 25);
    camera.up.set(fx, 0, fz);
    camera.lookAt(heli.x + fx * 25, 0, heli.z + fz * 25);
    camera.up.set(0, 1, 0);
    fov = 55;
  } else {
    // 追尾：在直升机后上方，看向前下方的路面
    camHeading += wrapAngle(heli.heading - camHeading) * Math.min(1, dt * 3);
    const [cx, cz] = forwardOf(camHeading);
    camera.position.set(heli.x - cx * 24, heli.y + 12, heli.z - cz * 24);
    // 看向钉刺带的落点附近，准星不会被机身挡住
    const dp = heliDropPoint();
    lookTarget.set(lerp(heli.x + cx * 20, dp.x, 0.7), Math.max(0, heli.y - 22), lerp(heli.z + cz * 20, dp.z, 0.7));
    camera.lookAt(lookTarget);
    fov = 62 + Math.min(Math.hypot(heli.vx, heli.vz) / 80, 1) * 10;
  }
  camFov += (fov - camFov) * Math.min(1, dt * 3);
  if (Math.abs(camera.fov - camFov) > 0.05) { camera.fov = camFov; camera.updateProjectionMatrix(); }
  shake = Math.max(0, shake - dt * 1.5);
  if (shake > 0.01) camera.position.add(v(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * 0.2));
}

// 键盘和触屏按键
'use strict';

// =====================================================================
// 输入：键盘 + 触屏按键
// =====================================================================
const keys = new Set();
const HANDLED = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyT', 'KeyR', 'KeyC', 'KeyP', 'KeyM', 'KeyB', 'KeyN', 'KeyV', 'Tab', 'KeyX', 'Escape', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyZ'];
const menu = $('menu');
const dialog = menu.querySelector('.dialog');
let menuKind = null;

addEventListener('keydown', (e) => {
  if (!HANDLED.includes(e.code)) return;
  if (menuKind && menuKind !== 'pause' && e.code !== 'Escape') return;
  e.preventDefault();
  sound.init();
  keys.add(e.code);
  if (!e.repeat) press(e.code);
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

function press(code) {
  if (raceState === 'replay') return replayKey(code);
  const live = raceState === 'racing' || raceState === 'countdown' || raceState === 'done';
  if (worldMapOpen && (code === 'Tab' || code === 'Escape')) return toggleWorldMap(false);
  if (code === 'Escape') {
    if (menuKind === 'pause') return resume();
    if (live && !menuKind) return openPauseMenu();
    return;
  }
  if (code === 'KeyM') return toggleSound();
  if (code === 'KeyB') return toggleMusic();
  if (code === 'KeyN') return nextSong();
  if (code === 'KeyV') return toggleMirror();
  if (!live || menuKind) return;
  if (code === 'Tab') return toggleWorldMap(true);
  if (code === 'KeyP') return togglePause();
  if (paused) return;
  if (isHeliMode()) {   // 空中追捕：空格 / X 投放钉刺带，其余车辆按键不起作用
    if (code === 'Space' || code === 'KeyX') return heliDrop();
    if (code === 'KeyT') return toggleView();
    return;
  }
  if (code === 'ArrowUp' || code === 'KeyW') onThrottlePress();   // 起步加速 / 小喷都看按下的那一瞬间
  if (code === 'KeyT') return toggleView();
  if (code === 'KeyR' && raceState === 'racing') {
    if (player.state === 'crash' && player.crashT < 0.5) return;
    if (player.state !== 'crash' && player.ghost > 0) return;
    if (worldMode === 'open') resetToRoad(player); else resetToTrack(player);
    hideMessage();
    return;
  }
  if (code === 'KeyX' && raceState === 'racing' && isItems() && !player.finished) return useItem(player);
  if (code === 'KeyZ' && raceState === 'racing' && isItems() && !player.finished) return swapItems(player);
  if (code === 'KeyC' && raceState === 'racing' && !player.finished) {
    if (!useNitro(player)) {
      const fill = $('nitroFill');
      fill.parentElement.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 200 });
    } else {
      shake = Math.max(shake, 0.35);
    }
  }
}

const IS_TOUCH = MOBILE_GPU || (navigator.maxTouchPoints > 0 && !matchMedia('(pointer: fine)').matches);
if (IS_TOUCH) document.body.classList.add('touch');
const touchHeld = new Map();
for (const btn of document.querySelectorAll('#touch button')) {
  const code = btn.dataset.key;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sound.init();
    btn.setPointerCapture(e.pointerId);
    touchHeld.set(e.pointerId, code);
    keys.add(code);
    btn.classList.add('on');
    press(code);
  });
  const release = (e) => {
    if (touchHeld.get(e.pointerId) !== code) return;
    touchHeld.delete(e.pointerId);
    if (![...touchHeld.values()].includes(code)) keys.delete(code);
    btn.classList.remove('on');
  };
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}

function readPlayerControls() {
  const ctl = player.ctl;
  const left = keys.has('ArrowLeft') || keys.has('KeyA');
  const right = keys.has('ArrowRight') || keys.has('KeyD');
  ctl.steer = (left ? 1 : 0) - (right ? 1 : 0);
  ctl.throttle = keys.has('ArrowUp') || keys.has('KeyW');
  ctl.reverse = keys.has('ArrowDown') || keys.has('KeyS');
  ctl.brake = keys.has('Space');
}

function trackPreview(def, w = 96, h = 64) {
  const data = buildTrackData(def);
  const canvas = document.createElement('canvas');
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
  const g = canvas.getContext('2d');
  g.scale(dpr, dpr);
  const b = data.bounds;
  const sc = Math.min((w - 10) / (b.x1 - b.x0), (h - 10) / (b.z1 - b.z0));
  const ox = (w - (b.x1 - b.x0) * sc) / 2, oz = (h - (b.z1 - b.z0) * sc) / 2;
  g.lineWidth = 4; g.lineJoin = 'round'; g.strokeStyle = '#34495e';
  g.beginPath();
  for (let i = 0; i <= data.N; i += 3) {
    const k = i % data.N;
    const x = ox + (data.px[k] - b.x0) * sc, y = oz + (data.pz[k] - b.z0) * sc;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath(); g.stroke();
  g.fillStyle = '#d8452a';
  g.beginPath(); g.arc(ox + (data.px[0] - b.x0) * sc, oz + (data.pz[0] - b.z0) * sc, 3.5, 0, Math.PI * 2); g.fill();
  return { canvas, length: data.L };
}

  T = regionTracks[oldT.def.id];
  const ox = T.px[0] - oldT.px[0], oz = T.pz[0] - oldT.pz[0];
  for (const c of racers) {
    c.x += ox;
    c.z += oz;
    c.skidLast = null;
    c.idx = projectGlobal(T, c.x, c.z);
    const tc = trackCoords(T, c.x, c.z, c.idx);
    c.s = tc.s;
    c.lat = tc.lat;
  }
  clearSkids();
  drawMinimapBase();
  setView(viewMode);
  applyBlendedTheme(player.x, player.z, true);
  raceState = 'racing';
  for (const c of racers) {
    c.finished = false;
    if (!c.isPlayer) {
      c.basePerf = c.perf = rand(0.72, 0.92);
      c.skill = rand(0.72, 0.86);
    }
  }
  player.perf = player.skill = 1;
  player.lapStart = raceTime;
  $('board').style.display = 'none';
  showMessage('🚗 继续自由驾驶<small>随便开，其他鹈鹕也在兜风 · 按 Esc 打开菜单</small>', 3);
}

/* ===== js/game/camera.js ===== */
// 视角：追车 / 鹈鹕视角 / 自由环绕
'use strict';

// =====================================================================
// 视角：追车（第三人称）/ 鹈鹕视角（第一人称）/ 自由环绕
// =====================================================================
let viewMode = 'chase';
const VIEW_NAMES = { chase: '追车', first: '鹈鹕视角', free: '自由' };
let camHeading = 0, camFov = 62, camDistLag = 0, camY = 0;
const lastCarPos = new THREE.Vector3();
const FP_EYE = v(0, 0.09, 0.05);

function setView(mode) {
  viewMode = mode;
  controls.enabled = mode === 'free' && !isHeliMode();
  $('view').textContent = `视角：${(isHeliMode() ? HELI_VIEWS : VIEW_NAMES)[mode]}`;
  if (!player) return;
  applyCockpitVisibility();
  camHeading = player.heading;
  if (mode === 'free' && !isHeliMode()) {
    const p = player.root.position;
    const [fx, fz] = forwardOf(player.heading);
    camera.position.set(p.x - fx * 9 + fz * 4, 4, p.z - fz * 9 - fx * 4);
    controls.target.set(p.x, 1, p.z);
    controls.update();
  }
  lastCarPos.copy(player.root.position);
  camY = player.root.position.y;
}
// 第一人称时隐藏自己的冠羽和方向盘（离眼睛太近会挡住视线）
function applyCockpitVisibility() {
  const mode = raceState === 'replay' ? replay.cam : viewMode;
  const focus = focusCar();
  for (const c of racers) {
    const hide = mode === 'first' && c === focus;
    c.pel.crest.visible = !hide;
    c.swPivot.visible = !hide;
  }
  camera.near = mode === 'first' ? 0.03 : 0.1;
  camera.updateProjectionMatrix();
}
const focusCar = () => (raceState === 'replay' ? racers[replay.focus] : player);

function toggleView() {
  if (raceState === 'replay') return cycleReplayCam();
  setView({ chase: 'first', first: 'free', free: 'chase' }[viewMode]);
  if (raceState === 'racing') showMessage(`视角：${(isHeliMode() ? HELI_VIEWS : VIEW_NAMES)[viewMode]}`, 1);
}

const lookTarget = new THREE.Vector3();
function updateCamera(dt) {
  const c = focusCar();
  const mode = raceState === 'replay' ? replay.cam : viewMode;
  const p = c.root.position;
  const speed = Math.abs(c.vF);
  const boost = c.nitroTime > 0 ? 1 : 0;

  if (raceState === 'menu') {
    const a = elapsed * 0.25;
    camera.position.set(p.x + Math.sin(a) * 7.5, 2.4 + Math.sin(elapsed * 0.4) * 0.5, p.z + Math.cos(a) * 7.5);
    camera.lookAt(p.x, 0.8, p.z);
    if (camera.fov !== 50) { camera.fov = 50; camera.updateProjectionMatrix(); }
    lastCarPos.copy(p);
    return;
  }

  if (isHeliMode() && heli && raceState !== 'replay') {
    updateHeliCamera(dt, mode);
    lastCarPos.copy(p);
    return;
  }
  if (mode === 'tv') {
    updateTvCamera(c, dt);
  } else if (mode === 'chase') {
    const followRate = c.state === 'drive' ? 5 : 1.5;
    const aim = c.state === 'drive' && c.vF > 5 ? c.heading + wrapAngle(Math.atan2(c.vx, c.vz) - c.heading) * 0.55 : c.heading;
    camHeading += wrapAngle(aim - camHeading) * Math.min(1, dt * followRate);
    camDistLag += (clamp(c.accel * 0.05, -0.8, 1.2) - camDistLag) * Math.min(1, dt * 3);
    const d = c.built.camD + speed * 0.015 + camDistLag;
    const [fx, fz] = forwardOf(camHeading);
    // 高度跟着车走（上跳台、飞跃、弯道倾角），稍微滞后一点，落地时镜头不会猛地一沉
    camY += (p.y - camY) * Math.min(1, dt * (p.y > camY ? 8 : 5));
    camera.position.set(p.x - fx * d, camY + c.built.camH + speed * 0.004, p.z - fz * d);
    lookTarget.set(p.x + fx * 4, camY + 1.0, p.z + fz * 4);
    camera.lookAt(lookTarget);
    const fov = 60 + Math.min(speed / 90, 1) * 14 + boost * 10;
    camFov += (fov - camFov) * Math.min(1, dt * 3);
  } else if (mode === 'first') {
    c.pel.head.updateWorldMatrix(true, false);
    camera.position.copy(c.pel.head.localToWorld(FP_EYE.clone()));
    camHeading += wrapAngle(c.heading + c.pel.headYaw * 0.6 - camHeading) * Math.min(1, dt * 10);
    camera.rotation.set(-0.1 + c.pitch, camHeading + Math.PI, -c.roll * 1.5, 'YXZ');
    const fov = 72 + Math.min(speed / 90, 1) * 12 + boost * 10;
    camFov += (fov - camFov) * Math.min(1, dt * 3);
  } else {
    camera.position.add(lastCarPos.clone().sub(p).negate());
    controls.target.set(p.x, 1, p.z);
    controls.update();
    camFov += (55 - camFov) * Math.min(1, dt * 3);
  }
  lastCarPos.copy(p);
  if (Math.abs(camera.fov - camFov) > 0.05) {
    camera.fov = camFov;
    camera.updateProjectionMatrix();
  }
  // 撞击 / 氮气时镜头抖动
  shake = Math.max(boost * 0.12, shake - dt * 1.5);
  if (shake > 0.01) camera.position.add(v(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * 0.15));
}

/* ===== js/ui/minimap.js ===== */
// 小地图和全景地图
// 小地图：名次赛显示整条赛道；开放世界只显示当前所在的地图，其他地图在边缘用箭头指示方向
// 全景地图：点击小地图或按 Tab 打开，显示所有地图、公路和车辆位置（打开时游戏暂停）
'use strict';

const mapCanvas = document.querySelector('#minimap canvas');
const mapCtx = mapCanvas.getContext('2d');
const mapBase = document.createElement('canvas');
const MAP_SIZE = 190;
let mapScale = 1, mapOx = 0, mapOz = 0, mapW = 0, mapH = 0, mapB = null, mapRegion = null;
const toMap = (x, z) => [mapOx + (x - mapB.x0) * mapScale, mapOz + (z - mapB.z0) * mapScale];

const allRoads = () => (worldMode === 'open' ? [...Object.values(regionTracks), ...links] : [T]);
const padBounds = (b, p) => ({ x0: b.x0 - p, x1: b.x1 + p, z0: b.z0 - p, z1: b.z1 + p });
function unionBounds(roads) {
  return roads.reduce((b, R) => ({ x0: Math.min(b.x0, R.bounds.x0), x1: Math.max(b.x1, R.bounds.x1), z0: Math.min(b.z0, R.bounds.z0), z1: Math.max(b.z1, R.bounds.z1) }),
    { x0: Infinity, x1: -Infinity, z0: Infinity, z1: -Infinity });
}

// 画道路（赛道白色、连接公路淡黄）和起终点
function drawRoads(g, roads, toXY, trackW, linkW) {
  g.lineJoin = 'round';
  g.lineCap = 'round';
  for (const R of roads) {
    const path = new Path2D();
    const last = R.open ? R.N - 1 : R.N;
    for (let i = 0; i <= last; i += 2) {
      const [x, y] = toXY(R.px[i % R.N], R.pz[i % R.N]);
      if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
    }
    if (!R.open) path.closePath();
    const w = R.open ? linkW : trackW;
    g.strokeStyle = '#1d304055'; g.lineWidth = w; g.stroke(path);
    g.strokeStyle = R.open ? '#f7e6a0' : '#ffffff'; g.lineWidth = Math.max(1, w - 3); g.stroke(path);
  }
  for (const R of roads) {
    if (R.open) continue;
    const [sx, sy] = toXY(R.px[0], R.pz[0]);
    g.save();
    g.translate(sx, sy);
    g.rotate(Math.atan2(R.nz[0], R.nx[0]));
    g.fillStyle = '#111'; g.fillRect(-6, -2, 12, 4);
    g.fillStyle = '#fff'; for (let k = -6; k < 6; k += 4) g.fillRect(k, -2, 2, 2), g.fillRect(k + 2, 0, 2, 2);
    g.restore();
  }
}

// 画车辆、警车、直升机、钉刺带
function drawMarkers(g, toXY, big = 1) {
  for (const sp of spikes) {
    const [x, y] = toXY(sp.x, sp.z);
    g.fillStyle = '#111';
    g.fillRect(x - 3 * big, y - 1.5 * big, 6 * big, 3 * big);
  }
  const flash = Math.floor(elapsed * 5) % 2;
  for (const c of activeCops()) {
    const [x, y] = toXY(c.x, c.z);
    g.fillStyle = flash ? '#ff2a2a' : '#2a6cff';
    g.strokeStyle = '#fff';
    g.lineWidth = 1.5;
    g.beginPath();
    g.rect(x - 4 * big, y - 4 * big, 8 * big, 8 * big);
    g.fill(); g.stroke();
  }
  for (const c of [...racers].sort((a) => (a.isPlayer ? 1 : -1))) {
    const [x, y] = toXY(c.x, c.z);
    if (c.isPlayer) {
      // 自己：外圈闪动光环 + 大箭头 + "你"
      const k = big * 1.7, pulse = 0.5 + 0.5 * Math.sin(elapsed * 6);
      g.fillStyle = `rgba(216, 69, 42, ${0.18 + 0.2 * pulse})`;
      g.beginPath(); g.arc(x, y, (9 + 3 * pulse) * k, 0, Math.PI * 2); g.fill();
      const [fx, fz] = forwardOf(c.heading);
      g.fillStyle = '#d8452a';
      g.strokeStyle = '#fff';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(x + fx * 8 * k, y + fz * 8 * k);
      g.lineTo(x - fx * 5 * k + fz * 5.5 * k, y - fz * 5 * k - fx * 5.5 * k);
      g.lineTo(x - fx * 2 * k, y - fz * 2 * k);
      g.lineTo(x - fx * 5 * k - fz * 5.5 * k, y - fz * 5 * k + fx * 5.5 * k);
      g.closePath();
      g.fill(); g.stroke();
      g.font = `bold ${Math.round(10 * big)}px "PingFang SC", sans-serif`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.lineWidth = 3;
      g.strokeStyle = '#ffffff';
      g.strokeText('你', x, y - 15 * k);
      g.fillStyle = '#d8452a';
      g.fillText('你', x, y - 15 * k);
    } else {
      g.fillStyle = c.css;
      g.strokeStyle = '#fff';
      g.lineWidth = 1.5;
      g.beginPath();
      g.arc(x, y, 3.5 * big, 0, Math.PI * 2);
      g.fill(); g.stroke();
    }
  }
  if (heli?.active) {
    const [x, y] = toXY(heli.x, heli.z);
    g.font = `${Math.round(14 * big)}px sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('🚁', x, y);
  }
}

// ---------------- 小地图 ----------------
function drawMinimapBase() {
  let b;
  if (worldMode === 'open') {
    mapRegion = nearestRegion(player?.x ?? 0, player?.z ?? 0);
    b = padBounds(regionTracks[mapRegion].bounds, 110);
    // 补成接近正方形，边缘才有地方放其他地图的方向箭头
    const w = b.x1 - b.x0, h = b.z1 - b.z0, side = Math.max(w, h * 1.1);
    const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
    b = { x0: cx - side / 2, x1: cx + side / 2, z0: cz - side * 0.42, z1: cz + side * 0.42 };
  } else {
    mapRegion = null;
    b = unionBounds([T]);
  }
  mapB = b;
  const pad = 12;
  mapScale = Math.min((MAP_SIZE - pad * 2) / (b.x1 - b.x0), (MAP_SIZE - pad * 2) / (b.z1 - b.z0));
  mapW = Math.round((b.x1 - b.x0) * mapScale + pad * 2);
  mapH = Math.round((b.z1 - b.z0) * mapScale + pad * 2);
  mapOx = pad; mapOz = pad;
  const dpr = Math.min(devicePixelRatio, 2);
  for (const cv of [mapCanvas, mapBase]) { cv.width = mapW * dpr; cv.height = mapH * dpr; }
  mapCanvas.style.width = `${mapW}px`;
  mapCanvas.style.height = `${mapH}px`;
  const g = mapBase.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, mapW, mapH);
  // 开放世界：所有道路都画上（超出范围的部分自然被裁掉，能看到公路从哪里驶出本地图）
  drawRoads(g, allRoads(), toMap, worldMode === 'open' ? 7 : 9, 5);
  if (worldMode === 'open') {
    g.font = 'bold 11px "PingFang SC", sans-serif';
    g.textAlign = 'left';
    g.fillStyle = '#1d3040c0';
    g.fillText(TRACK_BY_ID[mapRegion].name, 6, 14);
  }
}

function drawMinimap() {
  if (worldMode === 'open' && player && nearestRegion(player.x, player.z) !== mapRegion) drawMinimapBase();
  const dpr = Math.min(devicePixelRatio, 2);
  mapCtx.setTransform(1, 0, 0, 1, 0, 0);
  mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
  mapCtx.drawImage(mapBase, 0, 0);
  mapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawMarkers(mapCtx, toMap);
  if (worldMode === 'open') drawRegionArrows();
}

// 其他地图：从玩家位置指向那张地图的方向，箭头贴在小地图边缘，标签放在箭头内侧
function drawRegionArrows() {
  const [px, py] = toMap(player.x, player.z);
  const inset = 10;
  mapCtx.font = 'bold 10px "PingFang SC", sans-serif';
  mapCtx.textBaseline = 'middle';
  const items = [];
  for (const [id, [rx, rz]] of Object.entries(REGION_POS)) {
    if (id === mapRegion) continue;
    const dx = rx - player.x, dz = rz - player.z, len = Math.hypot(dx, dz);
    if (len < 1) continue;
    const ux = dx / len, uz = dz / len;
    const cx = clamp(px, inset, mapW - inset), cy = clamp(py, inset, mapH - inset);
    const tx = ux > 0 ? (mapW - inset - cx) / ux : ux < 0 ? (inset - cx) / ux : Infinity;
    const ty = uz > 0 ? (mapH - inset - cy) / uz : uz < 0 ? (inset - cy) / uz : Infinity;
    const t = Math.min(tx, ty);
    const x = cx + ux * t, y = cy + uz * t;
    const label = `${TRACK_BY_ID[id].name.slice(0, 2)} ${(len / 1000).toFixed(1)}km`;
    const w = mapCtx.measureText(label).width + 4;
    // 箭头在左右边：标签放在箭头内侧同一高度；在上下边：标签放在箭头内侧、水平居中
    let lx, ly;
    if (tx < ty) { lx = ux < 0 ? x + 9 : x - 9 - w; ly = y; }
    else { lx = x - w / 2; ly = uz < 0 ? y + 13 : y - 13; }
    lx = clamp(lx, 2, mapW - w - 2);
    ly = clamp(ly, 8, mapH - 8);
    items.push({ x, y, ux, uz, label, w, lx, ly });
  }
  // 标签互相重叠时上下错开
  const placed = [];
  for (const it of items) {
    const hit = () => placed.some((r) => it.lx < r.lx + r.w + 2 && r.lx < it.lx + it.w + 2 && Math.abs(r.ly - it.ly) < 14);
    for (let k = 0, dir = it.ly > mapH / 2 ? -1 : 1; k < 10 && hit(); k++) {
      it.ly += dir * 15;
      if (it.ly < 8 || it.ly > mapH - 8) { dir = -dir; it.ly = clamp(it.ly, 8, mapH - 8); }
    }
    placed.push(it);
  }
  for (const it of items) {
    mapCtx.save();
    mapCtx.translate(it.x, it.y);
    mapCtx.rotate(Math.atan2(it.uz, it.ux));
    mapCtx.fillStyle = '#1d6f8f';
    mapCtx.strokeStyle = '#fff';
    mapCtx.lineWidth = 1.5;
    mapCtx.beginPath();
    mapCtx.moveTo(7, 0); mapCtx.lineTo(-5, -5.5); mapCtx.lineTo(-2, 0); mapCtx.lineTo(-5, 5.5);
    mapCtx.closePath();
    mapCtx.fill(); mapCtx.stroke();
    mapCtx.restore();
  }
  for (const it of items) {
    mapCtx.fillStyle = '#ffffffd8';
    mapCtx.fillRect(it.lx, it.ly - 7, it.w, 14);
    mapCtx.fillStyle = '#1d3040';
    mapCtx.textAlign = 'left';
    mapCtx.fillText(it.label, it.lx + 2, it.ly);
  }
}

// ---------------- 全景地图 ----------------
const worldMapEl = $('worldMap');
const worldMapCanvas = worldMapEl.querySelector('canvas');
let worldMapOpen = false;

function toggleWorldMap(force) {
  const open = force ?? !worldMapOpen;
  if (open && (raceState === 'menu' || raceState === 'replay' || menuKind)) return;
  worldMapOpen = open;
  worldMapEl.style.display = open ? 'flex' : 'none';
  keys.clear();
  if (open) drawWorldMap();
}
worldMapEl.addEventListener('click', () => toggleWorldMap(false));
$('minimap').addEventListener('click', () => toggleWorldMap(true));

function drawWorldMap() {
  const w = Math.min(innerWidth * 0.9, 1100), h = Math.min(innerHeight * 0.78, 760);
  const dpr = Math.min(devicePixelRatio, 2);
  if (worldMapCanvas.width !== Math.round(w * dpr)) {
    worldMapCanvas.width = Math.round(w * dpr);
    worldMapCanvas.height = Math.round(h * dpr);
    worldMapCanvas.style.width = `${w}px`;
    worldMapCanvas.style.height = `${h}px`;
  }
  const roads = allRoads();
  const b = padBounds(unionBounds(roads), 120);
  const scale = Math.min(w / (b.x1 - b.x0), h / (b.z1 - b.z0));
  const ox = (w - (b.x1 - b.x0) * scale) / 2, oz = (h - (b.z1 - b.z0) * scale) / 2;
  const toXY = (x, z) => [ox + (x - b.x0) * scale, oz + (z - b.z0) * scale];
  const g = worldMapCanvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  // 开放世界：每片区域画一块底色
  if (worldMode === 'open') {
    for (const [id, R] of Object.entries(regionTracks)) {
      const [x, y] = toXY(R.center.x, R.center.z);
      const grad = g.createRadialGradient(x, y, 0, x, y, 520 * scale);
      grad.addColorStop(0, THEMES[TRACK_BY_ID[id].theme].ground[0] + 'cc');
      grad.addColorStop(1, THEMES[TRACK_BY_ID[id].theme].ground[0] + '00');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
    }
  }
  drawRoads(g, roads, toXY, 9, 6);
  if (worldMode === 'open') {
    g.font = 'bold 15px "PingFang SC", sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const R of Object.values(regionTracks)) {
      const [x, y] = toXY(R.center.x, R.center.z);
      g.fillStyle = '#ffffffd8';
      const tw = g.measureText(R.def.name).width;
      g.fillRect(x - tw / 2 - 6, y - 12, tw + 12, 24);
      g.fillStyle = '#1d3040';
      g.fillText(R.def.name, x, y);
    }
  }
  drawMarkers(g, toXY, 1.5);
}
