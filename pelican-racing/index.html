// 比赛信息、排行榜、速度表、挡位、氮气
'use strict';

// =====================================================================
// HUD
// =====================================================================
const raceHudMain = document.querySelector('#raceHud .main');
const raceHudSub = document.querySelector('#raceHud .sub');
const board = $('board');
const nitroFill = $('nitroFill');
const nitroText = $('nitroText');
let hudTimer = 0;

function gearInfo(c) {
  const vmax = c.spec.vmax / 3.6;
  const spd = Math.abs(c.vF);
  if (raceState === 'countdown') return { gear: 'N', rpm: c.ctl.throttle ? 0.75 + Math.sin(elapsed * 30) * 0.05 : 0.08 };
  if (c.vF < -0.5) return { gear: 'R', rpm: Math.min(1, spd / 13) };
  if (spd < 0.5 && !c.ctl.throttle) return { gear: 'N', rpm: 0.06 };
  const tops = [0.16, 0.3, 0.45, 0.6, 0.76, 0.9, 1.3];
  let g = tops.findIndex((t) => spd < t * vmax);
  if (g < 0) g = tops.length - 1;
  const lo = g ? tops[g - 1] * vmax : 0, hi = tops[g] * vmax;
  return { gear: String(g + 1), rpm: clamp(0.3 + 0.7 * ((spd - lo) / (hi - lo)), 0, 1) };
}

function updateHud(dt) {
  const c = player;
  const gi = gearInfo(c);
  if (raceState === 'menu' || raceState === 'replay') return;

  hudTimer -= dt;
  if (hudTimer > 0) return;
  hudTimer = 0.1;
  $('kmh').textContent = Math.round(Math.abs(c.vF) * 3.6);
  $('gear').textContent = gi.gear;
  nitroFill.style.width = `${(c.nitroTime > 0 ? c.nitroTime / NITRO_BURN : c.nitroCharge) * 100}%`;
  nitroFill.className = c.nitroTime > 0 ? 'burn' : c.nitroCharge >= 1 ? 'ready' : '';
  // 小喷窗口打开时提示按 ↑；漂移中显示漂移时间；飞在空中显示滞空时间
  const dt_ = $('driftText');
  dt_.classList.toggle('turbo', c.mtT > 0);
  dt_.textContent = c.mtT > 0 ? `⬆ 按 ↑ ${c.mtKind === 'land' ? '落地喷' : '小喷'}！`
    : c.turboT > 0 ? '💨 加速中'
    : c.air ? `🛫 飞跃中 ${c.airT.toFixed(1)} 秒`
    : c.drift > 0.5 ? `🌀 漂移中 ${c.driftTime.toFixed(1)} 秒` : '';
  nitroText.textContent = c.nitroTime > 0 ? '🔥 氮气喷射中！'
    : c.nitroCharge >= 1 ? '⚡ 氮气就绪 · 按 C 释放'
    : `氮气充能中 ${Math.floor(c.nitroCharge * 100)}%（${Math.ceil((1 - c.nitroCharge) * NITRO_CHARGE)} 秒）`;

  if (isFree()) {
    const region = worldMode === 'open' ? TRACK_BY_ID[nearestRegion(c.x, c.z)].name : T.def.name;
    const onLink = worldMode === 'open' && c.road?.open ? ` · 🛣 ${c.road.from.name} ⇄ ${c.road.to.name} 公路` : '';
    raceHudMain.innerHTML = `🚗 自由驾驶 · ${region} · ${formatTime(raceTime)}`;
    raceHudSub.textContent = `第 ${Math.max(1, c.lapCount)} 圈 · 本圈 ${formatTime(raceTime - c.lapStart)} · 最快单圈 ${formatTime(c.bestLap)}${onLink}`;
    return;
  }
  if (isHeliMode()) return heliHud();
  if (isPursuit()) updatePursuitHud();
  if (isItems() || isSolo()) updateModeHud(0.1);
  const order = standings();
  const pos = order.indexOf(c) + 1;
  const laps = settings.laps;
  const lapNow = clamp(c.lapCount, 1, laps);
  const clock = formatTime(c.finished ? c.finishTime : raceTime);
  if (isTimeTrial()) raceHudMain.innerHTML = `⏱ 计时赛 · 第 ${lapNow}/${laps} 圈 · ${clock}`;
  else if (isDrift()) raceHudMain.innerHTML = `🌀 漂移赛 · 第 ${lapNow}/${laps} 圈 · <b>${drift.total.toLocaleString()}</b> 分`;
  else raceHudMain.innerHTML = `第 <b>${pos}</b>/${racers.length} 名 · 第 ${lapNow}/${laps} 圈 · ${clock}`;
  raceHudSub.textContent = `本圈 ${formatTime(c.finished ? c.lapTimes[c.lapTimes.length - 1] : raceTime - c.lapStart)} · 最快单圈 ${formatTime(c.bestLap)}`;

  const leader = order[0];
  board.innerHTML = order.map((r, i) => {
    let gap = '';
    if (r.finished) gap = formatTime(r.finishTime);
    else if (i > 0 && raceTime > 1) {
      const avg = Math.max(15, (r.progress + 30) / raceTime);
      const behind = (leader.finished ? settings.laps * T.L : leader.progress) - r.progress;
      gap = behind > T.L ? `+${Math.floor(behind / T.L)} 圈` : `+${(behind / avg).toFixed(1)}s`;
    }
    return `<div class="${r.isPlayer ? 'me' : ''}"><span>${i + 1}</span><span class="dot" style="background:${r.isPlayer ? '#d8452a' : r.css}"></span>${r.isPlayer ? '你' : r.name} ${CAR_BY_ID[r.carId].icon}<span class="gap">${gap}</span></div>`;
  }).join('');
}

// 警匪追逐：热度、出动的警车、直升机、被捕进度
function updatePursuitHud() {
  const el = $('pursuitHud');
  const n = activeCops().length;
  const near = activeCops().some((c) => Math.hypot(c.x - player.x, c.z - player.z) < 60);
  const state = pursuit.busted ? '🚓 被捕' : pursuit.bust > 0.05 ? '⚠️ 快被抓住了！加速甩开警车' : near ? '警车就在附近' : '🟢 暂时甩开了';
  el.className = `card${pursuit.bust > 0.3 && !pursuit.busted ? ' danger' : ''}`;
  el.innerHTML = `<div class="row"><span class="heat">🚨 ${HEAT_TEXT[pursuit.heat]}</span><span>🚓 × ${n}</span>${heli?.active ? '<span>🚁</span>' : ''}<span>💥 ${pursuit.takedowns}</span></div>
    <div class="bust"><i style="width:${Math.round(pursuit.bust * 100)}%"></i></div><div class="state">${state}</div>`;
}


/* ===== js/audio/mixer.js ===== */
// 每帧的声音参数：玩家引擎转速、附近 NPC 引擎（距离衰减 + 多普勒）、看台观众
'use strict';

// 引擎声：听的是玩家（回放时是焦点车），外加附近一辆 NPC 的引擎声（距离衰减 + 多普勒）
// 声音用的转速：像无级变速一样随车速连续上升（HUD 上的挡位只是显示）
function engineRpm(c) {
  if (raceState === 'countdown') return c.ctl.throttle ? 0.6 : 0;
  const u = clamp(Math.abs(c.vF) / (c.spec.vmax / 3.6), 0, 1.15);
  return clamp(0.08 * (c.ctl.throttle ? 1 : 0) + 0.85 * u ** 0.8, 0, 1);
}

function updateAudio(dt) {
  if (!sound.ctx || !player) return;
  sound.music?.setLevel(raceState === 'menu' || menuKind ? 0.2 : 0.11);
  const c = focusCar();
  let npc = null, best = 70;
  for (const o of allCars()) {
    if (o === c || !o.active) continue;
    const d = Math.hypot(o.x - c.x, o.z - c.z);
    if (d < best) { best = d; npc = o; }
  }
  let npcInfo = null;
  if (npc) {
    const d = Math.max(best, 1), ux = (c.x - npc.x) / d, uz = (c.z - npc.z) / d;
    const [sx, sz] = forwardOf(npc.heading), [lx, lz] = forwardOf(c.heading);
    const vs = (sx * ux + sz * uz) * npc.vF, vl = (lx * ux + lz * uz) * c.vF;
    npcInfo = {
      carId: npc.carId, rpmN: engineRpm(npc), throttle: npc.ctl.throttle ? 1 : 0,
      volume: (1 - best / 70) ** 2 * 0.8, pitch: clamp((343 - vl) / (343 - vs), 0.75, 1.3),
    };
  }
  const playing = raceState !== 'menu' && !paused && !(raceState === 'replay' && !replay.playing);
  // 混响：夜城楼群、峡谷岩壁里回声大，开阔的海边、雪山、公路上只有一点点
  const REVERB = { night: 0.55, canyon: 0.4, snow: 0.15, seaside: 0.1, sunset: 0.15 };
  const rw = worldMode === 'open' ? regionWeights(c.x, c.z) : { [T.def.theme]: 1 };
  sound.setReverb(Object.entries(rw).reduce((sum, [id, w]) => sum + (REVERB[TRACK_BY_ID[id]?.theme ?? id] ?? 0.1) * w, 0));
  const stand = (world?.userData.stands ?? []).reduce((best, s) =>
    (!best || Math.hypot(c.x - s.x, c.z - s.z) < Math.hypot(c.x - best.x, c.z - best.z) ? s : best), null);
  if (stand) {
    const d = Math.hypot(c.x - stand.x, c.z - stand.z);
    const prox = clamp(1 - (d - 25) / 110, 0, 1) ** 1.6;
    const excite = raceState === 'menu' ? 0.1 : clamp(Math.abs(c.vF) / 60, 0, 1);
    sound.updateCrowd(dt, prox, excite, !paused && !(raceState === 'replay' && !replay.playing));
  }
  // 警笛：最近的两辆警车各一个声部（距离衰减 + 多普勒）；旋翼：直升机
  const sirens = playing ? activeCops()
    .map((o) => ({ o, d: Math.hypot(o.x - c.x, o.z - c.z) }))
    .filter((e) => e.d < 260)
    .sort((a, b) => a.d - b.d)
    .slice(0, 2)
    .map(({ o, d }) => {
      const dd = Math.max(d, 1), ux = (c.x - o.x) / dd, uz = (c.z - o.z) / dd;
      const vs = o.vx * ux + o.vz * uz, vl = c.vx * ux + c.vz * uz;
      return { level: (1 - d / 260) ** 1.6, pitch: clamp((343 - vl) / (343 - vs), 0.8, 1.25), close: d < 45 };
    }) : [];
  let rotor = 0;
  if (heli?.active) rotor = (1 - Math.min(1, Math.hypot(heli.x - c.x, heli.y, heli.z - c.z) / 260)) ** 2;
  sound.updatePursuit(dt, sirens, playing ? rotor : 0);
  sound.update(dt, {
    main: isHeliMode() ? null : { carId: c.carId, rpmN: engineRpm(c), throttle: c.ctl.throttle ? 1 : 0 },
    npc: npcInfo,
    speed: Math.abs(c.vF), slide: c.state === 'drive' ? Math.abs(c.vL) + (c.ctl.brake && c.vF > 15 ? 3 : 0) : 0,
    boost: c.nitroTime > 0, active: playing && c.state !== 'crash',
  });
}

/* ===== js/world/ambient.js ===== */
// 场景里的小动画：看台观众跳动、飘雪
'use strict';

const tmpM = new THREE.Matrix4();
function updateCrowd(t) {
  const cheering = raceState === 'countdown' || raceState === 'racing' || raceState === 'done';
  for (const crowd of crowds) {
    const sp = crowd.parent.position;
    if (Math.hypot(sp.x - camera.position.x, sp.z - camera.position.z) > 300) continue;   // 太远的看台不用动
    const base = crowd.userData.base;
    for (let i = 0; i < base.length; i++) {
      tmpM.copy(base[i]);
      if (cheering) tmpM.elements[13] += Math.max(0, Math.sin(t * 7 + i * 1.7)) * 0.3;
      crowd.setMatrixAt(i, tmpM);
      crowd.userData.partner?.setMatrixAt(i, tmpM);   // 帽子围巾跟着一起跳
    }
    crowd.instanceMatrix.needsUpdate = true;
    if (crowd.userData.partner) crowd.userData.partner.instanceMatrix.needsUpdate = true;
  }
}

function updateSnow(dt) {
  if (!snowfall || !snowfall.visible) return;
  const pos = snowfall.geometry.attributes.position;
  const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
  const wrap = (val, center, half) => center + ((((val - center + half) % (2 * half)) + 2 * half) % (2 * half)) - half;
  for (let i = 0; i < pos.count; i++) {
    let y = pos.getY(i) - (2.5 + (i % 5) * 0.4) * dt;
    const x = wrap(pos.getX(i) + Math.sin(elapsed + i) * 0.3 * dt, cx, 60);
    const z = wrap(pos.getZ(i), cz, 60);
    y = wrap(y, cy + 10, 30);
    pos.setXYZ(i, x, y, z);
  }
  pos.needsUpdate = true;
}

/* ===== js/game/loop.js ===== */
// 每帧更新：比赛逻辑、物理分步、模型同步、镜头、界面、光照跟随
'use strict';

// 物理固定步长：每秒 120 步，和显示器帧率无关（60/120/144 Hz 手感一致）；
// 渲染时在最后两步之间按剩余时间插值，高刷新率下也不会一顿一顿的
const PHYS_DT = 1 / 120;
let physAcc = 0, physAlpha = 1;

function updateRace(dt) {
  if (raceState === 'countdown') {
    countdownT += dt;
    const n = Math.min(5, Math.floor(countdownT / 0.6));
    while (lightsOn < n) {
      startLights[lightsOn].emissiveIntensity = 3;
      lightsOn++;
      sound.beep(false);
      showMessage(`<div class="huge">${'🔴'.repeat(lightsOn)}${'⚫'.repeat(5 - lightsOn)}</div>等待发车灯熄灭……${isPursuit() ? '<small>🚨 甩掉警察，第一个冲线！被警车围住停下就会被捕</small>' : ''}`);
    }
    readPlayerControls();
    if (countdownT >= goAt) {
      startLights.forEach((m) => { m.emissiveIntensity = 0; });
      raceState = 'racing';
      raceTime = 0;
      physAcc = 0;
      sound.beep(true);
      showMessage('<div class="huge">GO!</div>', 1.2);
      sound.cheer(1);
      onRaceGo();
      handleCarEvents();
    }
    return;
  }
  if (raceState !== 'racing' && raceState !== 'done') return;
  raceTime += dt;

  if (isHeliMode()) { /* 玩家在直升机上，车不上场 */ }
  else if (player.finished || autoDrive) aiControl(player, dt);
  else if (player.busted) Object.assign(player.ctl, { steer: 0, throttle: false, reverse: false, brake: true });   // 被捕：停车
  else readPlayerControls();
  for (const c of racers) {
    if (!c.isPlayer && !c.finished && !isFree()) {
      // 追赶机制：落后玩家太多的对手稍微加速，遥遥领先的稍微放慢
      const gap = c.progress - player.progress, [lo, hi] = DIFFICULTY[settings.difficulty].rubber;
      c.perf = c.basePerf * (1 + clamp(-gap / 500, lo, hi));
    }
    if (!c.isPlayer && c.state === 'drive') aiControl(c, dt);
  }
  if (player.finished) { player.skill = 0.85; player.perf = 0.95; }
  if (isPursuit()) for (const c of activeCops()) if (c.state === 'drive') policeControl(c, dt);

  // 物理：固定步长，一帧里可能走 0、1、2……步（卡顿时最多补 0.1 秒）
  physAcc = Math.min(physAcc + dt, 0.1);
  const cars = allCars();
  const live = cars.filter((c) => c.active);
  while (physAcc >= PHYS_DT) {
    physAcc -= PHYS_DT;
    for (const c of live) {
      c.px0 = c.x; c.pz0 = c.z; c.py0 = c.y; c.ph0 = c.heading;
      if (c.state === 'drive') stepCar(c, PHYS_DT);
      else updateCrash(c, PHYS_DT);
      if (!c.active) continue;   // 撞毁的警车可能刚被收回
      updateProgress(c);
      collideWalls(c);
      if (worldMode === 'open') collideObstacles(c);
      sanitizeCar(c);
    }
    collideCars(live.filter((c) => c.active));
  }
  physAlpha = physAcc / PHYS_DT;
  handleCarEvents();
  for (const c of cars) c.ghost = Math.max(0, c.ghost - dt);
  updatePursuit(dt);
  updateItems(dt);
  if (isTimeTrial()) updateTimeTrial(dt);
  if (isDrift()) updateDriftScore(dt);
  if (!isFree() && !resultsShown) recordFrame(dt);

  // 玩家状态提示：撞车 / 逆行
  if (!player.finished && !isHeliMode()) {
    if (player.state === 'crash') {
      if (player.crashT > 0.9 && !messageTimer) showMessage('💥 撞车了！<small>按 R 重新启动</small>');
    } else if (messageBox.textContent.startsWith('💥')) {
      hideMessage();
    }
    const dir = player.vx * T.tx[player.idx] + player.vz * T.tz[player.idx];
    if (player.state === 'drive' && dir < -3 && !isFree()) {   // 自由驾驶不管逆行
      player.wrongT += dt;
      if (player.wrongT > 1.2 && !messageTimer) showMessage('⚠️ 逆行！<small>掉头，或按 R 回到赛道</small>');
    } else if (player.wrongT > 0) {
      player.wrongT = 0;
      if (messageBox.textContent.startsWith('⚠️')) hideMessage();
    }
  }

  if (raceState === 'done' && !resultsShown && !player.busted && !isHeliMode()) {
    finishWait += dt;
    if (racers.every((c) => c.finished) || finishWait > 12) showResults();
  }
}

function update(dt) {
  let modelDt = dt;
  if (raceState === 'replay') {
    updateReplay(dt);
    modelDt = replay.playing ? dt * replay.speed : 0;
  } else {
    updateRace(dt);
  }
  for (const c of [...racers, ...cops]) {
    syncModel(c, modelDt, elapsed);
    if (c.active && (raceState === 'racing' || raceState === 'done' || (raceState === 'replay' && modelDt > 0))) carEffects(c, modelDt);
  }
  if (isHeliMode()) updateHeliMode(raceState === 'replay' ? modelDt : dt);
  else if (raceState === 'replay') { if (heli?.active) placeHeli(modelDt); } else updateHeli(dt);
  updateParticles(dt);
  updateCamera(dt);
  updateHud(dt);
  updateAudio(dt);
  if (raceState !== 'menu') drawMinimap();
  updateCrowd(elapsed);
  if (worldMode === 'open' && player) applyBlendedTheme(focusCar().x, focusCar().z);
  updateSnow(dt);
  if (world?.userData.foam) world.userData.foam.material.opacity = 0.45 + Math.sin(elapsed * 1.5) * 0.2;

  if (messageTimer > 0) {
    messageTimer -= dt;
    if (messageTimer <= 0) hideMessage();
  }
  // 阳光（阴影）跟着镜头关注的车走；位置按阴影贴图的纹素对齐，车动的时候阴影边缘不闪
  snapShadow(focusCar().root.position);
  sky.position.copy(camera.position);
  if (world?.userData.stars) world.userData.stars.position.copy(camera.position);
  if (world?.userData.moon) world.userData.moon.position.copy(camera.position).addScaledVector(MOON_DIR, 1600);
}

// 在光源视角的坐标系里把阴影相机的中心对齐到整数个纹素
const ORIGIN = new THREE.Vector3();
const shadowBasis = new THREE.Matrix4(), shadowInv = new THREE.Matrix4(), shadowP = new THREE.Vector3();
function snapShadow(p) {
  const cam = sun.shadow.camera;
  const texel = (cam.right - cam.left) / sun.shadow.mapSize.x;
  shadowBasis.lookAt(LIGHT_DIR, ORIGIN, UP);
  shadowInv.copy(shadowBasis).transpose();
  shadowP.copy(p).applyMatrix4(shadowInv);
  shadowP.x = Math.round(shadowP.x / texel) * texel;
  shadowP.y = Math.round(shadowP.y / texel) * texel;
  shadowP.applyMatrix4(shadowBasis);
  sun.target.position.copy(shadowP);
  sun.position.copy(shadowP).addScaledVector(LIGHT_DIR, 150);
}

/* ===== js/game/replay.js ===== */
// 回放：录制、播放、电视转播镜头、回放控制条
'use strict';

// =====================================================================
// 回放：比赛中以 30 帧/秒记录每辆车的状态，结束后可以用电视转播 / 追车 / 鹈鹕视角重看
// =====================================================================
const REC_HZ = 30;
const REC_K = 17;
const replayCars = () => [...racers, ...cops];   // 警车数量整场固定（预先建好），可以放进同一帧里
let rec = { frames: [], acc: 0 };
function recordFrame(dt) {
  rec.acc += dt;
  if (rec.frames.length && rec.acc < 1 / REC_HZ) return;
  rec.acc %= 1 / REC_HZ;
  const list = replayCars();
  const f = new Float32Array(1 + list.length * REC_K + 5);
  f[0] = raceTime;
  const hb = 1 + list.length * REC_K;
  if (heli) f.set([heli.active ? 1 : 0, heli.x, heli.y, heli.z, heli.heading], hb);
  list.forEach((c, i) => {
    f.set([c.x, c.z, c.heading, c.vF, c.steer, c.accel, c.yawRate, c.tumble.position.y, c.tumble.rotation.z,
      c.nitroTime > 0 ? 1 : 0, c.state === 'crash' ? 1 : c.state === 'spin' ? 2 : 0, c.ctl.throttle ? 1 : 0, c.vL,
      c.ctl.brake || (c.ctl.reverse && c.vF > 0.5) ? 1 : 0, c.active ? 1 : 0, c.y, c.vy], 1 + i * REC_K);
  });
  rec.frames.push(f);
}

const replay = { t: 0, speed: 1, playing: true, cam: 'tv', focus: 0, saved: null, tv: -1, tvCams: [], uiT: 0 };
const REPLAY_CAMS = { tv: '电视转播', chase: '追车', first: '鹈鹕视角' };
const SAVE_KEYS = ['x', 'z', 'heading', 'vx', 'vz', 'vF', 'vL', 'steer', 'accel', 'yawRate', 'idx', 's', 'lat', 'state', 'crashT', 'ghost', 'nitroTime', 'y', 'vy', 'air', 'turboT', 'bankSlope'];
const replayBar = $('replayBar');

function startReplay() {
  if (rec.frames.length < 2) return;
  closeDialog();
  hideMessage();
  replay.saved = replayCars().map((c) => ({
    active: c.active,
    ...Object.fromEntries(SAVE_KEYS.map((k) => [k, c[k]])),
    ty: c.tumble.position.y, tr: c.tumble.rotation.z, throttle: c.ctl.throttle,
  }));
  replay.prevState = raceState;
  raceState = 'replay';
  replay.t = rec.frames[0][0];
  replay.playing = true;
  replay.speed = 1;
  replay.focus = racers.indexOf(isHeliMode() ? heliMode.suspect : player);
  replay.tv = -1;
  // 电视转播机位：沿赛道每 ~90 米一个，左右交替，高低不一
  replay.tvCams = [];
  const step = Math.round(90 / T.ds);
  for (let i = 0, n = 0; i < T.N; i += step, n++) {
    const side = n % 2 ? 1 : -1, off = side * (T.B + 4 + (n % 3) * 3);
    replay.tvCams.push({ i, x: T.px[i] + T.nx[i] * off, y: 3 + (n % 4) * 2.5, z: T.pz[i] + T.nz[i] * off });
  }
  document.body.classList.remove('racing');
  document.body.classList.add('replaying');
  for (const id of ['raceHud', 'board', 'speedo', 'pursuitHud', 'modeHud', 'itemBox']) $(id).style.display = 'none';
  replayBar.style.display = 'block';
  $('rpSeek').max = String(Math.round((rec.frames.at(-1)[0] - rec.frames[0][0]) * 100));
  $('rpTotal').textContent = formatTime(rec.frames.at(-1)[0]);
  applyCockpitVisibility();
  updateReplayUi();
}

function exitReplay() {
  replayCars().forEach((c, i) => {
    const sv = replay.saved[i];
    c.active = sv.active;
    for (const k of SAVE_KEYS) c[k] = sv[k];
    c.tumble.position.y = sv.ty;
    c.tumble.rotation.z = sv.tr;
    c.ctl.throttle = sv.throttle;
  });
  raceState = replay.prevState;
  replayBar.style.display = 'none';
  document.body.classList.remove('replaying');
  document.body.classList.add('racing');
  for (const id of ['raceHud', 'speedo']) $(id).style.display = 'block';
  if (!isFree()) $('board').style.display = 'block';
  if (isPursuit()) $('pursuitHud').style.display = 'block';
  if (isItems() || isSolo()) modeHud.style.display = 'block';
  if (isItems()) itemBoxEl.style.display = 'flex';
  setView(viewMode);
  showResults();
}

function applyReplay() {
  const F = rec.frames;
  let lo = 0, hi = F.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (F[mid][0] <= replay.t) lo = mid; else hi = mid;
  }
  const a = F[lo], b = F[hi];
  const u = clamp((replay.t - a[0]) / Math.max(1e-6, b[0] - a[0]), 0, 1);
  const list = replayCars();
  const hb = 1 + list.length * REC_K;
  if (heli) {
    heli.active = a[hb] > 0.5;
    heli.group.visible = heli.beam.visible = heli.active;
    heli.x = lerp(a[hb + 1], b[hb + 1], u); heli.y = lerp(a[hb + 2], b[hb + 2], u); heli.z = lerp(a[hb + 3], b[hb + 3], u);
    heli.heading = a[hb + 4] + wrapAngle(b[hb + 4] - a[hb + 4]) * u;
  }
  list.forEach((c, i) => {
    const o = 1 + i * REC_K;
    c.active = a[o + 14] > 0.5;
    const L = (k) => lerp(a[o + k], b[o + k], u);
    c.x = L(0); c.z = L(1);
    c.heading = a[o + 2] + wrapAngle(b[o + 2] - a[o + 2]) * u;
    c.vF = L(3); c.steer = L(4); c.accel = L(5); c.yawRate = L(6);
    c.tumble.position.y = L(7);
    c.tumble.rotation.z = Math.abs(b[o + 8] - a[o + 8]) > 3 ? b[o + 8] : L(8);
    c.nitroTime = a[o + 9] > 0.5 ? 1 : 0;
    const st = u < 0.5 ? a[o + 10] : b[o + 10];
    c.state = st > 1.5 ? 'spin' : st > 0.5 ? 'crash' : 'drive';
    c.ctl.throttle = a[o + 11] > 0.5;
    c.ctl.brake = (u < 0.5 ? a[o + 13] : b[o + 13]) > 0.5;
    c.ctl.reverse = false;
    c.vL = L(12);
    c.ghost = 0;
    c.idx = projectGlobal(T, c.x, c.z);
    c.lat = trackCoords(T, c.x, c.z, c.idx).lat;
    c.y = L(15); c.vy = L(16);
    const gy = surfaceY(c);   // 顺便算出弯道倾角的车身侧倾
    c.air = c.y > gy + 0.15;
    c.turboT = 0;
  });
}

function updateReplay(dt) {
  const F = rec.frames, t1 = F[F.length - 1][0];
  if (replay.playing) {
    replay.t += dt * replay.speed;
    if (replay.t >= t1) {
      replay.t = t1;
      replay.playing = false;
      updateReplayUi();
    }
  }
  applyReplay();
  if (replay.playing) {
    for (const c of racers) {
      if (c.state === 'crash' && Math.random() < dt * 25) {
        emit(smokePool, v(c.x + rand(-1, 1), 0.8, c.z + rand(-1, 1)), { vel: v(rand(-0.5, 0.5), rand(1.5, 3), rand(-0.5, 0.5)), life: 2.2, size0: 1, size1: 4.5, color: 0x3a3a3a, alpha: 0.55 });
      }
    }
  }
  replay.uiT -= dt;
  if (replay.uiT <= 0) {
    replay.uiT = 0.1;
    $('rpTime').textContent = formatTime(replay.t);
    if (document.activeElement !== $('rpSeek')) $('rpSeek').value = String(Math.round((replay.t - F[0][0]) * 100));
  }
}

// 电视转播镜头：选车子前方最近的机位，车开过去之后切到下一个；镜头长焦跟拍
function updateTvCamera(c, dt) {
  const cams = replay.tvCams;
  const ahead = (cam) => { let d = cam.i - c.idx; if (d < -T.N / 2) d += T.N; if (d > T.N / 2) d -= T.N; return d; };
  const cur = cams[replay.tv];
  if (!cur || ahead(cur) < -12 || ahead(cur) > 70) {
    let best = 0, bestD = Infinity;
    cams.forEach((cam, k) => { const d = ahead(cam); if (d > -4 && d < bestD) { bestD = d; best = k; } });
    replay.tv = best;
  }
  const cam = cams[replay.tv];
  camera.position.set(cam.x, cam.y, cam.z);
  lookTarget.set(c.root.position.x, c.root.position.y + 0.9, c.root.position.z);
  camera.lookAt(lookTarget);
  const dist = camera.position.distanceTo(lookTarget);
  camFov = clamp(THREE.MathUtils.radToDeg(2 * Math.atan(5.5 / dist)), 6, 55);
}

function replayKey(code) {
  if (code === 'Escape') return exitReplay();
  if (code === 'Space' || code === 'KeyP') return toggleReplayPlay();
  if (code === 'KeyT') return cycleReplayCam();
  if (code === 'KeyR') { replay.t = rec.frames[0][0]; replay.playing = true; return updateReplayUi(); }
  if (code === 'ArrowLeft' || code === 'ArrowRight') {
    const F = rec.frames;
    replay.t = clamp(replay.t + (code === 'ArrowLeft' ? -5 : 5), F[0][0], F[F.length - 1][0]);
    return;
  }
  if (code === 'ArrowUp' || code === 'ArrowDown') return cycleFocus(code === 'ArrowUp' ? -1 : 1);
  if (code === 'KeyM') return toggleSound();
  if (code === 'KeyB') return toggleMusic();
  if (code === 'KeyN') return nextSong();
}
function toggleReplayPlay() {
  const F = rec.frames;
  if (!replay.playing && replay.t >= F[F.length - 1][0] - 0.01) replay.t = F[0][0];
  replay.playing = !replay.playing;
  updateReplayUi();
}
function cycleReplayCam() {
  const order = Object.keys(REPLAY_CAMS);
  replay.cam = order[(order.indexOf(replay.cam) + 1) % order.length];
  replay.tv = -1;
  camHeading = focusCar().heading;
  applyCockpitVisibility();
  updateReplayUi();
}
function cycleFocus(dir) {
  replay.focus = (replay.focus + dir + racers.length) % racers.length;
  replay.tv = -1;
  camHeading = focusCar().heading;
  applyCockpitVisibility();
  updateReplayUi();
}
function updateReplayUi() {
  const c = focusCar();
  $('rpPlay').textContent = replay.playing ? '⏸ 暂停' : '▶ 播放';
  $('rpSpeed').textContent = `${replay.speed}×`;
  $('rpCam').textContent = `镜头：${REPLAY_CAMS[replay.cam]}`;
  $('rpFocus').innerHTML = `<span class="dot" style="background:${c.isPlayer ? '#d8452a' : c.css}"></span>${c.isPlayer ? '你' : c.name}`;
}
$('rpPlay').onclick = toggleReplayPlay;
$('rpRestart').onclick = () => replayKey('KeyR');
$('rpSpeed').onclick = () => {
  const speeds = [0.25, 0.5, 1, 2, 4];
  replay.speed = speeds[(speeds.indexOf(replay.speed) + 1) % speeds.length];
  updateReplayUi();
};
$('rpCam').onclick = cycleReplayCam;
$('rpFocus').onclick = () => cycleFocus(1);
$('rpExit').onclick = exitReplay;
$('rpSeek').oninput = (e) => { replay.t = rec.frames[0][0] + +e.target.value / 100; };

/* ===== js/ui/mirror.js ===== */
// 后视镜
'use strict';

// =====================================================================
// 后视镜：从车尾往后看的相机先渲染到一张小贴图，再左右翻转画到右下角（和真的镜子一样左右相反）
// =====================================================================
const mirrorCam = new THREE.PerspectiveCamera(48, 3, 0.3, 1500);
const mirrorRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
const mirrorGeo = new THREE.PlaneGeometry(2, 2);
{
  const uv = mirrorGeo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setX(i, 1 - uv.getX(i));   // 左右翻转
}
const mirrorScene = new THREE.Scene();
mirrorScene.add(new THREE.Mesh(mirrorGeo, new THREE.MeshBasicMaterial({ map: mirrorRT.texture, depthTest: false, depthWrite: false })));
const mirrorOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const mirrorEl = $('mirror');
let mirrorOn = settings.mirror !== false;

function mirrorVisible() {
  return mirrorOn && !IS_TOUCH && !paused && !isHeliMode() && (raceState === 'countdown' || raceState === 'racing' || raceState === 'done');
}
let mirrorShown = null;
function updateMirrorUi() {
  const show = mirrorVisible();
  if (show === mirrorShown) return;
  mirrorShown = show;
  mirrorEl.style.display = show ? 'block' : 'none';
  document.body.classList.toggle('mirror-on', show);
}
function toggleMirror() {
  mirrorOn = !mirrorOn;
  settings.mirror = mirrorOn;
  saveSettings();
  updateMirrorUi();
  if (raceState === 'racing') showMessage(mirrorOn ? '🪞 后视镜：开' : '🪞 后视镜：关', 1);
}

function renderMirror() {
  if (!mirrorVisible() || !player) return;
  const r = mirrorEl.getBoundingClientRect();
  const bw = 3;
  const w = r.width - bw * 2, h = r.height - bw * 2;
  if (w < 10 || h < 10) return;
  const pr = renderer.getPixelRatio();
  const W = Math.round(w * pr), H = Math.round(h * pr);
  if (mirrorRT.width !== W || mirrorRT.height !== H) mirrorRT.setSize(W, H);
  const c = player, p = c.root.position;
  const [fx, fz] = forwardOf(c.root.rotation.y);
  const back = c.built.half[1] + 0.3, hgt = Math.max(1.0, c.built.camH * 0.52);
  mirrorCam.position.set(p.x - fx * back, p.y + hgt, p.z - fz * back);
  mirrorCam.lookAt(p.x - fx * (back + 30), p.y + hgt * 0.55, p.z - fz * (back + 30));
  mirrorCam.aspect = w / h;
  mirrorCam.updateProjectionMatrix();
  // 阴影贴图沿用主画面这一帧的，不再重算
  renderer.shadowMap.autoUpdate = false;
  renderer.setRenderTarget(mirrorRT);
  renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(null);
  renderer.shadowMap.autoUpdate = true;
  const x = r.left + bw, y = innerHeight - r.bottom + bw;
  renderer.autoClear = false;
  renderer.setScissorTest(true);
  renderer.setViewport(x, y, w, h);
  renderer.setScissor(x, y, w, h);
  renderer.render(mirrorScene, mirrorOrtho);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.autoClear = true;
}

/* ===== js/main.js ===== */
// 入口：主循环、窗口大小变化、开始游戏
'use strict';

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const realDt = clock.getDelta();
  const dt = Math.min(realDt, 0.05);
  elapsed += dt;
  trackQuality(realDt);
  if (worldMapOpen) { drawWorldMap(); updateAudio(dt); }   // 看全景地图时游戏暂停
  else if (!paused) update(dt);
  else updateAudio(dt);
  updateMirrorUi();
  renderer.render(scene, camera);
  renderMirror();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 测试 / 调试入口：打包成单文件后脚本都在模块作用域里，外部只能通过这个对象访问
window.__pelicanRacing = {
  get state() { return { raceState, raceTime, mode: settings.mode, track: T?.def.id, worldMode, fps: quality.fps, pixelRatio: renderer.getPixelRatio() }; },
  get player() { return player; },
  get racers() { return racers; },
  get cops() { return cops; },
  settings, renderer, scene, turboStats,
  setupRace, startCountdown, closeDialog, update,
  step(seconds, fps = 60) { for (let i = 0; i < seconds * fps; i++) { elapsed += 1 / fps; update(1 / fps); } },
  autopilot(on = true) { autoDrive = on; },
};
let autoDrive = false;   // 测试用：让 AI 代驾玩家

// 声音：页面一打开就建好音频（菜单音乐会立刻排好），浏览器允许出声之前先暂停着；
// 第一次点击 / 触摸 / 按键（点哪里都行）就开启
function updateAudioHint() {
  document.body.classList.toggle('audio-locked', !sound.ctx || sound.ctx.state !== 'running');
}
for (const ev of ['pointerdown', 'keydown', 'touchstart']) addEventListener(ev, () => { sound.unlock(); updateAudioHint(); }, { capture: true, passive: true });
sound.init();
updateAudioHint();

setupRace({ newRivals: true });
openMainMenu();
animate();

</script>
