<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>鹈鹕赛车</title>
<style>
body { margin: 0; overflow: hidden; background: #0d1622; font-family: -apple-system, "PingFang SC", sans-serif; }
button { font: inherit; }
.card { position: fixed; color: #1d3040; background: #ffffffcc; border-radius: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#panel { left: 14px; top: 12px; padding: 8px 10px; font-size: 13px; display: flex; gap: 6px; }
#panel button, .dialog button { border: 0; border-radius: 6px; padding: 4px 12px; background: #1d6f8f; color: #fff; cursor: pointer; }
#raceHud { left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 18px; text-align: center; display: none; font-variant-numeric: tabular-nums; }
#raceHud .main { font-size: 20px; font-weight: 700; white-space: nowrap; }
#raceHud .main b { font-size: 28px; color: #d8452a; }
#raceHud .sub { font-size: 12px; color: #1d3040b0; white-space: nowrap; }
#board { left: 14px; top: 58px; padding: 6px 10px; font-size: 13px; display: none; min-width: 150px; font-variant-numeric: tabular-nums; }
#board div { display: flex; gap: 6px; align-items: center; line-height: 1.7; white-space: nowrap; }
#board .me { font-weight: 700; color: #d8452a; }
#board .gap { margin-left: auto; color: #1d3040a0; font-size: 11px; padding-left: 8px; }
#minimap { right: 14px; top: 12px; padding: 6px; display: none; }
#minimap canvas { display: block; }
#speedo { right: 14px; bottom: 14px; padding: 8px 14px 10px; width: 190px; display: none; font-variant-numeric: tabular-nums; }
#mirror { position: fixed; right: 14px; bottom: 14px; width: 300px; height: 100px; box-sizing: border-box; border: 3px solid #1d3040d8; border-radius: 12px; box-shadow: 0 4px 16px #0005; pointer-events: none; display: none; z-index: 3; }
body.mirror-on #speedo { bottom: 126px; width: 272px; }
.seg.wrap { flex-wrap: wrap; }
#speedo .row { display: flex; align-items: baseline; gap: 6px; }
#speedo .kmh { font-size: 42px; font-weight: 800; line-height: 1; }
#speedo .unit { font-size: 13px; color: #1d3040a0; }
#speedo .gear { margin-left: auto; font-size: 22px; font-weight: 700; color: #1d6f8f; }
#nitroBar { position: relative; height: 12px; border-radius: 6px; background: #1d304022; overflow: hidden; margin-top: 8px; }
#nitroFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: linear-gradient(90deg, #2a8cff, #6ad7ff); }
#nitroFill.ready { background: linear-gradient(90deg, #ff7a18, #ffd23f); animation: glow 0.8s ease-in-out infinite alternate; }
#nitroFill.burn { background: linear-gradient(90deg, #ff3d00, #ffe066); }
@keyframes glow { from { filter: brightness(0.9); } to { filter: brightness(1.35); } }
#nitroText { font-size: 12px; margin-top: 4px; color: #1d3040c0; }
#driftText { font-size: 13px; font-weight: 700; color: #e0641a; min-height: 0; }
#driftText:empty { display: none; }
#message { left: 50%; top: 32%; transform: translate(-50%, -50%); padding: 14px 24px; font-size: 22px; font-weight: 700; display: none; text-align: center; z-index: 5; }
#message .huge { font-size: 64px; line-height: 1.1; }
#message small { display: block; font-size: 14px; font-weight: 400; margin-top: 4px; }
#hint { left: 14px; bottom: 12px; padding: 6px 10px; font-size: 12px; }
#nowPlaying { left: 14px; bottom: 50px; padding: 6px 12px; font-size: 13px; opacity: 0; transform: translateY(6px); transition: opacity 0.5s, transform 0.5s; pointer-events: none; z-index: 7; }
#nowPlaying.show { opacity: 1; transform: none; }
#nowPlaying small { color: #1d3040a0; margin-left: 4px; }
body.touch #nowPlaying { bottom: auto; top: calc(56px + var(--st)); left: 50%; transform: translateX(-50%); }
#replayBar { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 12px; display: none; width: min(680px, 94vw); box-sizing: border-box; z-index: 6; font-variant-numeric: tabular-nums; }
#replayBar .rp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
#replayBar input { flex: 1; min-width: 120px; }
#replayBar button { border: 0; border-radius: 6px; padding: 5px 10px; background: #1d6f8f; color: #fff; cursor: pointer; display: inline-flex; align-items: center; }
#replayBar button.exit { margin-left: auto; background: #d8452a; }
#replayBar .rp-hint { font-size: 11px; color: #1d3040a0; }
body.touch #replayBar .rp-hint { display: none; }
.overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: flex-start; z-index: 30; background: linear-gradient(90deg, #06101cc0 0%, #06101c70 55%, #06101c00 100%); }
.overlay.center { justify-content: center; background: #0008; }
.dialog { background: #fff; color: #1d3040; border-radius: 14px; padding: 18px 22px; margin-left: 3vw; width: min(600px, 92vw); max-height: 90vh; overflow-y: auto; box-sizing: border-box; box-shadow: 0 10px 40px #0005; }
.overlay.center .dialog { margin-left: 0; }
.dialog h2 { margin: 0 0 4px; font-size: 26px; }
.dialog h3 { margin: 14px 0 6px; font-size: 15px; color: #1d3040c0; }
.dialog .lead { margin: 0 0 6px; font-size: 13px; color: #5a6d7a; }
.grid { display: grid; gap: 8px; }
.grid.tracks { grid-template-columns: repeat(2, 1fr); }
.grid.cars { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
.dialog .pick { border: 2px solid #d5e2ea; border-radius: 10px; padding: 8px 10px; cursor: pointer; background: #fff; text-align: left; color: inherit; }
.dialog .pick:hover { background: #f1f7fb; }
.dialog .pick.sel { border-color: #d8452a; background: #fff6f1; }
.pick .name { font-weight: 700; font-size: 15px; }
.pick small { display: block; color: #5a6d7a; font-size: 12px; margin-top: 2px; }
.pick canvas { float: right; margin-left: 6px; }
.stat { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5a6d7a; margin-top: 3px; }
.stat span { width: 30px; }
.stat i { flex: 1; height: 6px; border-radius: 3px; background: #e5edf2; position: relative; overflow: hidden; }
.stat i::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: #1d6f8f; border-radius: 3px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.dialog .swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #d5e2ea; cursor: pointer; padding: 0; }
.dialog .swatch.sel { box-shadow: 0 0 0 3px #d8452a; }
.seg { display: inline-flex; border: 1px solid #d5e2ea; border-radius: 8px; overflow: hidden; margin-right: 12px; }
.dialog .seg button { background: #fff; color: #1d3040; border-radius: 0; padding: 5px 12px; }
.dialog .seg button.sel { background: #1d6f8f; color: #fff; }
.dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.dialog .go { font-size: 18px; padding: 9px 26px !important; background: #d8452a !important; font-weight: 700; }
.dialog .ghost { background: #e5edf2 !important; color: #1d3040 !important; }
.dialog table { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; font-size: 14px; }
.dialog td, .dialog th { padding: 5px 6px; border-bottom: 1px solid #e5edf2; text-align: left; }
.dialog th { font-size: 12px; color: #5a6d7a; font-weight: 400; }
.dialog tr.me { background: #fff4d6; font-weight: 700; }
.dialog .big { font-size: 30px; font-weight: 800; margin: 4px 0; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; flex: none; }
.keys { font-size: 12px; color: #5a6d7a; line-height: 1.8; margin-top: 10px; }
kbd { display: inline-block; min-width: 16px; padding: 0 5px; border: 1px solid #c9d6de; border-bottom-width: 2px; border-radius: 4px; background: #f6f9fb; font: 11px/16px ui-monospace, Menlo, monospace; text-align: center; color: #1d3040; }

/* ---------------- 移动端：安全区、触屏按键 ---------------- */
:root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; overscroll-behavior: none; }
body { position: fixed; inset: 0; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body.touch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas { touch-action: none; }
#touch { display: none; }
body.touch.racing #touch { display: block; }
body.touch #hint, body.replaying #hint { display: none; }
#touch button {
  position: fixed; z-index: 10; width: 66px; height: 66px; border-radius: 50%; border: 2px solid #ffffffb0;
  background: #1d304060; color: #fff; font-size: 24px; line-height: 1; padding: 0; font-weight: 700;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); touch-action: none;
  display: flex; align-items: center; justify-content: center;
}
#touch button.on { background: #1d6f8fd0; transform: scale(0.94); }
#touch .small { width: 48px; height: 48px; font-size: 14px; }
#tLeft  { left: calc(16px + var(--sl)); bottom: calc(18px + var(--sb)); }
#tRight { left: calc(94px + var(--sl)); bottom: calc(18px + var(--sb)); }
#tUp    { right: calc(16px + var(--sr)); bottom: calc(150px + var(--sb)); }
#tDown  { right: calc(94px + var(--sr)); bottom: calc(150px + var(--sb)); }
#tBrake { right: calc(172px + var(--sr)); bottom: calc(150px + var(--sb)); font-size: 16px !important; }
#touch #tNitro { right: calc(16px + var(--sr)); bottom: calc(222px + var(--sb)); background: #d8452ab0; font-size: 15px; }
#touch #tView { left: calc(16px + var(--sl)); bottom: calc(96px + var(--sb)); }
#touch #tReset { left: calc(72px + var(--sl)); bottom: calc(96px + var(--sb)); }

@media (max-width: 760px), (max-height: 500px) {
  #panel { left: calc(8px + var(--sl)); top: calc(8px + var(--st)); padding: 5px 6px; font-size: 11px; gap: 4px; }
  #panel button { padding: 4px 7px; }
  #raceHud { top: calc(8px + var(--st)); padding: 4px 10px; }
  #raceHud .main { font-size: 14px; }
  #raceHud .main b { font-size: 20px; }
  #raceHud .sub { display: none; }
  #board { top: calc(44px + var(--st)); left: calc(8px + var(--sl)); font-size: 11px; min-width: 110px; padding: 4px 8px; }
  #minimap { right: calc(8px + var(--sr)); top: calc(8px + var(--st)); padding: 4px; }
  #minimap canvas { width: 110px !important; height: auto !important; }
  #speedo { right: calc(8px + var(--sr)); bottom: calc(8px + var(--sb)); width: 150px; padding: 6px 10px; }
  #mirror { right: calc(8px + var(--sr)); bottom: calc(8px + var(--sb)); width: 210px; height: 70px; }
  body.mirror-on #speedo { bottom: calc(86px + var(--sb)); width: 190px; }
  #speedo .kmh { font-size: 30px; }
  #message { font-size: 16px; max-width: 80vw; }
  #message .huge { font-size: 44px; }
  .dialog { padding: 12px 14px; font-size: 14px; margin-left: 0; }
  .overlay { justify-content: center; background: #06101ca0; }
  .grid.tracks { grid-template-columns: 1fr; }
  .dialog h2 { font-size: 20px; }
}
@media (orientation: portrait) and (max-width: 760px) {
  body.touch.racing #rotateTip { display: block; }
}
#rotateTip { display: none; position: fixed; left: 50%; transform: translateX(-50%); top: 40%; padding: 6px 14px; font-size: 13px; color: #1d3040; background: #ffffffd0; border-radius: 10px; white-space: nowrap; z-index: 4; }

/* ---------------- 警匪追逐 ---------------- */
#pursuitHud { left: 50%; top: 76px; transform: translateX(-50%); padding: 6px 14px; display: none; min-width: 260px; text-align: center; font-size: 13px; font-weight: 700; }
#pursuitHud .row { display: flex; gap: 12px; justify-content: center; align-items: center; white-space: nowrap; }
#pursuitHud .heat { color: #d8452a; letter-spacing: 2px; }
#pursuitHud .bust { position: relative; height: 8px; border-radius: 4px; background: #1d304022; overflow: hidden; margin-top: 5px; }
#pursuitHud .bust i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #2a6cff, #ff2a2a); border-radius: 4px; }
#pursuitHud .state { font-size: 11px; color: #1d3040b0; margin-top: 3px; font-weight: 400; }
#pursuitHud.danger { background: #ffe1dccc; animation: danger 0.5s ease-in-out infinite alternate; }
@keyframes danger { from { box-shadow: 0 0 0 0 #ff2a2a00; } to { box-shadow: 0 0 0 4px #ff2a2a88; } }

/* ---------------- 小地图 / 全景地图 ---------------- */
#minimap { cursor: pointer; }
#worldMap { z-index: 40; cursor: pointer; background: #06101cd0; }
#worldMap .wm-card { background: #f4f1e8; border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 40px #0006; }
#worldMap .wm-title { font-size: 18px; font-weight: 700; color: #1d3040; margin-bottom: 8px; }
#worldMap .wm-title small { font-size: 12px; font-weight: 400; color: #5a6d7a; margin-left: 10px; }
#worldMap canvas { display: block; }
@media (max-width: 760px), (max-height: 500px) {
  #pursuitHud { top: calc(40px + var(--st)); min-width: 200px; font-size: 11px; padding: 4px 10px; }
}

/* ---------------- 比赛类型面板 / 道具 ---------------- */
#modeHud { left: 50%; top: 76px; transform: translateX(-50%); padding: 6px 14px; display: none; min-width: 240px; text-align: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
#modeHud .row { white-space: nowrap; }
#modeHud .score { font-size: 20px; color: #d8452a; }
#modeHud .combo { font-size: 15px; color: #e0641a; margin-top: 2px; }
#modeHud .combo b { font-size: 18px; color: #d8452a; }
#modeHud .combo.dim { font-size: 11px; color: #1d3040a0; font-weight: 400; }
#modeHud .good { color: #1f9d55; margin-left: 6px; font-size: 16px; }
#modeHud .bad { color: #d8452a; margin-left: 6px; font-size: 16px; }
#itemBox { left: 14px; top: 250px; width: 96px; height: 124px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 3px solid #1d304030; pointer-events: auto; cursor: pointer; }
#itemBox .queue { display: flex; gap: 4px; margin-top: 2px; }
#itemBox .slot { width: 28px; height: 28px; border-radius: 7px; border: 2px dashed #1d304030; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
#itemBox .slot.on { border-style: solid; border-color: #1d304060; background: #ffffffb0; }
#itemBox.has { border-color: #f2c230; animation: glow 0.8s ease-in-out infinite alternate; }
#itemBox.locked { border-color: #e53935; animation: lockflash 0.3s steps(2) infinite; }
@keyframes lockflash { from { background: #ffd6d6f0; } to { background: #ffffffe6; } }
#driftText.turbo { color: #e0561b; font-weight: 700; animation: lockflash 0.2s steps(2) infinite; border-radius: 6px; }
#itemBox .icon { font-size: 40px; line-height: 1; min-height: 44px; }
#itemBox .label { font-size: 10px; text-align: center; color: #1d3040c0; padding: 0 4px; }
#flash { position: fixed; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; z-index: 20; }
#touch #tItem { right: calc(94px + var(--sr)); bottom: calc(222px + var(--sb)); background: #f2c230b0; font-size: 15px; }
@media (max-width: 760px), (max-height: 500px) {
  #modeHud { top: calc(40px + var(--st)); min-width: 180px; font-size: 11px; padding: 4px 10px; }
  #itemBox { top: auto; bottom: calc(160px + var(--sb)); left: calc(8px + var(--sl)); width: 74px; height: 96px; }
  #itemBox .slot { width: 22px; height: 22px; font-size: 14px; }
  #itemBox .icon { font-size: 30px; min-height: 32px; }
}

/* 浏览器还不允许出声时的提示（第一次点击 / 按键后消失） */
#audioHint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; background: #1d3040e6; color: #fff; font-size: 14px; padding: 6px 16px; border-radius: 99px; pointer-events: none; display: none; animation: glow 1.2s ease-in-out infinite alternate; }
body.audio-locked #audioHint { display: block; }

/* ?fps=1 帧率显示 */
#fps { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 50; font: 12px/1.4 ui-monospace, monospace; color: #fff; background: #0008; padding: 2px 8px; border-radius: 6px; pointer-events: none; }

</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel" class="card">
  <button id="pause">暂停</button>
  <button id="sound">音效：开</button>
  <button id="music">音乐：开</button>
  <button id="nextSong" title="下一首（N）">⏭</button>
  <button id="view">视角：追车</button>
  <button id="menuBtn">菜单</button>
</div>
<div id="raceHud" class="card"><div class="main"></div><div class="sub"></div></div>
<div id="board" class="card"></div>
<div id="pursuitHud" class="card"></div>
<div id="modeHud" class="card"></div>
<div id="itemBox" class="card"><span class="icon"></span><span class="label"></span><span class="queue"></span></div>
<div id="flash"></div>
<div id="minimap" class="card" title="点击查看全景地图（Tab）"><canvas></canvas></div>
<div id="speedo" class="card">
  <div class="row"><span class="kmh" id="kmh">0</span><span class="unit">km/h</span><span class="gear" id="gear">N</span></div>
  <div id="nitroBar"><div id="nitroFill"></div></div>
  <div id="nitroText">氮气充能中</div>
  <div id="driftText"></div>
</div>
<div id="message" class="card"></div>
<div id="mirror"></div>
<div id="nowPlaying" class="card"></div>
<div id="audioHint">🔈 点击任意位置开启声音</div>
<div id="hint" class="card"><kbd>↑</kbd> 油门 <kbd>↓</kbd> 减速/倒车 <kbd>←</kbd><kbd>→</kbd> 转向 <kbd>空格</kbd> 刹车 <kbd>C</kbd> 氮气 <kbd>X</kbd> 道具 <kbd>Z</kbd> 换道具 <kbd>T</kbd> 切换视角 <kbd>R</kbd> 重新启动 <kbd>P</kbd> 暂停 <kbd>V</kbd> 后视镜 <kbd>Tab</kbd> 地图 <kbd>Esc</kbd> 菜单</div>
<div id="replayBar" class="card">
  <div class="rp-row"><b>🎬 回放</b><span id="rpTime">00:00.00</span><input id="rpSeek" type="range" min="0" max="1000" value="0" step="1"><span id="rpTotal"></span></div>
  <div class="rp-row">
    <button id="rpRestart" title="从头播放（R）">⏮</button><button id="rpPlay" title="播放 / 暂停（空格）">⏸ 暂停</button><button id="rpSpeed" title="播放速度">1×</button>
    <button id="rpCam" title="切换镜头（T）">镜头：电视转播</button><button id="rpFocus" title="切换跟随的车（↑ ↓）">你</button>
    <button id="rpExit" class="exit" title="退出回放（Esc）">退出回放</button>
  </div>
  <div class="rp-hint">空格 播放/暂停 · ← → 快退/快进 5 秒 · ↑ ↓ 切换车手 · T 切换镜头 · Esc 退出</div>
</div>
<div id="worldMap" class="overlay center">
  <div class="wm-card">
    <div class="wm-title">🗺️ 全景地图<small>点击任意处或按 Tab 关闭</small></div>
    <canvas></canvas>
  </div>
</div>
<div id="menu" class="overlay"><div class="dialog"></div></div>
<div id="touch">
  <button id="tLeft" data-key="ArrowLeft" aria-label="左转">◀</button>
  <button id="tRight" data-key="ArrowRight" aria-label="右转">▶</button>
  <button id="tUp" data-key="ArrowUp" aria-label="油门">▲</button>
  <button id="tDown" data-key="ArrowDown" aria-label="减速">▼</button>
  <button id="tBrake" data-key="Space" aria-label="刹车">刹车</button>
  <button id="tNitro" data-key="KeyC" aria-label="氮气">N₂O</button>
  <button id="tView" class="small" data-key="KeyT" aria-label="视角">视角</button>
  <button id="tReset" class="small" data-key="KeyR" aria-label="重新启动">R</button>
  <button id="tItem" data-key="KeyX" aria-label="道具">道具</button>
</div>
<div id="rotateTip">横屏体验更好</div>

<!-- three.js 以 ES 模块从 CDN 加载后挂到全局；下面的游戏脚本都是普通脚本（defer，按顺序在它之后执行），
     所以直接双击打开 index.html 也能玩。build.py 会把所有脚本打包进 dist/pelican-racing.html。 -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

// 通用工具：向量/随机数、网格和几何体辅助、画布贴图、羽毛材质、名字牌、显存释放
'use strict';

// =====================================================================
// 工具函数
// =====================================================================
const v = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const UP = v(0, 1, 0);
const Z_AXIS = v(0, 0, 1);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const $ = (id) => document.getElementById(id);

// 固定种子的随机数：同一条赛道每次布景都一样
function seeded(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, ...extra });
const paintMat = (color) => new THREE.MeshPhysicalMaterial({ color, metalness: 0.35, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.08 });

function mesh(geometry, material, shadow = true) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = shadow;
  m.receiveShadow = true;
  return m;
}

function stickMatrix(a, b) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const length = dir.length();
  return new THREE.Matrix4().compose(
    a.clone().addScaledVector(dir, 0.5),
    new THREE.Quaternion().setFromUnitVectors(UP, dir.normalize()),
    v(1, length, 1)
  );
}

function compose(position, rotation = new THREE.Euler(), scale = 1) {
  const s = typeof scale === 'number' ? v(scale, scale, scale) : scale;
  return new THREE.Matrix4().compose(position, new THREE.Quaternion().setFromEuler(rotation), s);
}

function merge(parts) {
  return mergeGeometries(parts.map(([geometry, matrix]) =>
    (geometry.index ? geometry.toNonIndexed() : geometry.clone()).applyMatrix4(matrix)));
}

function sculpt(geometry, fn) {
  const pos = geometry.attributes.position;
  const p = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    fn(p.fromBufferAttribute(pos, i));
    pos.setXYZ(i, p.x, p.y, p.z);
  }
  geometry.computeVertexNormals();
  return geometry;
}

function taperedTube(points, radiusAt, tubular = 32, radial = 14) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, tubular, 1, radial);
  const pos = geometry.attributes.position;
  const p = new THREE.Vector3();
  for (let i = 0; i <= tubular; i++) {
    const center = curve.getPointAt(i / tubular);
    const r = radiusAt(i / tubular);
    for (let j = 0; j <= radial; j++) {
      const idx = i * (radial + 1) + j;
      p.fromBufferAttribute(pos, idx).sub(center).multiplyScalar(r).add(center);
      pos.setXYZ(idx, p.x, p.y, p.z);
    }
  }
  return geometry;
}

function shaped(geometry, material, position, scale = 1, rotation = new THREE.Euler()) {
  const m = mesh(geometry, material);
  m.position.copy(position);
  if (typeof scale === 'number') m.scale.setScalar(scale); else m.scale.copy(scale);
  m.rotation.copy(rotation);
  return m;
}

function canvasTexture(size, draw, { srgb = true, repeat = [1, 1], height = size } = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = height;
  draw(canvas.getContext('2d'), size, height);
  const tex = new THREE.CanvasTexture(canvas);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(...repeat);
  tex.anisotropy = MAX_ANISO;   // 斜着看的路面、地面不糊
  return tex;
}

function noiseTexture(size, base, dots, repeat, density = 0.25) {
  return canvasTexture(size, (g, s) => {
    g.fillStyle = base;
    g.fillRect(0, 0, s, s);
    for (let i = 0; i < s * s * density; i++) {
      const [color, alpha] = dots[Math.floor(Math.random() * dots.length)];
      g.fillStyle = color;
      g.globalAlpha = Math.random() * alpha;
      g.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 1.5, 1 + Math.random() * 1.5);
    }
  }, { repeat });
}

// 羽毛鳞片贴图（沿用鹈鹕骑车的做法）
function drawFeatherScales(g, s, base, shade) {
  g.fillStyle = base;
  g.fillRect(0, 0, s, s);
  const rows = 14, cols = 12;
  const w = s / cols, h = s / rows;
  for (let r = 0; r <= rows; r++) {
    for (let c = -1; c <= cols; c++) {
      const x = (c + (r % 2) * 0.5) * w + w / 2;
      const y = r * h;
      const grad = g.createRadialGradient(x, y, 0, x, y, w * 0.7);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.8, shade);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.beginPath();
      g.ellipse(x, y, w * 0.62, h * 1.25, 0, 0, Math.PI);
      g.fill();
    }
  }
}

function plumageMaterial(color, repeat, shade = 'rgba(150,120,110,0.22)') {
  const map = canvasTexture(256, (g, s) => drawFeatherScales(g, s, '#ffffff', shade), { repeat });
  const bump = canvasTexture(256, (g, s) => drawFeatherScales(g, s, '#ffffff', 'rgba(0,0,0,0.45)'), { srgb: false, repeat });
  return new THREE.MeshStandardMaterial({ color, map, bumpMap: bump, bumpScale: 0.8, roughness: 0.9 });
}

function featherGeometry(length, width) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(length * 0.3, width * 0.55, length * 0.75, width * 0.45);
  s.quadraticCurveTo(length, width * 0.2, length, 0);
  s.quadraticCurveTo(length * 0.98, -width * 0.3, length * 0.75, -width * 0.4);
  s.quadraticCurveTo(length * 0.3, -width * 0.5, 0, 0);
  return sculpt(new THREE.ShapeGeometry(s, 8), (p) => { p.z = -0.25 * length * (p.x / length) ** 2; });
}

function nameTag(text, color) {
  const texture = canvasTexture(256, (g, w, h) => {
    g.fillStyle = 'rgba(20, 30, 40, 0.7)';
    g.beginPath();
    g.roundRect(4, 6, w - 8, h - 12, 24);
    g.fill();
    g.fillStyle = color;
    g.beginPath();
    g.arc(40, h / 2, 12, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#fff';
    g.font = 'bold 34px "PingFang SC", sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, w / 2 + 14, h / 2 + 1);
  }, { height: 64 });
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthWrite: false, fog: false }));
  sprite.scale.set(2.0, 0.5, 1);
  return sprite;
}

// 释放一组物体占用的显存（换赛道、换车时用）
function disposeTree(root) {
  root.traverse((o) => {
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (m.userData.shared) continue;
      for (const key of ['map', 'emissiveMap', 'bumpMap', 'alphaMap']) if (m[key] && !m[key].userData.shared) m[key].dispose();
      m.dispose();
    }
  });
  root.removeFromParent();
}
const shareAll = (obj) => {
  for (const x of Object.values(obj)) {
    if (x && x.isBufferGeometry) x.userData.shared = true;
    if (x && x.isMaterial) {
      x.userData.shared = true;
      for (const key of ['map', 'bumpMap']) if (x[key]) x[key].userData.shared = true;
    }
  }
};

/* ===== js/core/quality.js ===== */
// 自适应分辨率（参考 claude-opus-5-5-demo 的鹈鹕骑车）：按真实帧率自动调渲染分辨率
// 以观测到的刷新率上限为基准（兼容锁 30 帧的设备），降档快、升档慢，并记住失败过的上限，避免来回抖动
// URL 参数：?fps=1 显示帧率；?pr=1.25 固定像素比（关闭自适应）
'use strict';

const QP = new URLSearchParams(location.search);
const PR_MAX = renderer.getPixelRatio();
const PR_FIXED = QP.has('pr') ? clamp(+QP.get('pr') || 1, 0.5, 3) : null;
if (PR_FIXED) renderer.setPixelRatio(PR_FIXED);
const quality = { fps: 60, acc: 0, frames: 0, refreshCap: 0, prCeiling: Infinity, low: 0, high: 0 };
const fpsEl = QP.get('fps') === '1' ? document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fps' })) : null;

function trackQuality(realDt) {
  quality.acc += realDt;
  quality.frames++;
  if (quality.acc < 0.5) return;
  quality.fps = quality.frames / quality.acc;
  quality.acc = 0;
  quality.frames = 0;
  if (fpsEl) fpsEl.textContent = `${quality.fps.toFixed(0)} FPS · ${renderer.getPixelRatio().toFixed(2)}x`;
  // 只在比赛画面里调（菜单、暂停、后台标签页不算）
  if (PR_FIXED || document.hidden || paused || raceState === 'menu' || menuKind) return;
  const q = quality, pr = renderer.getPixelRatio();
  q.refreshCap = Math.max(q.refreshCap * 0.995, q.fps);
  q.low = q.fps < Math.min(40, q.refreshCap * 0.72) ? q.low + 1 : 0;
  q.high = q.fps > q.refreshCap * 0.93 ? q.high + 1 : 0;
  if (q.low >= 4 && pr > 0.6) {
    q.prCeiling = pr - 0.01;
    setPixelRatio(Math.max(0.6, pr - 0.2));
    q.low = q.high = 0;
  } else if (q.high >= 16 && pr < Math.min(PR_MAX, q.prCeiling) - 0.01) {
    setPixelRatio(Math.min(PR_MAX, q.prCeiling, pr + 0.1));
    q.high = 0;
  }
}
function setPixelRatio(pr) {
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight);
}

// 头盔 / 赛车服贴图按颜色缓存（同色的车手共用）
const gearCache = new Map();
function gearMaterials(helmetColor, suitColor) {
  const key = `${helmetColor}-${suitColor}`;
  if (gearCache.has(key)) return gearCache.get(key);
  const hc = toCss(helmetColor), sc = toCss(suitColor);
  const light = (c) => new THREE.Color(c).getHSL({}).l > 0.7;
  const stripe = light(helmetColor) ? '#d8452a' : '#f4f4f4';
  // 头盔：球面 u 绕一圈（u=0.25 朝前），v 从头顶往下；中间一道宽条纹 + 两侧号码圆 + 后脑字样
  const helmetTex = canvasTexture(512, (g, w, h) => {
    g.fillStyle = hc; g.fillRect(0, 0, w, h);
    g.fillStyle = stripe;
    for (const u of [0.25, 0.75]) g.fillRect((u - 0.035) * w, 0, 0.07 * w, h);   // 从前到后的中线条纹
    g.fillRect(0, h * 0.8, w, h * 0.05);
    g.fillStyle = light(helmetColor) ? '#1d3040' : '#ffffff';
    for (const u of [0.0, 0.5]) { g.beginPath(); g.arc(u * w, h * 0.55, h * 0.12, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = light(helmetColor) ? '#ffffff' : '#111111';
    g.font = `900 ${h * 0.16}px Arial`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const u of [0.0, 0.5, 1.0]) g.fillText('P', u * w, h * 0.56);
    g.fillStyle = stripe; g.font = `900 ${h * 0.1}px Arial`;
    g.fillText('PELICAN', 0.75 * w, h * 0.62);
  }, { height: 256 });
  const helmet = new THREE.MeshPhysicalMaterial({ map: helmetTex, metalness: 0.2, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.04 });
  // 赛车服：车队色 + 两侧白色竖条 + 胸前赞助商贴片
  const suitTex = canvasTexture(256, (g, w, h) => {
    g.fillStyle = sc; g.fillRect(0, 0, w, h);
    g.fillStyle = '#f4f4f4';
    for (const u of [0.0, 0.5, 1.0]) g.fillRect((u - 0.03) * w, 0, 0.06 * w, h);   // 两侧竖条
    g.fillRect(0.14 * w, 0.42 * h, 0.22 * w, 0.12 * h);                            // 胸前贴片
    g.fillStyle = '#d8452a'; g.font = `900 ${h * 0.08}px Arial`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('PELICAN', 0.25 * w, 0.48 * h);
    g.fillStyle = '#00000030'; g.fillRect(0, 0.62 * h, w, 0.02 * h);              // 腰带
  }, { height: 256 });
  const suit = new THREE.MeshStandardMaterial({ map: suitTex, roughness: 0.8 });
  const sleeve = new THREE.MeshStandardMaterial({ color: suitColor, roughness: 0.8 });
  const glove = new THREE.MeshStandardMaterial({ color: light(suitColor) ? 0x1d1d20 : 0xf2f2f2, roughness: 0.6 });
  const out = { helmet, suit, sleeve, glove };
  for (const m of Object.values(out)) { m.userData.shared = true; if (m.map) m.map.userData.shared = true; }
  gearCache.set(key, out);
  return out;
}
const BELT_MAT = mat(0xd42020, { roughness: 0.7 });
BELT_MAT.userData.shared = true;

// 沿 a→b 摆放的椭球（翅膀前臂），每帧更新
function setLimb(m, a, b, thickness, width) {
  const dir = new THREE.Vector3().subVectors(b, a);
  m.scale.set(width, thickness, dir.length() / 2);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(Z_AXIS, dir.normalize());
}

function createPelican(helmetColor, suitColor = helmetColor) {
  const gear = gearMaterials(helmetColor, suitColor);
  const group = new THREE.Group();
  group.add(
    shaped(PG.sphere24, gear.suit, v(0, 0.12, -0.08), v(0.24, 0.3, 0.3), new THREE.Euler(0, -Math.PI / 2, 0)),   // 穿赛车服的身体（贴图 u=0.25 朝前）
    shaped(PG.tail, PM.covert, v(0, 0.05, -0.36)),
    mesh(PG.neck, PM.neck),
    shaped(PG.collar, gear.sleeve, v(0, 0.3, -0.03)),   // 赛车服立领
    shaped(PG.hans, PM.carbon, v(0, 0.36, -0.05)),      // HANS 头颈保护装置（搭在肩上）
  );
  // 安全带：两条肩带从肩后翻过来，交到腹前的卡扣；一条腰带
  const c = v(0, 0.12, -0.08), R = v(0.24 * 1.06, 0.3 * 1.06, 0.3 * 1.06);
  const onBody = (x, a) => { const d = v(x, Math.cos(a), Math.sin(a)).normalize(); return [c.x + d.x * R.x, c.y + d.y * R.y, c.z + d.z * R.z]; };
  for (const s of [-1, 1]) group.add(tube([onBody(s * 0.3, -0.35), onBody(s * 0.3, 0.3), onBody(s * 0.22, 0.9), onBody(s * 0.06, 1.35)], 0.012, BELT_MAT, 12, 5));
  group.add(tube([-0.9, -0.5, 0, 0.5, 0.9].map((x) => onBody(x, 1.62)), 0.013, BELT_MAT, 12, 5));
  group.add(shaped(PG.sphere16, PM.metal, v(...onBody(0, 1.45)), v(0.03, 0.03, 0.012)));   // 卡扣

  const head = new THREE.Group();
  head.position.set(0, 0.87, 0.14);
  group.add(head);
  head.add(mesh(PG.skull, PM.head));
  for (const s of [-1, 1]) {
    head.add(
      shaped(PG.sphere16, PM.skin, v(0.052 * s, 0.01, 0.05), v(0.02, 0.03, 0.05), new THREE.Euler(0, 0.35 * s, 0)),
      shaped(PG.sphere16, PM.iris, v(0.066 * s, 0.016, 0.052), v(0.008, 0.014, 0.014)),
      shaped(PG.sphere16, PM.pupil, v(0.073 * s, 0.016, 0.054), v(0.004, 0.007, 0.007)),
    );
  }
  // 赛车头盔：头顶 + 后脑两侧，前沿一圈深色遮阳帽檐，顶上一个进气口，下巴一根系带
  const hScale = v(0.092, 0.1, 0.125);
  head.add(shaped(PG.helmetDome, gear.helmet, v(0, 0.012, -0.012), hScale));
  head.add(shaped(PG.helmetBack, gear.helmet, v(0, 0.012, -0.012), hScale));
  head.add(shaped(PG.visor, PM.goggle, v(0, 0.012, -0.012), v(0.1, 0.108, 0.136)));
  head.add(shaped(PG.sphere16, PM.carbon, v(0, 0.108, 0.01), v(0.018, 0.012, 0.035)));
  head.add(shaped(PG.strap, PM.strap, v(0, -0.05, 0.02), v(0.8, 1, 0.55), new THREE.Euler(0.5, 0, 0)));
  // 护目镜推在头盔前额上
  for (const s of [-1, 1]) head.add(shaped(PG.goggleLens, PM.goggle, v(0.032 * s, 0.085, 0.085), 1, new THREE.Euler(-0.7, 0, 0)));
  const crest = mesh(PG.crest, PM.covert);
  crest.position.set(0, 0.05, -0.1);
  head.add(crest);

  const bill = new THREE.Group();
  bill.position.set(0, -0.02, 0.07);
  bill.rotation.x = 0.38;
  head.add(bill);
  const pouch = mesh(PG.pouch, PM.pouch);
  pouch.position.y = -0.012;
  bill.add(mesh(PG.upperBill, PM.bill), mesh(PG.hook, PM.hook), pouch);

  // 翅膀：肩膀固定，前臂每帧指向方向盘握点
  const wings = [-1, 1].map((s) => {
    const shoulder = v(0.2 * s, 0.3, 0.02);
    const panel = shaped(PG.wingPanel, PM.body, v(0.23 * s, 0.2, -0.12), 1, new THREE.Euler(0.35, 0, 0));
    const flight = shaped(PG.flight, PM.flight, v(0.25 * s, 0.2, -0.05));
    const upper = mesh(PG.sphere24, gear.sleeve);   // 赛车服袖子
    const fore = mesh(PG.sphere24, gear.sleeve);
    const hand = mesh(PG.sphere16, gear.glove);     // 赛车手套
    hand.scale.set(0.045, 0.034, 0.06);
    group.add(panel, flight, upper, fore, hand);
    return { side: s, shoulder, elbow: v(0.27 * s, 0.16, 0.2), upper, fore, hand };
  });

  return { group, head, bill, pouch, crest, wings, pouchOffset: 0, pouchVel: 0, headYaw: 0, headPitch: 0 };
}

// 翅膀抓住方向盘两侧（grips 为鹈鹕局部坐标）
function poseWings(pel, grips) {
  for (const w of pel.wings) {
    const grip = grips[w.side > 0 ? 0 : 1];
    setLimb(w.upper, w.shoulder, w.elbow, 0.06, 0.055);
    setLimb(w.fore, w.elbow, grip, 0.045, 0.04);
    w.hand.position.copy(grip);
  }
}

// 头随转向看弯心，加减速时脖子前后甩，喉囊像果冻一样晃
function animatePelican(pel, dt, t, steer, accel, speed) {
  pel.headYaw += (steer * 0.45 - pel.headYaw) * Math.min(1, dt * 4);
  const pitchTarget = clamp(-accel * 0.012, -0.25, 0.25);
  pel.headPitch += (pitchTarget - pel.headPitch) * Math.min(1, dt * 6);
  pel.head.rotation.set(pel.headPitch, pel.headYaw, Math.sin(t * 17) * 0.004 * Math.min(speed / 30, 1));
  pel.head.position.z = 0.14 + pel.headPitch * 0.12;
  // 弹簧阻尼：加速度让喉囊晃动
  pel.pouchVel += (-80 * pel.pouchOffset - 7 * pel.pouchVel + accel * 0.35) * dt;
  pel.pouchOffset = clamp(pel.pouchOffset + pel.pouchVel * dt, -0.35, 0.45);
  pel.pouch.scale.set(1, 1 + pel.pouchOffset + Math.sin(t * 23) * 0.03 * Math.min(speed / 60, 1), 1);
  pel.crest.rotation.x = -Math.min(speed / 60, 1) * 0.5 + Math.sin(t * 31) * 0.08 * Math.min(speed / 40, 1);
}

/* ===== js/models/car-parts.js ===== */
// 放样车身、车身贴图、玻璃、常用零件、车轮、方向盘、静态零件合并
'use strict';

// =====================================================================
// 赛车模型：放样车身
// 沿车长方向给出一组截面 [z, 底高 y0, 顶高 y1, 底部半宽 wb, 顶部半宽 wt, 圆角指数 n]，
// 截面是超椭圆（n 越大越方），上半部按 wt 收窄（侧窗内倾 / 可乐瓶腰线），
// 截面之间用保形三次插值连成光滑曲面；再在车轮处挖出轮拱。
// 车身贴图的 u 沿车长（车尾 0 → 车头 1），v 绕截面一圈（底部 0 → 左侧 0.25 → 顶部 0.5 → 右侧 0.75）。
// =====================================================================
const toCss = (h) => `#${h.toString(16).padStart(6, '0')}`;

function stationInterpolator(stations) {
  const n = stations.length;
  const zs = stations.map((s) => s[0]);
  const tangents = [];
  for (let k = 1; k <= 5; k++) {
    const m = stations.map((s, i) => {
      if (i === 0 || i === n - 1) return 0;
      const a = stations[i - 1][k], b = s[k], c = stations[i + 1][k];
      if ((b - a) * (c - b) <= 0) return 0;   // 局部极值处切线为 0，避免插值过冲
      return (c - a) / (zs[i + 1] - zs[i - 1]);
    });
    tangents[k] = m;
  }
  return (z) => {
    let i = 0;
    while (i < n - 2 && z > zs[i + 1]) i++;
    const z0 = zs[i], z1 = zs[i + 1], h = z1 - z0;
    const t = clamp((z - z0) / h, 0, 1);
    const t2 = t * t, t3 = t2 * t;
    const out = [];
    for (let k = 1; k <= 5; k++) {
      const a = stations[i][k], b = stations[i + 1][k];
      out.push((2 * t3 - 3 * t2 + 1) * a + (t3 - 2 * t2 + t) * h * tangents[k][i] + (-2 * t3 + 3 * t2) * b + (t3 - t2) * h * tangents[k][i + 1]);
    }
    return out;
  };
}

// 截面 z 处的一圈轮廓点（超椭圆，上半部收窄，轮拱处挖掉）
function loftRing(at, z, seg, arches = [], archInner = 0) {
  let [y0, y1, wb, wt, n] = at(z);
  y1 = Math.max(y1, y0 + 0.01);
  wb = Math.max(wb, 0.005); wt = Math.max(wt, 0.005);
  const yc = (y0 + y1) / 2, hh = (y1 - y0) / 2, e = 2 / Math.max(n, 1.5);
  const ring = [];
  for (let j = 0; j <= seg; j++) {
    const th = -Math.PI / 2 + (j / seg) * Math.PI * 2;
    const c = Math.cos(th), s = Math.sin(th);
    let y = yc + Math.sign(s) * Math.abs(s) ** e * hh;
    const f = (y - y0) / (y1 - y0);
    const x = Math.sign(c) * Math.abs(c) ** e * lerp(wb, wt, THREE.MathUtils.smoothstep(f, 0.35, 1));
    for (const [az, ay, ar] of arches) {
      const dz = z - az;
      if (Math.abs(x) > archInner && dz * dz + (y - ay) ** 2 < ar * ar) y = ay + Math.sqrt(ar * ar - dz * dz);
    }
    ring.push([x, y, z]);
  }
  return { ring, yc, y0, y1 };
}

// open: { rear, front } 为 true 时不封口（由 endPanel 做成带贴图的车尾 / 车头面板）
function loftGeometry(stations, { rings = 90, seg = 44, arches = [], archInner = 0, open = {} } = {}) {
  const at = stationInterpolator(stations);
  const zA = stations[0][0], zB = stations[stations.length - 1][0];
  const pos = [], uv = [], idx = [];
  const ringPts = [];
  for (let i = 0; i <= rings; i++) {
    const u = i / rings;
    const z = zA + (zB - zA) * u;
    const { ring, yc } = loftRing(at, z, seg, arches, archInner);
    ring.forEach(([x, y], j) => { pos.push(x, y, z); uv.push(u, j / seg); });
    ringPts.push({ ring, yc, z });
  }
  const W = seg + 1;
  for (let i = 0; i < rings; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * W + j, b = a + 1, c = a + W, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  // 两端封口
  for (const [ri, front] of [[0, false], [rings, true]]) {
    if (front ? open.front : open.rear) continue;
    const { ring, yc, z } = ringPts[ri];
    const base = pos.length / 3;
    pos.push(0, yc, z);
    uv.push(front ? 1 : 0, 0.5);
    for (const [x, y] of ring) { pos.push(x, y, z); uv.push(front ? 1 : 0, 0.5); }
    for (let j = 0; j < seg; j++) {
      if (front) idx.push(base, base + 1 + j, base + 2 + j);
      else idx.push(base, base + 2 + j, base + 1 + j);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// 车身涂装：在 (u, v) 坐标里画色块、条纹、号码
function livery(stations, draw, size = 1024) {
  const zA = stations[0][0], zB = stations[stations.length - 1][0];
  const mid = stations[Math.floor(stations.length / 2)];
  const perim = Math.PI * Math.sqrt(2 * (mid[3] ** 2 + ((mid[2] - mid[1]) / 2) ** 2));
  const aspect = (size / (zB - zA)) / (size / perim);   // u 方向每米像素数 / v 方向每米像素数
  const zu = (z) => (z - zA) / (zB - zA);
  return canvasTexture(size, (g, w, h) => {
    const P = {
      g, zu,
      rect(z0, z1, v0, v1, color) {
        g.fillStyle = color;
        g.fillRect(zu(z0) * w, (1 - v1) * h, (zu(z1) - zu(z0)) * w, (v1 - v0) * h);
      },
      round(z0, z1, v0, v1, r, color) {
        g.fillStyle = color;
        g.beginPath();
        g.roundRect(zu(z0) * w, (1 - v1) * h, (zu(z1) - zu(z0)) * w, (v1 - v0) * h, r);
        g.fill();
      },
      // 在车身左右两侧写字；左侧要水平镜像、右侧要垂直镜像，从车外看才是正的
      sideText(text, z, height, color, { font = '900', vLeft = 0.25, stroke = null } = {}) {
        for (const side of ['left', 'right']) {
          g.save();
          const v = side === 'left' ? vLeft : 1 - vLeft;
          g.translate(zu(z) * w, (1 - v) * h);
          g.scale((side === 'left' ? -1 : 1) * aspect, side === 'left' ? 1 : -1);
          g.font = `${font} ${Math.round(height * h)}px "PingFang SC", "Helvetica Neue", Arial, sans-serif`;
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          if (stroke) { g.lineWidth = height * h * 0.12; g.strokeStyle = stroke; g.strokeText(text, 0, 0); }
          g.fillStyle = color;
          g.fillText(text, 0, 0);
          g.restore();
        }
      },
      sideDisc(z, v, r, color) {
        for (const vv of [v, 1 - v]) {
          g.fillStyle = color;
          g.beginPath();
          g.ellipse(zu(z) * w, (1 - vv) * h, r * h * aspect, r * h, 0, 0, Math.PI * 2);
          g.fill();
        }
      },
    };
    draw(P, w, h);
  });
}

// 车尾 / 车头的端面面板：沿放样端面的轮廓做一圈斜边，中间往车身里凹进去一点，
// 用平面贴图（从车外看过去：X 向右、Y 向上，单位米），draw(P) 里画饰板、格栅、牌照、分缝线
function endPanel(stations, end, draw, { recess = 0.035, bevel = 0.05, size = 512, seg = 44 } = {}) {
  const at = stationInterpolator(stations);
  const rear = end === 'rear';
  const z = rear ? stations[0][0] : stations[stations.length - 1][0];
  const dir = rear ? 1 : -1;   // 往车身里面的方向
  const { ring, yc, y0, y1 } = loftRing(at, z, seg);
  const W = Math.max(...ring.map(([x]) => Math.abs(x)));
  const xv = (x) => (rear ? -x : x);   // 从车外看过去的横坐标
  const U = (x) => (xv(x) + W) / (2 * W), V = (y) => (y - y0) / (y1 - y0);
  const pos = [], uv = [], idx = [];
  const inner = ring.map(([x, y]) => {
    const k = 1 - bevel / Math.max(W, (y1 - y0) / 2);
    return [x * k, yc + (y - yc) * k, z + dir * recess];
  });
  for (const [x, y, zz] of [...ring, ...inner]) { pos.push(x, y, zz); uv.push(U(x), V(y)); }
  const n = ring.length;
  for (let j = 0; j < n - 1; j++) {
    const a = j, b = j + 1, c = n + j, d = n + j + 1;
    if (rear) idx.push(a, c, b, b, c, d); else idx.push(a, b, c, b, d, c);
  }
  const center = pos.length / 3;
  pos.push(0, yc, z + dir * recess);
  uv.push(U(0), V(yc));
  for (let j = 0; j < n - 1; j++) {
    if (rear) idx.push(center, n + j + 1, n + j); else idx.push(center, n + j, n + j + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const H = y1 - y0;
  const tex = canvasTexture(size, (ctx, w, h) => {
    const px = (X) => ((X + W) / (2 * W)) * w, py = (Y) => (1 - (Y - y0) / H) * h, sc = w / (2 * W);
    const P = {
      ctx, W, y0, y1, px, py, sc,
      rect(X0, X1, Y0, Y1, color) { ctx.fillStyle = color; ctx.fillRect(px(X0), py(Y1), (X1 - X0) * sc, (Y1 - Y0) * h / H); },
      round(X0, X1, Y0, Y1, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(px(X0), py(Y1), (X1 - X0) * sc, (Y1 - Y0) * h / H, r * sc); ctx.fill(); },
      text(str, X, Y, height, color, font = '900') {
        ctx.save(); ctx.translate(px(X), py(Y)); ctx.scale(1, (h / H) / sc);
        ctx.fillStyle = color; ctx.font = `${font} ${Math.round(height * sc)}px "Helvetica Neue", Arial, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 0, 0); ctx.restore();
      },
      // 蜂窝格栅
      honeycomb(X0, X1, Y0, Y1, cell = 0.03, color = '#2a2c30') {
        ctx.save(); ctx.beginPath(); ctx.rect(px(X0), py(Y1), (X1 - X0) * sc, (Y1 - Y0) * h / H); ctx.clip();
        ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, cell * sc * 0.18);
        const r = cell * sc / 2, dy = (h / H) / sc;
        for (let row = 0, y = py(Y1); y < py(Y0) + r * 2; row++, y += r * 1.5 * dy) {
          for (let x = px(X0) + (row % 2 ? r * 0.87 : 0); x < px(X1) + r * 2; x += r * 1.74) {
            ctx.beginPath();
            for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + (k * Math.PI) / 3; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r * dy); }
            ctx.closePath(); ctx.stroke();
          }
        }
        ctx.restore();
      },
      // 分缝线
      line(pts, color = '#00000070', width = 0.008) {
        ctx.strokeStyle = color; ctx.lineWidth = width * sc; ctx.beginPath();
        pts.forEach(([X, Y], i) => (i ? ctx.lineTo(px(X), py(Y)) : ctx.moveTo(px(X), py(Y))));
        ctx.stroke();
      },
    };
    draw(P);
  }, { height: Math.max(64, Math.round((size * H) / (2 * W))) });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return mesh(g, paintMaterial(tex));
}

// 车身侧面的分缝线、门把手等（画在 livery 贴图上，左右两侧对称）：

function sideLines(P, lines, color = '#0000004a') {
  for (const [z0, z1, v0, v1] of lines) {
    P.rect(z0, z1, v0, v1, color);
    P.rect(z0, z1, 1 - v1, 1 - v0, color);

}

function box(w, h, d, material, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  return m;
}
function rbox(w, h, d, r, material, x, y, z, rx = 0, ry = 0, rz = 0) {
  r = Math.min(r, h / 2, d / 2) * 0.999;
  const shape = new THREE.Shape();
  shape.moveTo(-d / 2 + r, -h / 2);
  shape.lineTo(d / 2 - r, -h / 2); shape.quadraticCurveTo(d / 2, -h / 2, d / 2, -h / 2 + r);
  shape.lineTo(d / 2, h / 2 - r); shape.quadraticCurveTo(d / 2, h / 2, d / 2 - r, h / 2);
  shape.lineTo(-d / 2 + r, h / 2); shape.quadraticCurveTo(-d / 2, h / 2, -d / 2, h / 2 - r);
  shape.lineTo(-d / 2, -h / 2 + r); shape.quadraticCurveTo(-d / 2, -h / 2, -d / 2 + r, -h / 2);
  const bev = Math.max(0.001, Math.min(r, w / 2, h / 2, d / 2) * 0.6);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.001, w - bev * 2), bevelEnabled: true, bevelSize: bev, bevelOffset: -bev, bevelThickness: bev, bevelSegments: 2, curveSegments: 4 });
  geo.translate(0, 0, -(w - bev * 2) / 2).rotateY(-Math.PI / 2);
  const m = mesh(geo, material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  return m;
}
function ell(material, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  const m = mesh(PG.sphere24, material);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);

  return m;
}
function cyl(rTop, rBot, len, material, x, y, z, rx = 0, ry = 0, rz = 0, seg = 18, open = false) {
  const m = mesh(new THREE.CylinderGeometry(rTop, rBot, len, seg, 1, open), material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  return m;
}
function tube(points, r, material, seg = 24, radial = 8) {
  return mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map((p) => v(...p))), seg, r, radial), material);
}
// 翼片：水滴形翼型沿 x 方向拉伸；angle 为攻角（后缘上翘为正）
function airfoil(span, chord, thick, material, x, y, z, angle = 0) {
  const s = new THREE.Shape();
  const c = chord;
  s.moveTo(c / 2, 0);
  s.bezierCurveTo(c / 2, thick * 0.9, c * 0.2, thick, 0, thick * 0.8);
  s.bezierCurveTo(-c * 0.25, thick * 0.6, -c * 0.45, thick * 0.15, -c / 2, 0);
  s.bezierCurveTo(-c * 0.3, -thick * 0.1, c * 0.2, -thick * 0.35, c / 2, 0);
  const geo = new THREE.ExtrudeGeometry(s, { depth: span, bevelEnabled: false, curveSegments: 10 });
  geo.translate(0, -thick * 0.3, -span / 2).rotateY(-Math.PI / 2);
  const m = mesh(geo, material);
  m.position.set(x, y, z);
  m.rotation.x = angle;
  return m;
}
// 弯曲的挡风玻璃：一块沿 x 两端向后卷的曲面，再向后倾斜
function windshield(width, height, lean, curve, material, x, y, z) {
  const geo = sculpt(new THREE.PlaneGeometry(width, height, 16, 4), (p) => { p.z = -curve * (p.x / (width / 2)) ** 2; });
  const m = mesh(geo, material);
  m.position.set(x, y, z);
  m.rotation.x = -lean;
  return m;
}
function mirrorPair(group, paint, x, y, z, stalk = 0.1) {

}
// 圆形车灯：灯碗 + 发光灯芯 + 灯圈；facing = 1 朝前（车头），-1 朝后（车尾）

const tireMats = new Map();
function tireMaterial(stripe) {
  const key = stripe ?? 'none';
  if (!tireMats.has(key)) {
    const tex = canvasTexture(8, (g, w, h) => {
      g.fillStyle = '#1b1b1c'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#242426'; g.fillRect(0, h * 0.34, w, h * 0.32);
      if (stripe) {
        g.fillStyle = stripe;

        g.fillRect(0, h * 0.85, w, h * 0.05);
      }
    }, { height: 128 });
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    const m = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, side: THREE.DoubleSide });
    m.userData.shared = true;
    tex.userData.shared = true;
    tireMats.set(key, m);
  }
  return tireMats.get(key);
}

function makeWheel(radius, width, { rim = PM.metal, style = 'y', spokes = 5, caliper = 0xc8202a, stripe = null, disc = true, rimRatio = 0.68 } = {}) {
  const spin = new THREE.Group();
  const steer = new THREE.Group();
  steer.add(spin);
  const hw = width / 2, rimR = radius * rimRatio;
  const prof = [[rimR * 1.02, -hw * 0.9], [radius * 0.9, -hw], [radius * 0.975, -hw * 0.9], [radius, -hw * 0.55], [radius, hw * 0.55], [radius * 0.975, hw * 0.9], [radius * 0.9, hw], [rimR * 1.02, hw * 0.9]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  spin.add(mesh(new THREE.LatheGeometry(prof, 36).rotateZ(Math.PI / 2), tireMaterial(stripe)));
  spin.add(mesh(new THREE.CylinderGeometry(rimR, rimR, width * 0.9, 28, 1, true).rotateZ(Math.PI / 2), PM.darkMetal));
  const faceX = hw * 0.78;
  for (const s of [-1, 1]) {
    const lip = mesh(new THREE.TorusGeometry(rimR, 0.012, 6, 32).rotateY(Math.PI / 2), rim);
    lip.position.x = s * faceX;
    spin.add(lip);
    // 轮辐
    const parts = [];
    const L = rimR * 0.95;
    const addSpoke = (a, wdt, thick = 0.02) => parts.push([new THREE.BoxGeometry(thick, L, wdt).translate(0, L / 2, 0), compose(v(0, 0, 0), new THREE.Euler(a, 0, 0))]);
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * Math.PI * 2;
      if (style === 'y') { addSpoke(a - 0.12, rimR * 0.16); addSpoke(a + 0.12, rimR * 0.16); }
      else if (style === 'multi') addSpoke(a, rimR * 0.1, 0.015);
      else if (style === 'dish') addSpoke(a, rimR * 0.42, 0.025);
      else addSpoke(a, rimR * 0.3);
    }
    const sp = mesh(merge(parts), rim);
    sp.position.x = s * (faceX - 0.01);
    spin.add(sp);
    if (style === 'dish') {
      const d = mesh(new THREE.CylinderGeometry(rimR * 0.5, rimR * 0.5, 0.02, 24).rotateZ(Math.PI / 2), rim);
      d.position.x = s * (faceX - 0.012);
      spin.add(d);
    }
    const hub = mesh(new THREE.CylinderGeometry(rimR * 0.2, rimR * 0.24, 0.05, 12).rotateZ(Math.PI / 2), style === 'dish' ? PM.chrome : PM.darkMetal);
    hub.position.x = s * faceX;
    spin.add(hub);
  }
  if (disc) {
    steer.add(mesh(new THREE.CylinderGeometry(rimR * 0.8, rimR * 0.8, 0.028, 28).rotateZ(Math.PI / 2), PM.disc));
    for (const s of [-1, 1]) {
      const cal = rbox(0.07, rimR * 0.34, rimR * 0.5, 0.02, mat(caliper, { roughness: 0.35, metalness: 0.3 }), s * 0.03, rimR * 0.52, -rimR * 0.32, 0.6);
      steer.add(cal);
    }
  }
  return { steer, spin, radius };
}

function makeSteeringWheel(r, style = 'round') {
  const g = new THREE.Group();
  if (style === 'f1') {
    g.add(rbox(r * 2.1, r * 1.05, 0.04, 0.018, PM.carbon, 0, 0, 0));
    for (const s of [-1, 1]) g.add(cyl(0.028, 0.028, r * 0.7, PM.rubber, s * r * 0.95, 0, 0.01));
    g.add(box(r * 0.8, r * 0.4, 0.01, new THREE.MeshStandardMaterial({ color: 0x0a2a1a, emissive: 0x19ff8a, emissiveIntensity: 0.6 }), 0, r * 0.15, -0.021));
  } else {
    g.add(mesh(new THREE.TorusGeometry(r, 0.018, 8, 28), PM.rubber));
    for (const a of [0, Math.PI, -Math.PI / 2]) {
      const sp = box(0.025, r, 0.015, PM.carbon, Math.cos(a) * r / 2, Math.sin(a) * r / 2, 0, 0, 0, a - Math.PI / 2);
      g.add(sp);
    }
    g.add(cyl(r * 0.28, r * 0.28, 0.03, PM.carbon, 0, 0, -0.01, Math.PI / 2));
  }
  return g;
}

// 把分组里所有静态零件按材质合并，大幅减少绘制次数
function bake(group) {
  const byMat = new Map();
  const keep = [];
  group.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(group.matrixWorld).invert();
  for (const child of [...group.children]) {
    if (!child.isMesh || child.userData.dynamic) { keep.push(child); continue; }
    const geo = (child.geometry.index ? child.geometry.toNonIndexed() : child.geometry.clone());
    for (const name of Object.keys(geo.attributes)) if (!['position', 'normal', 'uv'].includes(name)) geo.deleteAttribute(name);
    if (!geo.attributes.normal) geo.computeVertexNormals();
    if (!geo.attributes.uv) geo.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(geo.attributes.position.count * 2), 2));
    geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, child.matrixWorld));
    const key = child.material.uuid;
    if (!byMat.has(key)) byMat.set(key, { material: child.material, geos: [], shadow: child.castShadow });
    byMat.get(key).geos.push(geo);
    if (!child.geometry.userData.shared) child.geometry.dispose();
    group.remove(child);
  }
  for (const { material, geos, shadow } of byMat.values()) {
    const merged = mergeGeometries(geos);
    geos.forEach((g) => g.dispose());
    if (merged) group.add(mesh(merged, material, shadow));
  }
  return group;
}

// 车身涂装图案（双条纹、火焰、双色、渐变、棋盘格、迷彩、闪电）和副色
'use strict';

// ---------------- 车身涂装图案：画在车身贴图上（u 沿车长，v 绕截面一圈） ----------------
const LIVERIES = [
  ['stock', '原厂涂装'], ['stripes', '双条纹'], ['flames', '火焰'], ['twotone', '双色'],
  ['gradient', '渐变'], ['checker', '棋盘格'], ['camo', '迷彩'], ['lightning', '闪电'],
];
const ACCENTS = [null, 0xf4f4f4, 0x111111, 0xd11f1f, 0xf2b705, 0x1f5fbf, 0x2fa84f, 0xff6a13, 0xb0b6be];
function contrastOf(hex) {
  const c = new THREE.Color(hex);
  return 0.299 * c.r + 0.587 * c.g + 0.114 * c.b > 0.45 ? 0x111111 : 0xf4f4f4;
}
const shadeCss = (hex, dl) => `#${new THREE.Color(hex).offsetHSL(0, 0, dl).getHexString()}`;

function paintPattern(P, st, look, base) {
  const accentHex = look.accent ?? contrastOf(base);
  const acc = toCss(accentHex);
  const g = P.g, W = g.canvas.width, H = g.canvas.height;
  const zA = st[0][0], zB = st[st.length - 1][0];
  const X = (z) => P.zu(z) * W, Y = (v) => (1 - v) * H;
  const rng = seeded(7 + LIVERIES.findIndex(([id]) => id === look.pattern) * 13);
  switch (look.pattern) {
    case 'stripes':
      for (const dv of [-0.075, 0.03]) P.rect(zA, zB, 0.5 + dv, 0.5 + dv + 0.045, acc);
      for (const v0 of [0.2, 0.785]) P.rect(zA, zB, v0, v0 + 0.015, acc);
      break;
    case 'twotone':
      P.rect(zA, zB, 0, 0.29, acc); P.rect(zA, zB, 0.71, 1, acc);   // 下半截换成副色
      for (const v0 of [0.29, 0.7]) P.rect(zA, zB, v0, v0 + 0.012, '#1a1a1a');
      break;
    case 'gradient': {
      const grad = g.createLinearGradient(0, 0, W, 0);
      grad.addColorStop(0, acc); grad.addColorStop(0.55, toCss(base)); grad.addColorStop(1, toCss(base));
      g.fillStyle = grad;
      g.fillRect(0, 0, W, H);
      break;
    }
    case 'checker': {
      const s = H * 0.022;
      for (const [v0, v1] of [[0.13, 0.24], [0.76, 0.87]]) {
        for (let x = 0, i = 0; x < W; x += s, i++) {
          for (let y = Y(v1), j = 0; y < Y(v0); y += s, j++) {
            g.fillStyle = (i + j) % 2 ? '#111111' : '#f4f4f4';
            g.fillRect(x, y, s + 0.5, s + 0.5);
          }
        }
      }
      // 引擎盖上一块棋盘格
      for (let x = X(lerp(zA, zB, 0.72)), i = 0; x < W; x += s, i++) {
        for (let y = Y(0.56), j = 0; y < Y(0.44); y += s, j++) {
          g.fillStyle = (i + j) % 2 ? '#111111' : acc;
          g.fillRect(x, y, s + 0.5, s + 0.5);
        }
      }
      break;
    }
    case 'camo': {
      const tones = [shadeCss(base, -0.18), acc, shadeCss(base, 0.14), shadeCss(accentHex, -0.2)];
      for (let i = 0; i < 170; i++) {
        g.fillStyle = tones[i % tones.length];
        g.beginPath();
        g.ellipse(rng() * W, rng() * H, (0.02 + rng() * 0.05) * W, (0.012 + rng() * 0.03) * H, rng() * Math.PI, 0, Math.PI * 2);
        g.fill();
      }
      break;
    }
    case 'flames': {
      // 从车头往后烧的火舌：两侧和引擎盖各一组
      for (const [vc, hv] of [[0.25, 0.1], [0.75, 0.1], [0.5, 0.06]]) {
        for (let k = 0; k < 6; k++) {
          const off = (k / 5 - 0.5) * 2 * hv;
          const len = 0.35 + rng() * 0.3, half = (0.018 + rng() * 0.014) * H;
          const front = W, tip = W * (1 - len), yc = Y(vc + off);
          const grad = g.createLinearGradient(front, 0, tip, 0);
          grad.addColorStop(0, '#fff06a'); grad.addColorStop(0.4, '#ff8a1c'); grad.addColorStop(1, '#d8261c');
          g.fillStyle = grad;
          g.beginPath();
          g.moveTo(front, yc - half);
          g.quadraticCurveTo(lerp(front, tip, 0.55), yc - half * 1.3, tip, yc + half * 0.4);
          g.quadraticCurveTo(lerp(front, tip, 0.45), yc + half * 1.1, front, yc + half);
          g.closePath();
          g.fill();
          g.strokeStyle = acc;
          g.lineWidth = H * 0.003;
          g.stroke();
        }
      }
      break;
    }
    case 'lightning':
      for (const vc of [0.24, 0.76]) {
        g.beginPath();
        let x = X(zA), dir = 1;
        g.moveTo(x, Y(vc));
        while (x < W) {
          x += W * (0.06 + rng() * 0.05);
          dir = -dir;
          g.lineTo(Math.min(x, W), Y(vc + dir * 0.04));
        }
        g.strokeStyle = '#111111'; g.lineWidth = H * 0.028; g.lineJoin = 'miter'; g.stroke();
        g.strokeStyle = acc; g.lineWidth = H * 0.016; g.stroke();
      }
      break;
    case 'police': {
      // 黑白警车：黑色车身、白色车门，侧面写 POLICE，腰线一道蓝条
      const L = zB - zA, d0 = zA + L * 0.3, d1 = zA + L * 0.72;
      P.rect(d0, d1, 0.1, 0.4, '#f4f4f4'); P.rect(d0, d1, 0.6, 0.9, '#f4f4f4');
      P.rect(zA, zB, 0.12, 0.14, '#1f5fbf'); P.rect(zA, zB, 0.86, 0.88, '#1f5fbf');
      P.rect(zA + L * 0.72, zB, 0.46, 0.54, '#f4f4f4');
      P.sideText('POLICE', (d0 + d1) / 2, 0.06, '#111111', { vLeft: 0.27 });
      P.sideText('警察', (d0 + d1) / 2, 0.045, '#1f5fbf', { vLeft: 0.18 });
      break;
    }
    default:
  }
}

    // 宽体轮眉

    g.add(box(0.05, 0.1, 0.01, mat(0xf2c230), 0.42, 0.34, -2.15));

    for (const [z, front] of [[1.3, true], [-1.25, false]]) {

  // 美式肌肉车：长车头短车尾的敞篷，镀铬保险杠、圆形大灯、引擎盖进气口、白色赛道条纹、侧排气
  muscle(color, look) {
    const st = [
      [-2.45, 0.34, 0.86, 0.9, 0.86, 6], [-2.3, 0.26, 0.94, 0.97, 0.92, 6], [-1.4, 0.24, 0.96, 0.99, 0.93, 6],

      } else paintPattern(P, st, look, color);
      P.rect(-3, 3, 0, 0.09, '#141414'); P.rect(-3, 3, 0.91, 1, '#141414');
      P.round(-0.86, 0.45, 0.33, 0.67, 24, '#1b1512');    // 真皮座舱
      P.sideText('V8', 1.7, 0.05, '#f4f4f4', { vLeft: 0.3 });
      // 分缝线：长车门、前盖、后备箱盖、门把手、油箱盖
      sideLines(P, [[-0.9, -0.888, 0.12, 0.4], [0.62, 0.632, 0.12, 0.4], [-0.45, -0.3, 0.36, 0.372]]);
      P.rect(0.9, 0.912, 0.4, 0.6, '#0000004a'); P.rect(-1.62, -1.608, 0.4, 0.6, '#0000004a');
      P.sideDisc(-1.9, 0.36, 0.035, '#c9ccd1');
      P.sideText('PELICAN', -0.2, 0.05, '#f4f4f4', { vLeft: 0.22, font: 'italic 900' });
    });
    const g = new THREE.Group();
    const wheels = [];
    const arches = [[1.45, 0.36, 0.45], [-1.45, 0.38, 0.47]];
    g.add(mesh(loftGeometry(st, { arches, archInner: 0.62, open: { rear: true } }), paintMaterial(tex)));
    const paint = paintMat(color);
    // 车尾：嵌进车身的黑色尾灯板（镀铬包边）、中间的圆形车标、后备箱分缝、牌照凹槽
    g.add(endPanel(st, 'rear', (P) => {

      P.round(-0.17, 0.17, 0.445, 0.55, 0.01, '#f2c230');

      P.line([[-0.8, 0.848], [0.8, 0.848]]);
    }));
    // 引擎盖进气口
    g.add(rbox(0.5, 0.12, 0.7, 0.05, paint, 0, 0.97, 1.35), box(0.4, 0.07, 0.02, PM.grille, 0, 0.98, 1.71));
    // 挡风玻璃 + 镀铬框、折叠的软顶
    g.add(windshield(1.6, 0.48, 0.85, 0.1, PM.glass, 0, 1.13, 0.45));
    g.add(tube([[-0.8, 0.95, 0.55], [-0.79, 1.28, 0.17], [0, 1.3, 0.27], [0.79, 1.28, 0.17], [0.8, 0.95, 0.55]], 0.02, PM.chrome, 20, 6));
    g.add(ell(PM.rubber, 0, 0.95, -1.0, 0.82, 0.13, 0.26));
    // 前脸：格栅、圆灯、镀铬保险杠
    g.add(rbox(1.62, 0.34, 0.06, 0.05, PM.grille, 0, 0.62, 2.47));
    for (let i = 0; i < 5; i++) g.add(box(1.4, 0.012, 0.02, PM.chrome, 0, 0.5 + i * 0.06, 2.5));
    for (const s of [-1, 1]) roundLamp(g, s * 0.62, 0.64, 2.5, 0.11, PM.headlight, PM.chrome);
    g.add(rbox(1.9, 0.1, 0.12, 0.04, PM.chrome, 0, 0.34, 2.52));
    // 尾部：四个嵌在尾灯板里的圆形尾灯（镀铬灯圈）、中间圆形车标、贴着车身的镀铬保险杠（两端包角 + 护杠）、鸭尾扰流
    for (const s of [-1, 1]) for (const x of [0.4, 0.66]) roundLamp(g, s * x, 0.72, -2.43, 0.078, PM.taillight, PM.chrome, -1);
    g.add(cyl(0.06, 0.06, 0.02, PM.chrome, 0, 0.72, -2.43, Math.PI / 2), cyl(0.045, 0.045, 0.022, mat(0xb01818), 0, 0.72, -2.435, Math.PI / 2));
    g.add(rbox(1.7, 0.085, 0.09, 0.035, PM.chrome, 0, 0.43, -2.47));
    for (const s of [-1, 1]) {
      g.add(rbox(0.09, 0.085, 0.34, 0.035, PM.chrome, s * 0.86, 0.43, -2.34, 0, s * 0.45));

    g.add(rbox(1.8, 0.05, 0.28, 0.02, paint, 0, 0.97, -2.3, 0.18));

    for (const s of [-1, 1]) {

    mirrorPair(g, PM.chrome, 1.0, 1.0, 0.5, 0.12);
    bake(g);
    for (const [z, front, r, wd] of [[1.45, true, 0.36, 0.28], [-1.45, false, 0.38, 0.36]]) {
      for (const s of [-1, 1]) {
        const w = makeWheel(r, wd, { rim: PM.chrome, style: 'dish', spokes: 5, caliper: 0x333333, stripe: '#e8e8e8', rimRatio: 0.62 });

  },

  // 卡丁车：钢管车架、前鼻整流罩和号码牌、侧箱、座椅、单缸发动机（散热片）+ 弯曲的排气管
  kart(color, look) {
    const g = new THREE.Group();
    const wheels = [];
    const paint = paintMat(color);
    const rail = (pts) => g.add(tube(pts, 0.016, PM.steel, 24, 6));
    for (const s of [-1, 1]) {
      rail([[s * 0.28, 0.1, -0.75], [s * 0.3, 0.09, 0], [s * 0.26, 0.1, 0.55], [s * 0.18, 0.12, 0.85]]);
      rail([[s * 0.3, 0.12, 0.3], [s * 0.7, 0.14, 0.2], [s * 0.72, 0.14, -0.25], [s * 0.3, 0.12, -0.35]]);   // 侧护杠
    }
    rail([[-0.62, 0.12, 0.62], [0, 0.11, 0.62], [0.62, 0.12, 0.62]]);
    rail([[-0.66, 0.12, -0.6], [0, 0.11, -0.6], [0.66, 0.12, -0.6]]);
    rail([[-0.5, 0.18, -0.95], [-0.6, 0.18, -0.85], [0.6, 0.18, -0.85], [0.5, 0.18, -0.95], [-0.5, 0.18, -0.95]]);   // 后保险杠
    // 前鼻整流罩 + 前挡板号码牌
    const nose = [[0.45, 0.09, 0.2, 0.32, 0.26, 3], [0.8, 0.08, 0.26, 0.42, 0.34, 3], [1.02, 0.1, 0.24, 0.44, 0.36, 3], [1.12, 0.12, 0.2, 0.36, 0.3, 3]];
    const noseTex = livery(nose, (P) => {
      P.rect(-3, 3, 0, 1, toCss(color));
      if (look.pattern === 'stock') P.rect(-3, 3, 0.47, 0.53, '#ffffff'); else paintPattern(P, nose, look, color);
    });
    g.add(mesh(loftGeometry(nose, { rings: 20, seg: 28 }), paintMaterial(noseTex)));
    const plate = canvasTexture(128, (c, w, h) => {
      c.fillStyle = '#fff'; c.beginPath(); c.roundRect(4, 4, w - 8, h - 8, 14); c.fill();
      c.fillStyle = '#111'; c.font = 'bold 80px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('5', w / 2, h / 2 + 4);
    }, { height: 96 });
    plate.wrapS = plate.wrapT = THREE.ClampToEdgeWrapping;
    const plateMesh = mesh(new THREE.PlaneGeometry(0.34, 0.26), new THREE.MeshStandardMaterial({ map: plate, roughness: 0.6 }));
    plateMesh.position.set(0, 0.4, 0.52);
    plateMesh.rotation.x = -0.35;
    g.add(plateMesh, box(0.36, 0.28, 0.02, paint, 0, 0.4, 0.51, -0.35));
    // 侧箱
    for (const s of [-1, 1]) {
      const pod = [[-0.42, 0.09, 0.2, 0.14, 0.1, 3], [-0.3, 0.08, 0.3, 0.16, 0.12, 3.5], [0.2, 0.08, 0.3, 0.16, 0.12, 3.5], [0.32, 0.09, 0.22, 0.12, 0.08, 3]];
      const pm = mesh(loftGeometry(pod, { rings: 16, seg: 24 }), paint);
      pm.position.x = s * 0.52;
      g.add(pm);
    }
    // 座椅、转向柱、踏板
    g.add(ell(PM.seat, 0, 0.2, -0.3, 0.24, 0.12, 0.24), ell(PM.seat, 0, 0.42, -0.45, 0.22, 0.26, 0.07, -0.3));
    g.add(tube([[0, 0.12, 0.62], [0, 0.3, 0.45], [0, 0.44, 0.38]], 0.014, PM.steel, 6, 6));
    for (const x of [-0.1, 0.1]) g.add(box(0.06, 0.1, 0.02, PM.steel, x, 0.2, 0.62, -0.4));
    // 发动机：缸体 + 散热片 + 化油器 + 排气管 + 链条护罩
    g.add(box(0.2, 0.22, 0.24, PM.darkMetal, -0.38, 0.26, -0.55));
    for (let i = 0; i < 6; i++) g.add(cyl(0.11, 0.11, 0.012, PM.steel, -0.38, 0.4 + i * 0.03, -0.55));
    g.add(cyl(0.06, 0.06, 0.18, paint, -0.2, 0.34, -0.5, 0, 0, Math.PI / 2));
    g.add(tube([[-0.38, 0.35, -0.44], [-0.55, 0.3, -0.3], [-0.6, 0.22, -0.55], [-0.52, 0.22, -0.85], [-0.46, 0.24, -0.98]], 0.035, PM.steel, 24, 8));
    g.add(box(0.03, 0.2, 0.35, PM.carbon, -0.52, 0.15, -0.6));
    g.add(cyl(0.03, 0.03, 0.02, PM.exhaust, -0.46, 0.24, -0.99, Math.PI / 2));
    g.add(box(0.16, 0.06, 0.03, PM.taillight, 0.3, 0.2, -0.97));
    bake(g);
    for (const [z, front, r, wd, x] of [[0.62, true, 0.14, 0.13, 0.6], [-0.6, false, 0.15, 0.2, 0.64]]) {
      for (const s of [-1, 1]) {
        const w = makeWheel(r, wd, { rim: PM.metal, style: 'solid', spokes: 6, disc: false, rimRatio: 0.62 });
        w.steer.position.set(x * s, r, z);
        w.front = front;
        bake(w.spin); bake(w.steer);
        g.add(w.steer);
        wheels.push(w);
      }
    }
    return { group: g, wheels, seat: v(0, 0.12, -0.24), pelScale: 0.85, wheelPos: v(0, 0.48, 0.34), wheelTilt: -0.8, wheelR: 0.12, wheelStyle: 'f1', exhausts: [v(-0.46, 0.24, -1.0)], tails: [v(0.3, 0.2, -1.0)], half: [0.72, 1.05], camH: 1.7, camD: 4.6 };
  },
